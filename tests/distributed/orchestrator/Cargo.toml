[package]
name = "distributed-test-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Distributed MCP test orchestrator using AI subagents"

[[bin]]
name = "distributed-test-orchestrator"
path = "main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# HTTP client for MCP and Anthropic API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Template rendering for agent prompts
handlebars = "6"

# Time and dates
chrono = { version = "0.4", features = ["serde"] }

# UUID for test run IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Async synchronization
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
