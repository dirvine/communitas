[application]

# App (Project) Name
name = "Communitas"

# Dioxus App Default Platform
# web, desktop, fullstack
default_platform = "desktop"

# `build` & `serve` dist path
out_dir = "dist"

# assets file folder
asset_dir = "assets"

# ─────────────────────────────────────────────────────────────────────────────
# Bundle Configuration (for dx bundle)
# ─────────────────────────────────────────────────────────────────────────────

[bundle]
# Unique app identifier (reverse domain notation)
identifier = "com.maidsafe.communitas"

# Publisher/organization name
publisher = "MaidSafe"

# App icons - PNG for cross-platform, icns for macOS
icon = ["assets/icon.png", "assets/icon.icns"]

# Application category (macOS App Store category)
category = "public.app-category.social-networking"

# Short description (shown in installers)
short_description = "Decentralized collaboration platform"

# Full description
long_description = """
Communitas is a local-first, post-quantum ready collaboration platform that combines
messaging, file sharing, video calls, and project management into one decentralized
application. No servers, no surveillance, no central authority.
"""

# Copyright notice
copyright = "Copyright 2024-2026 MaidSafe. All rights reserved."

[bundle.macos]
# Minimum macOS version (Big Sur+ for best WebView2 support)
minimum_system_version = "11.0"

# Enable hardened runtime (required for notarization)
hardened_runtime = true

# Entitlements file for sandbox permissions
entitlements = "entitlements.plist"

# Additional frameworks to link (if needed)
# frameworks = []

# Exception domains for App Transport Security (if needed)
# exception_domain = "localhost"

# ─────────────────────────────────────────────────────────────────────────────
# Auto-Updater Configuration
# ─────────────────────────────────────────────────────────────────────────────

[bundle.updater]
# Enable the auto-updater
active = true

# Update manifest endpoints (GitHub Releases)
# The app will check these URLs for update.json manifest
endpoints = [
    "https://github.com/saorsa-labs/communitas/releases/latest/download/update.json"
]

# Public key for verifying update signatures
# TODO: Generate Ed25519 keypair with `tauri signer generate` and populate:
# - pubkey here (public key)
# - TAURI_SIGNING_PRIVATE_KEY GitHub secret (private key)
# - Sign artifacts in CI with `tauri signer sign`
# Until then, auto-update checks for new versions but cannot verify signatures.
pubkey = ""

# Update dialog configuration
# dialog = true  # Show native dialog for updates (default: true)

# Windows-specific updater settings
[bundle.updater.windows]
# Install mode: basicUi, quiet, or passive
install_mode = "passive"

[web.app]

# HTML title tag content
title = "communitas-dioxus"

[web.watcher]

# when watcher trigger, regenerate the `index.html`
reload_html = true

# which files or dirs will be watcher monitoring
watch_path = ["src", "assets"]

# include `assets` in web platform
[web.resource]

# CSS style file

style = []

# Javascript code file
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
