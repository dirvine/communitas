[package]
name = "communitas-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core business logic for Communitas - PQC collaboration with virtual disks"

[lib]
name = "communitas_bindings"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Saorsa Gossip - P2P networking layer (required, no longer optional)
saorsa-gossip-types.workspace = true
saorsa-gossip-identity.workspace = true
saorsa-gossip-crdt-sync.workspace = true
saorsa-gossip-groups.workspace = true
saorsa-gossip-presence.workspace = true
saorsa-gossip-transport.workspace = true
saorsa-gossip-membership.workspace = true
saorsa-gossip-pubsub.workspace = true
saorsa-gossip-coordinator.workspace = true
saorsa-gossip-rendezvous.workspace = true
saorsa-gossip-runtime.workspace = true

# Real-time multimedia (WebRTC over QUIC) - Using core library
saorsa-webrtc-core.workspace = true
saorsa-webrtc-codecs.workspace = true

# OpenH264: Using 0.8.0 until CI upgrades to rustc 1.88+ (0.9.x requires 1.88)
# TODO: Upgrade to 0.9.x when CI rustc is updated to fix RUSTSEC-2025-0008
openh264-sys2.workspace = true

# Post-quantum cryptography - saorsa-pqc re-exports fips203/fips204
# Use saorsa_pqc::{ml_dsa_65, ml_kem_768, dsa_traits, kem_traits}
saorsa-pqc = "0.3.14"

# CRDT for document collaboration (Sprint 3.2)
# sync feature enables Send + Sync traits for multithreaded environments
yrs = { version = "0.19", features = ["sync"] }

# Markdown rendering and sanitization
pulldown-cmark = "0.12"
ammonia = "4.0"

# Async runtime
tokio = { version = "1.39", features = ["full"] }
tokio-retry = "0.3"  # Exponential backoff for resilient retries (MESH_CAPABILITIES.md §3.2)
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"  # Replace deprecated serde_cbor
serde_bytes = "0.11"
bincode = "1.3"
toml = "0.8"
bytes = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# OpenTelemetry (optional, enabled via "metrics" feature)
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# WebAuthn for passkey/biometric authentication
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# Cryptography and security
blake3 = "1.0"
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"  # For deterministic key generation from identity seed
# ed25519-dalek = "2"  # REMOVED: Using post-quantum ML-DSA from saorsa-pqc instead
argon2 = "0.5"
zeroize = "1.7"
secrecy = "0.8"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
url = "2.5"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
four-word-networking = "2.6"
getrandom = "0.2"
base64 = "0.22"
regex = "1.10"
lazy_static = "1.4"
validator = { version = "0.20", features = ["derive"] }
local-ip-address = "0.6"
dirs = "5.0"
keyring = "3.2"
tempfile = "3.0"
sysinfo = "0.30"



# Compression
flate2 = "1.0"

# Erasure coding
reed-solomon-erasure = "6.0.0"

# File operations
mime_guess = "2.0"

# Local dependencies (version required for crates.io publishing)
communitas-kanban = { version = "=0.8.2", path = "../communitas-kanban" }

[features]
default = []
metrics = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
tempfile = "3.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["ring"] }
serial_test = "3"
# libfuzzer-sys removed - causes link failures on Linux CI
# Add back when fuzz targets are created in a dedicated fuzz/ directory
