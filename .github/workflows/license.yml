name: License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-headers:
    name: SPDX License Headers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check SPDX headers in Rust source files
        run: |
          EXPECTED="// SPDX-License-Identifier: MIT OR Apache-2.0"
          MISSING=()
          while IFS= read -r file; do
            if ! head -5 "$file" | grep -qF "SPDX-License-Identifier"; then
              MISSING+=("$file")
            fi
          done < <(find . -name '*.rs' -not -path '*/target/*' -not -path '*/workspace-hack/*')

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::${#MISSING[@]} file(s) missing SPDX license header"
            echo ""
            echo "Expected header (within first 5 lines):"
            echo "  $EXPECTED"
            echo ""
            echo "Files missing header:"
            for f in "${MISSING[@]}"; do
              echo "  $f"
            done
            exit 1
          fi
          echo "All ${count:-$(find . -name '*.rs' -not -path '*/target/*' -not -path '*/workspace-hack/*' | wc -l)} Rust files have SPDX headers"

  dependency-licenses:
    name: Dependency License Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev pkg-config \
            libgtk-3-dev libsoup-3.0-dev \
            libpipewire-0.3-dev libasound2-dev libdbus-1-dev libxdo-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check dependency licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

      - name: Check sources
        run: cargo deny check sources
