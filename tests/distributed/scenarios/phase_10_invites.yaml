# Phase 10: Invites
# Tests invite creation and acceptance

name: "Phase 10: Invites"
description: "Tests invite creation, acceptance, and listing for entity membership"
tools_covered:
  - create_invite
  - accept_invite
  - list_pending_invites

test_cases:
  # Create a new entity for invite testing
  - id: INV-001
    name: "Alice creates new project for invite testing"
    actors: [alice]
    steps:
      - tool: create_entity
        params:
          name: "Secret Project"
          entity_type: "project"
        expect:
          status: success
        store:
          secret_project_id: id

  # Create invite for Bob
  - id: INV-002
    name: "Alice invites Bob to project"
    actors: [alice]
    steps:
      - tool: create_invite
        params:
          entity_id: "${secret_project_id}"
          recipient_id: "${bob_identity}"
          role: "admin"
          message: "Join our secret project!"
        expect:
          status: success
        store:
          bob_invite_id: id

  # Create invite for Charlie
  - id: INV-003
    name: "Alice invites Charlie to project"
    actors: [alice]
    steps:
      - tool: create_invite
        params:
          entity_id: "${secret_project_id}"
          recipient_id: "${charlie_identity}"
          role: "member"
        expect:
          status: success
        store:
          charlie_invite_id: id

  # Create invite for Dave
  - id: INV-004
    name: "Alice invites Dave to project"
    actors: [alice]
    steps:
      - tool: create_invite
        params:
          entity_id: "${secret_project_id}"
          recipient_id: "${dave_identity}"
          role: "member"
        expect:
          status: success
        store:
          dave_invite_id: id

  # Bob lists pending invites
  - id: INV-005
    name: "Bob lists pending invites"
    actors: [bob]
    wait_ms: 3000
    steps:
      - tool: list_pending_invites
        expect:
          status: success
          contains:
            - entity_name: "Secret Project"

  # Bob accepts invite
  - id: INV-006
    name: "Bob accepts invite"
    actors: [bob]
    steps:
      - tool: accept_invite
        params:
          invite_id: "${bob_invite_id}"
        expect:
          status: success

  # Charlie accepts invite
  - id: INV-007
    name: "Charlie accepts invite"
    actors: [charlie]
    steps:
      - tool: accept_invite
        params:
          invite_id: "${charlie_invite_id}"
        expect:
          status: success

  # Dave accepts invite
  - id: INV-008
    name: "Dave accepts invite"
    actors: [dave]
    steps:
      - tool: accept_invite
        params:
          invite_id: "${dave_invite_id}"
        expect:
          status: success

  # Verify all are members
  - id: INV-009
    name: "Verify all members joined"
    actors: [alice]
    wait_ms: 5000
    steps:
      - tool: list_members
        params:
          entity_id: "${secret_project_id}"
        expect:
          status: success

  # Verify Bob has admin role
  - id: INV-010
    name: "Verify Bob's admin role"
    actors: [bob]
    steps:
      - tool: list_members
        params:
          entity_id: "${secret_project_id}"
        expect:
          status: success
          contains:
            - role: "admin"

  # Test double-accept prevention
  - id: INV-011
    name: "Cannot accept already accepted invite"
    actors: [bob]
    steps:
      - tool: accept_invite
        params:
          invite_id: "${bob_invite_id}"
        expect:
          status: error
          error_contains: "already"

  # All members can access project
  - id: INV-012
    name: "All members can access project"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: get_entity
        params:
          entity_id: "${secret_project_id}"
        expect:
          status: success
          fields:
            name: "Secret Project"
