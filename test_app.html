<!DOCTYPE html>
<html>
<head>
    <title>Communitas Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: #1e1e1e;
            color: white;
        }
        .status { margin: 10px 0; padding: 10px; background: #333; border-radius: 5px; }
        .success { background: #2a4e2a; }
        .error { background: #4e2a2a; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #console {
            background: black;
            color: #0f0;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Communitas App Test</h1>

    <div class="status">
        <h2>Test Status</h2>
        <button onclick="checkApp()">Check App Status</button>
        <button onclick="testTauri()">Test Tauri API</button>
        <button onclick="clearConsole()">Clear Console</button>
    </div>

    <div id="console"></div>

    <script>
        const consoleDiv = document.getElementById('console');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f44' : type === 'success' ? '#4f4' : '#fff';
            consoleDiv.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() {
            consoleDiv.innerHTML = '';
        }

        async function checkApp() {
            log('Checking app status...');

            // Check Vite server
            try {
                const response = await fetch('http://localhost:1422/');
                log(`✓ Vite server responding: ${response.status}`, 'success');

                const text = await response.text();
                if (text.includes('<div id="root">')) {
                    log('✓ Root element found', 'success');
                } else {
                    log('✗ Root element not found', 'error');
                }
            } catch (error) {
                log(`✗ Vite server error: ${error.message}`, 'error');
            }

            // Check if main.tsx loads
            try {
                const response = await fetch('http://localhost:1422/src/main.tsx');
                const text = await response.text();
                if (text.includes('ReactDOM')) {
                    log('✓ main.tsx loads correctly', 'success');
                } else {
                    log('✗ main.tsx not loading properly', 'error');
                }
            } catch (error) {
                log(`✗ main.tsx error: ${error.message}`, 'error');
            }

            // Check for JavaScript errors
            log('\nOpening app in iframe to check for errors...');
            const iframe = document.createElement('iframe');
            iframe.src = 'http://localhost:1422/';
            iframe.style.width = '100%';
            iframe.style.height = '500px';
            iframe.style.border = '1px solid #555';
            iframe.style.marginTop = '20px';

            iframe.onload = () => {
                log('✓ App loaded in iframe', 'success');
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const rootEl = iframeDoc.getElementById('root');
                    if (rootEl && rootEl.children.length > 0) {
                        log('✓ React app rendered successfully!', 'success');
                        log(`Root element has ${rootEl.children.length} child elements`, 'success');
                    } else {
                        log('✗ React app not rendering (root is empty)', 'error');
                    }
                } catch (e) {
                    log(`Cannot access iframe content (CORS): ${e.message}`, 'error');
                }
            };

            document.body.appendChild(iframe);
        }

        async function testTauri() {
            log('Testing Tauri API...');

            // Check if we're in Tauri context
            if (window.__TAURI__) {
                log('✓ Tauri API detected', 'success');

                try {
                    const { invoke } = window.__TAURI__.tauri;
                    const result = await invoke('greet', { name: 'Test' });
                    log(`✓ Tauri invoke successful: ${result}`, 'success');
                } catch (error) {
                    log(`✗ Tauri invoke error: ${error}`, 'error');
                }
            } else {
                log('✗ Not running in Tauri context (expected in browser)', 'error');
                log('Open http://localhost:1422 directly to see the app', 'info');
            }
        }

        // Auto-check on load
        window.onload = () => {
            log('Test page loaded', 'info');
            log('Click "Check App Status" to begin tests', 'info');
        };
    </script>
</body>
</html>
