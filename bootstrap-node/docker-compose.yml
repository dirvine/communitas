# Docker Compose configuration for Communitas Bootstrap Node

version: '3.8'

services:
  bootstrap:
    image: communitas/bootstrap:latest
    container_name: communitas-bootstrap
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000/udp"  # QUIC protocol
      - "7001:7001/tcp"  # Prometheus metrics
    environment:
      - RUST_LOG=info,communitas_bootstrap=debug
      - BOOTSTRAP_MODE=true
      - PUBLIC_IP=${PUBLIC_IP:-auto}
      - METRICS_ENABLED=true
    volumes:
      - ./data:/data
      - ./config:/config
    restart: unless-stopped
    networks:
      - communitas-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  prometheus:
    image: prom/prometheus:latest
    container_name: communitas-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - communitas-net
      
  grafana:
    image: grafana/grafana:latest
    container_name: communitas-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: unless-stopped
    networks:
      - communitas-net
    depends_on:
      - prometheus

  # Optional: Node exporter for host metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: communitas-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - communitas-net

networks:
  communitas-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data: