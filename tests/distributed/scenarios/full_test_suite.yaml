# Full MCP Test Suite - All 77 Tools
# Tests 100% of Communitas app features through MCP
# Uses store/variable syntax to pass IDs between tests

name: "Full MCP Test Suite"
description: "Comprehensive test of all 77 MCP tools across distributed nodes"
tools_covered:
  - health_check
  - core_status
  - create_vault
  - authenticate
  - authenticate_token
  - get_profile
  - create_entity
  - get_entity
  - list_entities
  - join_entity
  - add_member
  - remove_member
  - list_members
  - send_message
  - get_messages
  - create_thread
  - get_thread_messages
  - write_file
  - read_file
  - list_files
  - delete_file
  - get_disk_stats
  - create_kanban_board
  - get_kanban_board
  - update_kanban_board
  - list_kanban_boards
  - delete_kanban_board
  - create_kanban_column
  - get_kanban_column
  - update_kanban_column
  - move_kanban_column
  - list_kanban_columns
  - delete_kanban_column
  - create_kanban_card
  - get_kanban_card
  - update_kanban_card
  - move_kanban_card
  - list_kanban_cards
  - delete_kanban_card
  - create_kanban_tag
  - list_kanban_tags
  - tag_card
  - untag_card
  - add_step
  - get_step
  - toggle_step
  - delete_step
  - add_comment
  - list_comments
  - delete_comment
  - assign_user
  - unassign_user
  - change_card_state
  - create_contact
  - get_contact
  - update_contact
  - delete_contact
  - link_contact
  - list_contacts
  - search_contacts
  - set_favourite_contact
  - remove_favourite_contact
  - list_favourite_contacts
  - network_start
  - network_stop
  - network_status
  - network_peers
  - network_connect
  - network_disconnect
  - network_request_external_address
  - create_website
  - get_website
  - update_website
  - delete_website
  - create_invite
  - accept_invite
  - list_pending_invites

test_cases:
  # ============================================
  # PHASE 1: AUTHENTICATION (6 tools)
  # ============================================

  - id: AUTH-001
    name: "Health check all nodes"
    actors: [alice, bob, dave]
    parallel: true
    steps:
      - tool: health_check
        expect:
          status: success

  - id: AUTH-002
    name: "Core status before auth"
    actors: [alice]
    steps:
      - tool: core_status
        expect:
          status: success

  - id: AUTH-003
    name: "Create vault for Alice"
    actors: [alice]
    steps:
      - tool: create_vault
        params:
          four_words: "ocean-forest-moon-star"
          password: "test-pass-alice"
          display_name: "Alice Anderson"
        expect:
          status: success

  - id: AUTH-004
    name: "Create vault for Bob"
    actors: [bob]
    steps:
      - tool: create_vault
        params:
          four_words: "river-mountain-sun-cloud"
          password: "test-pass-bob"
          display_name: "Bob Builder"
        expect:
          status: success

  - id: AUTH-005
    name: "Create vault for Dave"
    actors: [dave]
    steps:
      - tool: create_vault
        params:
          four_words: "field-hill-fire-snow"
          password: "test-pass-dave"
          display_name: "Dave Davis"
        expect:
          status: success

  - id: AUTH-006
    name: "Re-authenticate Alice"
    actors: [alice]
    steps:
      - tool: authenticate
        params:
          four_words: "ocean-forest-moon-star"
          password: "test-pass-alice"
        expect:
          status: success

  - id: AUTH-007
    name: "Get profile for Alice"
    actors: [alice]
    steps:
      - tool: get_profile
        expect:
          status: success

  # ============================================
  # PHASE 2: ENTITIES & MEMBERS (7 tools)
  # ============================================

  - id: ENT-001
    name: "Alice creates an organisation"
    actors: [alice]
    steps:
      - tool: create_entity
        params:
          name: "Acme Corp"
          entity_type: "organisation"
        store:
          entity_id: "id"
        expect:
          status: success

  - id: ENT-002
    name: "Alice lists entities"
    actors: [alice]
    steps:
      - tool: list_entities
        expect:
          status: success

  - id: ENT-003
    name: "Alice gets entity details"
    actors: [alice]
    steps:
      - tool: get_entity
        params:
          entity_id: "${entity_id}"
        expect:
          status: success

  - id: ENT-004
    name: "Alice lists members"
    actors: [alice]
    steps:
      - tool: list_members
        params:
          entity_id: "${entity_id}"
          entity_type: "organisation"
        expect:
          status: success

  # ============================================
  # PHASE 3: MESSAGING (4 tools)
  # ============================================

  - id: MSG-001
    name: "Alice sends a message"
    actors: [alice]
    steps:
      - tool: send_message
        params:
          entity_id: "${entity_id}"
          entity_type: "organisation"
          text: "Hello from Alice!"
        store:
          message_id: "id"
        expect:
          status: success

  - id: MSG-002
    name: "Alice gets messages"
    actors: [alice]
    steps:
      - tool: get_messages
        params:
          entity_id: "${entity_id}"
        expect:
          status: success

  # NOTE: create_thread and get_thread_messages require channel_id and parent_message_id
  # These are for threaded replies within a channel, not general discussion creation

  # ============================================
  # PHASE 4: FILES / VIRTUAL DISK (5 tools)
  # ============================================

  - id: FILE-001
    name: "Alice writes a file"
    actors: [alice]
    steps:
      - tool: write_file
        params:
          entity_id: "${entity_id}"
          disk_type: "private"
          path: "/test/hello.txt"
          content: "Hello, World!"
        expect:
          status: success

  - id: FILE-002
    name: "Alice reads the file"
    actors: [alice]
    steps:
      - tool: read_file
        params:
          entity_id: "${entity_id}"
          disk_type: "private"
          path: "/test/hello.txt"
        expect:
          status: success

  - id: FILE-003
    name: "Alice lists files"
    actors: [alice]
    steps:
      - tool: list_files
        params:
          entity_id: "${entity_id}"
          disk_type: "private"
          path: "/test"
        expect:
          status: success

  - id: FILE-004
    name: "Alice gets disk stats"
    actors: [alice]
    steps:
      - tool: get_disk_stats
        params:
          entity_id: "${entity_id}"
          disk_type: "private"
        expect:
          status: success

  - id: FILE-005
    name: "Alice deletes the file"
    actors: [alice]
    steps:
      - tool: delete_file
        params:
          entity_id: "${entity_id}"
          disk_type: "private"
          path: "/test/hello.txt"
        expect:
          status: success

  # ============================================
  # PHASE 5: KANBAN (25 tools)
  # ============================================

  - id: KAN-001
    name: "Alice creates a kanban board"
    actors: [alice]
    steps:
      - tool: create_kanban_board
        params:
          name: "Project Alpha"
          description: "Main project board"
        store:
          board_id: "id"
        expect:
          status: success

  - id: KAN-002
    name: "Alice lists kanban boards"
    actors: [alice]
    steps:
      - tool: list_kanban_boards
        params:
          entity_id: "${entity_id}"
        expect:
          status: success

  - id: KAN-003
    name: "Alice gets kanban board"
    actors: [alice]
    steps:
      - tool: get_kanban_board
        params:
          board_id: "${board_id}"
        expect:
          status: success

  - id: KAN-004
    name: "Alice updates kanban board"
    actors: [alice]
    steps:
      - tool: update_kanban_board
        params:
          board_id: "${board_id}"
          name: "Project Alpha v2"
        expect:
          status: success

  - id: KAN-005
    name: "Alice creates a column"
    actors: [alice]
    steps:
      - tool: create_kanban_column
        params:
          board_id: "${board_id}"
          name: "To Do"
        store:
          todo_column_id: "id"
        expect:
          status: success

  - id: KAN-006
    name: "Alice creates another column"
    actors: [alice]
    steps:
      - tool: create_kanban_column
        params:
          board_id: "${board_id}"
          name: "Done"
        store:
          done_column_id: "id"
        expect:
          status: success

  - id: KAN-007
    name: "Alice lists columns"
    actors: [alice]
    steps:
      - tool: list_kanban_columns
        params:
          board_id: "${board_id}"
        expect:
          status: success

  - id: KAN-008
    name: "Alice gets column"
    actors: [alice]
    steps:
      - tool: get_kanban_column
        params:
          board_id: "${board_id}"
          column_id: "${todo_column_id}"
        expect:
          status: success

  - id: KAN-009
    name: "Alice updates column"
    actors: [alice]
    steps:
      - tool: update_kanban_column
        params:
          board_id: "${board_id}"
          column_id: "${todo_column_id}"
          name: "Backlog"
        expect:
          status: success

  - id: KAN-010
    name: "Alice creates a card"
    actors: [alice]
    steps:
      - tool: create_kanban_card
        params:
          board_id: "${board_id}"
          column_id: "${todo_column_id}"
          title: "First Task"
          description: "This is the first task"
        store:
          card_id: "id"
        expect:
          status: success

  - id: KAN-011
    name: "Alice lists cards"
    actors: [alice]
    steps:
      - tool: list_kanban_cards
        params:
          board_id: "${board_id}"
          column_id: "${todo_column_id}"
        expect:
          status: success

  - id: KAN-012
    name: "Alice gets card"
    actors: [alice]
    steps:
      - tool: get_kanban_card
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
        expect:
          status: success

  - id: KAN-013
    name: "Alice updates card"
    actors: [alice]
    steps:
      - tool: update_kanban_card
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          title: "First Task Updated"
        expect:
          status: success

  - id: KAN-014
    name: "Alice creates a tag"
    actors: [alice]
    steps:
      - tool: create_kanban_tag
        params:
          board_id: "${board_id}"
          name: "urgent"
          color: "#FF0000"
        store:
          tag_id: "id"
        expect:
          status: success

  - id: KAN-015
    name: "Alice lists tags"
    actors: [alice]
    steps:
      - tool: list_kanban_tags
        params:
          board_id: "${board_id}"
        expect:
          status: success

  - id: KAN-016
    name: "Alice tags the card"
    actors: [alice]
    steps:
      - tool: tag_card
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          tag_id: "${tag_id}"
        expect:
          status: success

  - id: KAN-017
    name: "Alice adds a step to the card"
    actors: [alice]
    steps:
      - tool: add_step
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          text: "Step 1: Plan"
        store:
          step_id: "id"
        expect:
          status: success

  - id: KAN-018
    name: "Alice gets the step"
    actors: [alice]
    steps:
      - tool: get_step
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          step_id: "${step_id}"
        expect:
          status: success

  - id: KAN-019
    name: "Alice toggles the step"
    actors: [alice]
    steps:
      - tool: toggle_step
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          step_id: "${step_id}"
        expect:
          status: success

  - id: KAN-020
    name: "Alice adds a comment"
    actors: [alice]
    steps:
      - tool: add_comment
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          content: "This looks good!"
        store:
          comment_id: "id"
        expect:
          status: success

  - id: KAN-021
    name: "Alice lists comments"
    actors: [alice]
    steps:
      - tool: list_comments
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
        expect:
          status: success

  - id: KAN-022
    name: "Alice assigns user to card"
    actors: [alice]
    steps:
      - tool: assign_user
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          user_id: "alice"
        expect:
          status: success

  - id: KAN-023
    name: "Alice changes card state"
    actors: [alice]
    steps:
      - tool: change_card_state
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          state: "Closed"
        expect:
          status: success

  - id: KAN-024
    name: "Alice moves the card"
    actors: [alice]
    steps:
      - tool: move_kanban_card
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          target_column_id: "${done_column_id}"
        expect:
          status: success

  - id: KAN-025
    name: "Alice moves a column"
    actors: [alice]
    steps:
      - tool: move_kanban_column
        params:
          board_id: "${board_id}"
          column_id: "${done_column_id}"
          new_position: 0
        expect:
          status: success

  # Cleanup kanban (untag, unassign, delete)
  - id: KAN-026
    name: "Alice untags the card"
    actors: [alice]
    steps:
      - tool: untag_card
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          tag_id: "${tag_id}"
        expect:
          status: success

  - id: KAN-027
    name: "Alice unassigns user from card"
    actors: [alice]
    steps:
      - tool: unassign_user
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          user_id: "alice"
        expect:
          status: success

  - id: KAN-028
    name: "Alice deletes the comment"
    actors: [alice]
    steps:
      - tool: delete_comment
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          comment_id: "${comment_id}"
        expect:
          status: success

  - id: KAN-029
    name: "Alice deletes the step"
    actors: [alice]
    steps:
      - tool: delete_step
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
          step_id: "${step_id}"
        expect:
          status: success

  - id: KAN-030
    name: "Alice deletes the card"
    actors: [alice]
    steps:
      - tool: delete_kanban_card
        params:
          board_id: "${board_id}"
          card_id: "${card_id}"
        expect:
          status: success

  - id: KAN-031
    name: "Alice deletes a column"
    actors: [alice]
    steps:
      - tool: delete_kanban_column
        params:
          board_id: "${board_id}"
          column_id: "${done_column_id}"
        expect:
          status: success

  - id: KAN-032
    name: "Alice deletes the board"
    actors: [alice]
    steps:
      - tool: delete_kanban_board
        params:
          board_id: "${board_id}"
        expect:
          status: success

  # ============================================
  # PHASE 6: NETWORKING (7 tools)
  # Networking must be started before contacts
  # ============================================

  - id: NET-001
    name: "Alice checks network status"
    actors: [alice]
    steps:
      - tool: network_status
        expect:
          status: success

  - id: NET-002
    name: "Alice starts network"
    actors: [alice]
    steps:
      - tool: network_start
        expect:
          status: success

  - id: NET-003
    name: "Alice lists network peers"
    actors: [alice]
    steps:
      - tool: network_peers
        expect:
          status: success

  # Note: network_connect and network_disconnect require peer addresses
  # network_request_external_address requires active network

  # ============================================
  # PHASE 7: CONTACTS (10 tools)
  # Requires networking to be started first
  # ============================================

  - id: CON-001
    name: "Alice creates a contact"
    actors: [alice]
    steps:
      - tool: create_contact
        params:
          display_name: "John Doe"
          four_words: "wind-valley-fire-lake"
        store:
          contact_id: "contact_id"
        expect:
          status: success

  - id: CON-002
    name: "Alice lists contacts"
    actors: [alice]
    steps:
      - tool: list_contacts
        expect:
          status: success

  - id: CON-003
    name: "Alice gets contact"
    actors: [alice]
    steps:
      - tool: get_contact
        params:
          contact_id: "${contact_id}"
        expect:
          status: success

  - id: CON-004
    name: "Alice updates contact"
    actors: [alice]
    steps:
      - tool: update_contact
        params:
          contact_id: "${contact_id}"
          display_name: "John D. Doe"
        expect:
          status: success

  - id: CON-005
    name: "Alice searches contacts"
    actors: [alice]
    steps:
      - tool: search_contacts
        params:
          query: "John"
        expect:
          status: success

  - id: CON-006
    name: "Alice links contact to identity"
    actors: [alice]
    steps:
      - tool: link_contact
        params:
          contact_id: "${contact_id}"
          four_words: "storm-valley-fire-lake"
        expect:
          status: success

  - id: CON-007
    name: "Alice sets favourite contact"
    actors: [alice]
    steps:
      - tool: set_favourite_contact
        params:
          four_words: "storm-valley-fire-lake"
        expect:
          status: success

  - id: CON-008
    name: "Alice lists favourite contacts"
    actors: [alice]
    steps:
      - tool: list_favourite_contacts
        expect:
          status: success

  - id: CON-009
    name: "Alice removes favourite contact"
    actors: [alice]
    steps:
      - tool: remove_favourite_contact
        params:
          four_words: "storm-valley-fire-lake"
        expect:
          status: success

  - id: CON-010
    name: "Alice deletes contact"
    actors: [alice]
    steps:
      - tool: delete_contact
        params:
          contact_id: "${contact_id}"
        expect:
          status: success

  # ============================================
  # PHASE 8: NETWORK CLEANUP
  # ============================================

  - id: NET-004
    name: "Alice stops network"
    actors: [alice]
    steps:
      - tool: network_stop
        expect:
          status: success

  # ============================================
  # PHASE 9: WEBSITES (4 tools)
  # ============================================

  - id: WEB-001
    name: "Alice creates a website"
    actors: [alice]
    steps:
      - tool: create_website
        params:
          entity_id: "${entity_id}"
          html: "<html><body><h1>Hello World</h1></body></html>"
        expect:
          status: success

  - id: WEB-002
    name: "Alice gets website"
    actors: [alice]
    steps:
      - tool: get_website
        params:
          entity_id: "${entity_id}"
        expect:
          status: success

  - id: WEB-003
    name: "Alice updates website"
    actors: [alice]
    steps:
      - tool: update_website
        params:
          entity_id: "${entity_id}"
          html: "<html><body><h1>Updated Hello World</h1></body></html>"
        expect:
          status: success

  - id: WEB-004
    name: "Alice deletes website"
    actors: [alice]
    steps:
      - tool: delete_website
        params:
          entity_id: "${entity_id}"
        expect:
          status: success

  # ============================================
  # PHASE 10: INVITES (3 tools)
  # ============================================

  - id: INV-001
    name: "Alice creates an invite"
    actors: [alice]
    steps:
      - tool: create_invite
        params:
          entity_id: "${entity_id}"
          entity_type: "organisation"
          recipient_id: "river-mountain-sun-cloud"
          role: "member"
        expect:
          status: success

  - id: INV-002
    name: "Alice lists pending invites"
    actors: [alice]
    steps:
      - tool: list_pending_invites
        expect:
          status: success

  # Note: accept_invite would need to run on Bob's node
  # after he receives the invite notification
