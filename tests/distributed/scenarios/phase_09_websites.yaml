# Phase 9: Websites
# Tests website publishing

name: "Phase 9: Websites"
description: "Tests website creation, updates, and deletion for identity-bound publishing"
tools_covered:
  - create_website
  - get_website
  - update_website
  - delete_website

test_cases:
  # Create website for organisation
  - id: WEB-001
    name: "Alice creates organisation website"
    actors: [alice]
    steps:
      - tool: create_website
        params:
          entity_id: "${org_id}"
          html: |
            <!DOCTYPE html>
            <html>
            <head><title>Acme Corp</title></head>
            <body>
              <h1>Welcome to Acme Corp</h1>
              <p>Building the future together.</p>
            </body>
            </html>
        expect:
          status: success

  # Get website
  - id: WEB-002
    name: "Get website details"
    actors: [alice]
    steps:
      - tool: get_website
        params:
          entity_id: "${org_id}"
        expect:
          status: success
          fields:
            html: |
              <!DOCTYPE html>
              <html>
              <head><title>Acme Corp</title></head>
              <body>
                <h1>Welcome to Acme Corp</h1>
                <p>Building the future together.</p>
              </body>
              </html>

  # Update website
  - id: WEB-003
    name: "Update website content"
    actors: [bob]
    steps:
      - tool: update_website
        params:
          entity_id: "${org_id}"
          html: |
            <!DOCTYPE html>
            <html>
            <head><title>Acme Corp - Updated</title></head>
            <body>
              <h1>Welcome to Acme Corp</h1>
              <p>Building the future together.</p>
              <p>Updated by Bob.</p>
            </body>
            </html>
        expect:
          status: success

  # Verify update
  - id: WEB-004
    name: "Verify website updated"
    actors: [charlie]
    wait_ms: 3000
    steps:
      - tool: get_website
        params:
          entity_id: "${org_id}"
        expect:
          status: success
          fields:
            html: |
              <!DOCTYPE html>
              <html>
              <head><title>Acme Corp - Updated</title></head>
              <body>
                <h1>Welcome to Acme Corp</h1>
                <p>Building the future together.</p>
                <p>Updated by Bob.</p>
              </body>
              </html>

  # Create personal website
  - id: WEB-005
    name: "Charlie creates personal website entity"
    actors: [charlie]
    steps:
      - tool: create_entity
        params:
          name: "Charlie's Page"
          entity_type: "project"
        expect:
          status: success
        store:
          charlie_site_entity_id: id

  - id: WEB-006
    name: "Charlie publishes personal website"
    actors: [charlie]
    steps:
      - tool: create_website
        params:
          entity_id: "${charlie_site_entity_id}"
          html: |
            <!DOCTYPE html>
            <html>
            <head><title>Charlie</title></head>
            <body>
              <h1>Charlie's Personal Page</h1>
              <p>Hello from Charlie!</p>
            </body>
            </html>
        expect:
          status: success

  # Verify website accessible from other nodes
  - id: WEB-007
    name: "Dave accesses Charlie's website"
    actors: [dave]
    wait_ms: 3000
    steps:
      - tool: get_website
        params:
          entity_id: "${charlie_site_entity_id}"
        expect:
          status: success
          contains:
            - "Charlie's Personal Page"

  # Delete personal website
  - id: WEB-008
    name: "Charlie deletes website"
    actors: [charlie]
    steps:
      - tool: delete_website
        params:
          entity_id: "${charlie_site_entity_id}"
        expect:
          status: success

  # Verify deletion
  - id: WEB-009
    name: "Verify website deleted"
    actors: [charlie]
    steps:
      - tool: get_website
        params:
          entity_id: "${charlie_site_entity_id}"
        expect:
          status: error
          error_contains: "not found"
