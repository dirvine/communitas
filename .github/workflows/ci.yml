name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false

      - name: Rust fmt check
        run: cargo fmt --all -- --check

      - name: Rust audit
        run: |
          cargo install cargo-audit --locked
          # TODO: Remove RUSTSEC-2025-0008 from ignore list once saorsa-webrtc-codecs updates
          # Currently blocked: saorsa-webrtc-codecs 0.2.1 depends on openh264-sys2 0.7.1
          # communitas-core now uses openh264-sys2 0.9.0 (safe) directly as mitigation
          # Track upstream fix: https://github.com/saorsalabs/saorsa-webrtc/issues
          #
          # RUSTSEC-2024-0370: proc-macro-error is unmaintained (not a vulnerability)
          # Transitive dep: gtk3-macros → gtk → wry → dioxus-desktop
          #
          # RUSTSEC-2026-0258: h2 unbounded empty DATA frames.
          # Patched only in h2 >=0.4.16 (we already lock 0.4.16 via hyper 1 / reqwest).
          # Remaining finding is h2 0.3.27 via optional metrics:
          #   communitas-core[metrics] → opentelemetry-otlp 0.15 → tonic 0.11 → hyper 0.14 → h2 0.3.27
          # No patched 0.3.x exists (latest 0.3 is 0.3.27, 2025-07-11). Dropping the
          # 0.3 path requires an OpenTelemetry/tonic upgrade that rewrites telemetry.rs.
          # Track: https://rustsec.org/advisories/RUSTSEC-2026-0258
          cargo audit --ignore RUSTSEC-2025-0008 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2026-0258

      - name: Build dependencies
        run: cargo check --workspace --all-features

      - name: Rust clippy policy
        run: |
          # Run clippy with practical checks on library crates
          # Note: unwrap_used/expect_used excluded - too restrictive for test code,
          # better caught in code review per CLAUDE.md policy
          # Excluded:
          # - clippy::unimplemented: flutter_rust_bridge generates unimplemented!() for web fallbacks
          cargo clippy --workspace \
            --all-features -- \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::print_stdout \
            -D clippy::print_stderr

  # Integration and E2E tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: rust-checks
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false
          shared-key: tests-ubuntu

      - name: Run unit tests
        run: cargo test --workspace --lib -- --test-threads=4

      - name: Run integration tests
        run: |
          echo "Starting integration tests at $(date)"
          cargo test --workspace --test '*' -- --test-threads=4
          echo "Finished integration tests at $(date)"

      - name: Run property tests
        run: cargo test -p communitas-ui-service --test property_tests -- --test-threads=2

  # Phase 7 parity gate. Surfaces a focused subset of the test suite
  # that proves the named-groups API surface stays in sync between the
  # x0xd manifest, the Rust client, the Swift client, and the
  # communitas-x0x-client method coverage. Fast (<20 s) and needs no
  # daemon.
  #
  # When a new endpoint lands in x0xd, this job fails until:
  # - communitas-x0x-client/tests/fixtures/api-manifest.json is
  #   refreshed from x0x/docs/design/api-manifest.json
  # - src/client.rs gets the matching method
  # - tests/parity_manifest.rs::IMPLEMENTED is updated
  # - tests/swift_parity.rs::RUST_TO_SWIFT is updated
  # - the Swift X0xClient.swift exposes the camelCase counterpart
  parity:
    name: API + Swift Parity Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false
          shared-key: parity-ubuntu

      - name: Run client + Swift parity gate
        # parity_manifest enforces every named-groups endpoint in the
        # vendored manifest has a Rust client method.
        # client_coverage enforces every public client method has a
        # registered (method, path) entry.
        # swift_parity enforces every Rust method has a Swift
        # counterpart by reading X0xClient.swift directly.
        run: |
          cargo test -p communitas-x0x-client \
            --test parity_manifest \
            --test client_coverage \
            --test swift_parity

      - name: Verify vendored manifest is fresh
        # The vendored copy must match the upstream by content. CI
        # cannot fetch the x0x repo from this workflow, so this is a
        # local sanity check on shape + entry count rather than a full
        # diff. The local diff is the maintainer's responsibility.
        run: |
          set -euo pipefail
          jq -r '.endpoints | length' \
            communitas-x0x-client/tests/fixtures/api-manifest.json
          # Schema must match what the test reader expects.
          jq -e '.schema == "x0x-api-manifest/v1"' \
            communitas-x0x-client/tests/fixtures/api-manifest.json > /dev/null

  # Stress tests (nightly only)
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-24.04
    needs: rust-checks
    timeout-minutes: 60
    # Only run on schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false
          shared-key: stress-ubuntu

      - name: Run stress tests
        env:
          STRESS_DURATION_SECS: "30"
        run: cargo test -p communitas-ui-service --test stress -- --ignored --test-threads=1

