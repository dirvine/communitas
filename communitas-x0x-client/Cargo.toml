[package]
name = "communitas-x0x-client"
description = "Thin typed Rust client for the x0xd daemon REST + WebSocket + SSE surfaces"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

# Error handling
thiserror = { workspace = true }

# Platform directories (for x0x config discovery)
dirs-next = "2"

# Logging
tracing = { workspace = true }

# sha2 is runtime for post-install binary verification (daemon::verify_installed_binary).
sha2 = "0.10"
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
