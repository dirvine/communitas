# Phase 4: Messaging
# Tests message sending, retrieval, and threading

name: "Phase 4: Messaging"
description: "Tests message sending, retrieval, threading, and cross-node sync"
tools_covered:
  - send_message
  - get_messages
  - create_thread
  - get_thread_messages

test_cases:
  # Alice sends first message
  - id: MSG-001
    name: "Alice sends first message"
    actors: [alice]
    wait_ms: 8000
    steps:
      - tool: send_message
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
          text: "Hello team! This is our general channel."
        expect:
          status: success
        store:
          msg1_id: id

  # Bob replies
  - id: MSG-002
    name: "Bob sends message"
    actors: [bob]
    steps:
      - tool: send_message
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
          text: "Hi Alice! Great to be here."
        expect:
          status: success
        store:
          msg2_id: id

  # Charlie joins the conversation
  - id: MSG-003
    name: "Charlie sends message"
    actors: [charlie]
    steps:
      - tool: send_message
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
          text: "Hey everyone! Looking forward to collaborating."
        expect:
          status: success

  # Dave sends a message
  - id: MSG-004
    name: "Dave sends message"
    actors: [dave]
    wait_ms: 15000
    steps:
      - tool: send_message
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
          text: "Hello from the local node!"
        expect:
          status: success

  # Verify all messages synced across nodes
  - id: MSG-005
    name: "Verify messages synced to all nodes"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: get_messages
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
        expect:
          status: success
          contains:
            - messages:
                - text: "Hello team! This is our general channel."
            - messages:
                - text: "Hi Alice! Great to be here."
            - messages:
                - text: "Hey everyone! Looking forward to collaborating."
            - messages:
                - text: "Hello from the local node!"

  # Create a thread
  - id: MSG-006
    name: "Alice creates thread on Bob's message"
    actors: [alice]
    steps:
      - tool: create_thread
        params:
          channel_id: "${channel_id}"
          parent_message_id: "${msg2_id}"
        expect:
          status: success
        store:
          thread_id: thread_id

  # Reply to thread
  - id: MSG-007
    name: "Bob replies in thread"
    actors: [bob]
    steps:
      - tool: send_message
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
          reply_to_id: "${thread_id}"
          text: "Sure! What's the first task?"
        expect:
          status: success

  # Charlie replies to thread
  - id: MSG-008
    name: "Charlie replies in thread"
    actors: [charlie]
    steps:
      - tool: send_message
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
          reply_to_id: "${thread_id}"
          text: "I can help with the research."
        expect:
          status: success

  # Get thread messages
  - id: MSG-009
    name: "Get thread messages"
    actors: [alice]
    wait_ms: 3000
    steps:
      - tool: get_thread_messages
        params:
          channel_id: "${channel_id}"
          thread_id: "${thread_id}"
        expect:
          status: success

  # Test message ordering
  - id: MSG-010
    name: "Verify message ordering"
    actors: [alice]
    steps:
      - tool: get_messages
        params:
          entity_id: "${channel_id}"
          entity_type: "channel"
          limit: 10
        expect:
          status: success
