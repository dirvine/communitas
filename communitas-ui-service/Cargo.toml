[package]
name = "communitas-ui-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
canvas-core = { workspace = true }
chrono = { workspace = true }
communitas-core = { package = "communitas-core", path = "../communitas-core" }
communitas-kanban = { path = "../communitas-kanban" }
communitas-ui-api = { path = "../communitas-ui-api" }
dirs = "5.0"
hex = { workspace = true }
saorsa-webrtc-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
whoami = "1.5"
tracing = { workspace = true }
uuid = { version = "1.8", features = ["v4"] }
zeroize = "1.7"

[features]
default = []
test-utils = []

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
