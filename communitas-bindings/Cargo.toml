[package]
name = "communitas-bindings"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "communitas_bindings"

[features]
# Default includes UniFFI for backward compatibility
default = ["uniffi-bindings"]
# Enable UniFFI bindings for Swift
uniffi-bindings = ["uniffi"]
# Enable flutter_rust_bridge bindings for Flutter/Dart
flutter-bindings = ["flutter_rust_bridge"]

[dependencies]
communitas-core = { path = "../communitas-core" }
communitas-kanban = { path = "../communitas-kanban" }
uniffi = { version = "0.28", features = ["tokio"], optional = true }
flutter_rust_bridge = { version = "2.0", optional = true }
tokio = { version = "1.39", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
once_cell = "1.19"
# We need to ensure we can serialize/deserialize data passing through the bridge if necessary
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
uuid = "1.0"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.39", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
