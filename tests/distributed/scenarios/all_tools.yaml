test_cases:
  # This file serves as the master index
  # The orchestrator will load all phase files and run them in sequence

  # Sanity check - verify all nodes respond
  - id: MASTER-001
    name: "Initial health check"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: health_check
        expect:
          status: success

# Note: When running the full suite, the orchestrator loads all phase_*.yaml
# files in numerical order and executes them sequentially.
#
# Execution order:
# 1. phase_01_identity.yaml   - Authentication setup
# 2. phase_02_entities.yaml   - Entity creation
# 3. phase_03_members.yaml    - Member management
# 4. phase_04_messaging.yaml  - Messaging tests
# 5. phase_05_files.yaml      - Virtual disk tests
# 6. phase_06_kanban.yaml     - Kanban board tests
# 7. phase_07_contacts.yaml   - Contact management
# 8. phase_08_networking.yaml - P2P network tests
# 9. phase_09_websites.yaml   - Website publishing
# 10. phase_10_invites.yaml   - Invite system
# 11. phase_11_sync.yaml      - CRDT sync verification
#
# Total: 77 tools tested across ~100+ test cases
