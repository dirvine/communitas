# Cargo configuration for Tauri development
# Excludes runtime-generated files from triggering rebuilds

[build]
# Paths to ignore when watching for file changes during development
# This prevents Tauri from rebuilding when identity files are created
rustflags = []

[alias]
# Custom watch configuration that excludes keystore directory
watch = "watch --ignore keystore/ --ignore '*.identity' --ignore '*.db'"
