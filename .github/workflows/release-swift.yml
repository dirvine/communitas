name: Release Swift App (macOS)

# Trigger on v* tags (same as Dioxus release) or manual dispatch
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: release-swift-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-swift:
    name: Build & Sign Communitas Swift App
    runs-on: macos-latest
    outputs:
      dmg_name: ${{ steps.bundle.outputs.dmg_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Swift release version: $VERSION"

      # ─────────────────────────────────────────────────────────────────────────
      # Build Universal Binary
      # ─────────────────────────────────────────────────────────────────────────

      - name: Build universal binary
        run: |
          cd communitas-apple
          # Swift supports multi-arch builds directly producing a universal binary
          swift build -c release --arch arm64 --arch x86_64

      - name: Verify universal binary
        run: |
          BINARY=communitas-apple/.build/apple/Products/Release/Communitas
          ls -la "$BINARY"
          file "$BINARY"
          lipo -info "$BINARY"

      # ─────────────────────────────────────────────────────────────────────────
      # Bundle .app
      # ─────────────────────────────────────────────────────────────────────────

      - name: Create .app bundle
        id: bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_DIR="$RUNNER_TEMP/Communitas.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS/MacOS"
          RESOURCES_DIR="$CONTENTS/Resources"

          mkdir -p "$MACOS_DIR"
          mkdir -p "$RESOURCES_DIR"

          # Copy universal binary
          BINARY=communitas-apple/.build/apple/Products/Release/Communitas
          cp "$BINARY" "$MACOS_DIR/Communitas"
          chmod +x "$MACOS_DIR/Communitas"

          # Create Info.plist
          cat > "$CONTENTS/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.saorsalabs.communitas</string>
              <key>CFBundleName</key>
              <string>Communitas</string>
              <key>CFBundleExecutable</key>
              <string>Communitas</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>SUFeedURL</key>
              <string>https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml</string>
              <key>SUPublicEDKey</key>
              <string></string>
          </dict>
          </plist>
          EOF

          echo "app_path=$APP_DIR" >> $GITHUB_OUTPUT
          echo "dmg_name=Communitas-macOS-${VERSION}.dmg" >> $GITHUB_OUTPUT
          echo "Created .app bundle: $APP_DIR"

      # ─────────────────────────────────────────────────────────────────────────
      # Code Signing
      # ─────────────────────────────────────────────────────────────────────────

      - name: Import certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Certificate imported successfully"

      - name: Sign app bundle
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="${{ steps.bundle.outputs.app_path }}"

          echo "Signing app bundle: $APP_PATH"

          # Sign with hardened runtime and entitlements
          codesign --deep --force --verify --verbose \
            --options runtime \
            --entitlements communitas-apple/entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      # ─────────────────────────────────────────────────────────────────────────
      # Create DMG
      # ─────────────────────────────────────────────────────────────────────────

      - name: Create DMG
        run: |
          APP_PATH="${{ steps.bundle.outputs.app_path }}"
          DMG_NAME="${{ steps.bundle.outputs.dmg_name }}"
          DMG_STAGING=$RUNNER_TEMP/dmg-staging

          mkdir -p "$DMG_STAGING"

          # Copy app to staging
          cp -R "$APP_PATH" "$DMG_STAGING/"

          # Create symlink to Applications
          ln -s /Applications "$DMG_STAGING/Applications"

          # Create DMG
          hdiutil create -volname "Communitas" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "$RUNNER_TEMP/$DMG_NAME"

          echo "Created DMG: $RUNNER_TEMP/$DMG_NAME"

      - name: Sign DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          DMG_PATH="$RUNNER_TEMP/${{ steps.bundle.outputs.dmg_name }}"

          codesign --force --verify --verbose \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$DMG_PATH"

          echo "DMG signed successfully"

      - name: Generate appcast.xml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${{ steps.bundle.outputs.dmg_name }}"
          DMG_SIZE=$(stat -f%z "$RUNNER_TEMP/$DMG_NAME")
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$DMG_NAME"

          cat > "$RUNNER_TEMP/appcast.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Communitas Updates</title>
              <link>https://github.com/${{ github.repository }}/releases</link>
              <description>Communitas macOS app updates</description>
              <language>en</language>
              <item>
                <title>Communitas ${VERSION}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure url="${DMG_URL}" length="${DMG_SIZE}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          echo "Generated appcast.xml:"
          cat "$RUNNER_TEMP/appcast.xml"

      # ─────────────────────────────────────────────────────────────────────────
      # Notarization
      # ─────────────────────────────────────────────────────────────────────────

      - name: Notarize DMG
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          DMG_PATH="$RUNNER_TEMP/${{ steps.bundle.outputs.dmg_name }}"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"

          echo "Notarization complete!"

      - name: Verify notarization
        run: |
          DMG_PATH="$RUNNER_TEMP/${{ steps.bundle.outputs.dmg_name }}"

          echo "Verifying notarization..."
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

          echo "Checking staple..."
          xcrun stapler validate "$DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.dmg_name }}
          path: ${{ runner.temp }}/${{ steps.bundle.outputs.dmg_name }}
          retention-days: 90

      - name: Upload appcast artifact
        uses: actions/upload-artifact@v4
        with:
          name: appcast.xml
          path: ${{ runner.temp }}/appcast.xml
          retention-days: 90

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Attach to existing GitHub Release (created by release.yml)
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Attach Swift DMG to Release
    needs: build-swift
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-swift.outputs.dmg_name }}
          path: ./release

      - name: Download appcast
        uses: actions/download-artifact@v4
        with:
          name: appcast.xml
          path: ./release

      - name: Wait for GitHub Release to exist
        run: |
          TAG="${{ github.ref_name }}"
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found after $((i * 30))s"
              exit 0
            fi
            echo "Waiting for release $TAG... attempt $i/60"
            sleep 30
          done
          echo "Release $TAG not found after 30 minutes"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Swift DMG and appcast to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            ./release/${{ needs.build-swift.outputs.dmg_name }} \
            ./release/appcast.xml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
