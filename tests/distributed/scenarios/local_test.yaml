# Local MCP Test - Variable Capture Verification
# Tests variable capture/substitution with a single local node

name: "Local Variable Capture Test"
description: "Verify variable capture works correctly"
tools_covered:
  - health_check
  - create_entity
  - get_entity
  - send_message
  - get_messages

test_cases:
  - id: HEALTH-001
    name: "Health check"
    actors: [dave]
    steps:
      - tool: health_check
        expect:
          status: success

  - id: ENT-001
    name: "Dave creates an organisation"
    actors: [dave]
    steps:
      - tool: create_entity
        params:
          name: "Test Corp"
          entity_type: "organisation"
        store:
          entity_id: "id"
        expect:
          status: success

  - id: ENT-002
    name: "Dave gets entity details using captured ID"
    actors: [dave]
    steps:
      - tool: get_entity
        params:
          entity_id: "${entity_id}"
        expect:
          status: success

  - id: MSG-001
    name: "Dave sends a message"
    actors: [dave]
    steps:
      - tool: send_message
        params:
          entity_id: "${entity_id}"
          entity_type: "organisation"
          text: "Hello from Dave!"
        store:
          message_id: "id"
        expect:
          status: success

  - id: MSG-002
    name: "Dave gets messages"
    actors: [dave]
    steps:
      - tool: get_messages
        params:
          entity_id: "${entity_id}"
          entity_type: "organisation"
        expect:
          status: success
