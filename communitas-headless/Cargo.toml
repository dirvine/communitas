[package]
name = "communitas-headless"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Communitas headless node - thin wrapper around x0xd daemon"

[[bin]]
name = "communitas-headless"
path = "src/main.rs"

[dependencies]
# x0xd client for daemon management and REST API
communitas-x0x-client = { path = "../communitas-x0x-client" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.39", features = ["full"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

communitas-workspace-hack = { version = "0.1", path = "../communitas-workspace-hack" }
