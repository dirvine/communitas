# Test scenario for 3 nodes (alice, bob, dave)
# Skips charlie due to firewall issues

name: "3-Node Basic Test"
description: "Basic functionality test with 3 nodes (alice, bob, dave)"
tools_covered: [health_check, core_status, create_vault, authenticate]

test_cases:
  - id: TEST-001
    name: "Health check all available nodes"
    actors: [alice, bob, dave]
    parallel: true
    steps:
      - tool: health_check
        expect:
          status: success

  - id: TEST-002
    name: "Check core status on alice (unauthenticated)"
    actors: [alice]
    steps:
      - tool: core_status
        expect:
          status: success

  - id: TEST-003
    name: "Create vault for Alice"
    actors: [alice]
    steps:
      - tool: create_vault
        params:
          four_words: "ocean.forest.moon.star"
          password: "test-pass-alice"
          display_name: "Alice Test"
        expect:
          status: success

  - id: TEST-004
    name: "Create vault for Bob"
    actors: [bob]
    steps:
      - tool: create_vault
        params:
          four_words: "river.mountain.sun.cloud"
          password: "test-pass-bob"
          display_name: "Bob Test"
        expect:
          status: success

  - id: TEST-005
    name: "Create vault for Dave"
    actors: [dave]
    steps:
      - tool: create_vault
        params:
          four_words: "field.hill.fire.snow"
          password: "test-pass-dave"
          display_name: "Dave Test"
        expect:
          status: success

  - id: TEST-006
    name: "Verify Alice is initialized"
    actors: [alice]
    steps:
      - tool: core_status
        expect:
          status: success

  - id: TEST-007
    name: "Re-authenticate Alice"
    actors: [alice]
    steps:
      - tool: authenticate
        params:
          four_words: "ocean.forest.moon.star"
          password: "test-pass-alice"
        expect:
          status: success

  # NOTE: Password validation not yet implemented - MCP accepts any password
  # This test is skipped until vault-based authentication is complete
