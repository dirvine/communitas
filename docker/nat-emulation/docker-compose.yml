# NAT Emulation Docker Compose for Communitas
# Copyright (c) 2025 Saorsa Labs Limited
#
# Emulates various home and ISP NAT types for communitas P2P testing.
#
# Usage:
#   docker-compose up -d                    # Start all NAT emulators
#   docker-compose up -d nat-symmetric      # Start specific NAT type
#   docker-compose logs -f nat-cgnat        # View logs
#   docker-compose down                     # Stop all
#
# Each NAT container has:
#   - Internal network (10.100.x.0/24) - simulates home LAN
#   - External network (172.20.0.0/16)  - simulates ISP/internet
#
# Communitas uses UDP port 11000 (not 9000 like ant-quic!)
#
# Test nodes connect to internal network, communicate through NAT to external

services:
  # ==========================================================================
  # Full Cone NAT (EIM/EIF)
  # Most permissive: any external host can reach internal once port is mapped
  # Common in: gaming routers, UPnP-enabled routers
  # ==========================================================================
  nat-fullcone:
    build:
      context: ./nat-fullcone
    container_name: communitas-nat-fullcone
    hostname: nat-fullcone
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
    networks:
      nat-fullcone-internal:
        ipv4_address: 10.100.1.1
      nat-external:
        ipv4_address: 172.20.1.1
    environment:
      - NAT_TYPE=fullcone
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1

  # Test node behind Full Cone NAT
  node-fullcone:
    image: alpine:3.19
    container_name: communitas-node-fullcone
    hostname: node-fullcone
    cap_add:
      - NET_ADMIN
    networks:
      nat-fullcone-internal:
        ipv4_address: 10.100.1.10
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sh", "-c", "ip route del default; ip route add default via 10.100.1.1; sleep infinity"]
    depends_on:
      - nat-fullcone

  # ==========================================================================
  # Address-Restricted Cone NAT (EIM/ADF)
  # Only allows responses from IPs we've already sent to
  # Common in: older home routers, some enterprise firewalls
  # ==========================================================================
  nat-restricted:
    build:
      context: ./nat-restricted
    container_name: communitas-nat-restricted
    hostname: nat-restricted
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      nat-restricted-internal:
        ipv4_address: 10.100.2.1
      nat-external:
        ipv4_address: 172.20.2.1
    environment:
      - NAT_TYPE=address_restricted
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1

  node-restricted:
    image: alpine:3.19
    container_name: communitas-node-restricted
    hostname: node-restricted
    cap_add:
      - NET_ADMIN
    networks:
      nat-restricted-internal:
        ipv4_address: 10.100.2.10
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sh", "-c", "ip route del default; ip route add default via 10.100.2.1; sleep infinity"]
    depends_on:
      - nat-restricted

  # ==========================================================================
  # Port-Restricted Cone NAT (EIM/APDF)
  # Only allows responses from exact IP:port we've sent to
  # Common in: most modern home routers (default behavior)
  # ==========================================================================
  nat-portrestricted:
    build:
      context: ./nat-portrestricted
    container_name: communitas-nat-portrestricted
    hostname: nat-portrestricted
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      nat-portrestricted-internal:
        ipv4_address: 10.100.3.1
      nat-external:
        ipv4_address: 172.20.3.1
    environment:
      - NAT_TYPE=port_restricted
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1

  node-portrestricted:
    image: alpine:3.19
    container_name: communitas-node-portrestricted
    hostname: node-portrestricted
    cap_add:
      - NET_ADMIN
    networks:
      nat-portrestricted-internal:
        ipv4_address: 10.100.3.10
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sh", "-c", "ip route del default; ip route add default via 10.100.3.1; sleep infinity"]
    depends_on:
      - nat-portrestricted

  # ==========================================================================
  # Symmetric NAT (APDM/APDF)
  # Different external port for each destination - hardest to traverse
  # Common in: enterprise NAT, some ISP routers, cellular networks
  # ==========================================================================
  nat-symmetric:
    build:
      context: ./nat-symmetric
    container_name: communitas-nat-symmetric
    hostname: nat-symmetric
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      nat-symmetric-internal:
        ipv4_address: 10.100.4.1
      nat-external:
        ipv4_address: 172.20.4.1
    environment:
      - NAT_TYPE=symmetric
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1

  node-symmetric:
    image: alpine:3.19
    container_name: communitas-node-symmetric
    hostname: node-symmetric
    cap_add:
      - NET_ADMIN
    networks:
      nat-symmetric-internal:
        ipv4_address: 10.100.4.10
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sh", "-c", "ip route del default; ip route add default via 10.100.4.1; sleep infinity"]
    depends_on:
      - nat-symmetric

  # ==========================================================================
  # CGNAT (Carrier-Grade NAT)
  # Shared public IP with limited port range per subscriber
  # Common in: ISPs with IPv4 shortage, mobile carriers
  # ==========================================================================
  nat-cgnat:
    build:
      context: ./nat-cgnat
    container_name: communitas-nat-cgnat
    hostname: nat-cgnat
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.ip_local_port_range=32768 33023
    networks:
      nat-cgnat-internal:
        ipv4_address: 10.100.5.1
      nat-external:
        ipv4_address: 172.20.5.1
    environment:
      - NAT_TYPE=cgnat
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1
      - PORT_RANGE_START=32768
      - PORT_RANGE_END=33023
      - SHARED_IP=172.20.5.1

  node-cgnat:
    image: alpine:3.19
    container_name: communitas-node-cgnat
    hostname: node-cgnat
    cap_add:
      - NET_ADMIN
    networks:
      nat-cgnat-internal:
        ipv4_address: 10.100.5.10
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sh", "-c", "ip route del default; ip route add default via 10.100.5.1; sleep infinity"]
    depends_on:
      - nat-cgnat

  # ==========================================================================
  # Double NAT
  # Two layers of NAT (router behind router) - common in apartments, dorms
  # Very hard to traverse - often requires relay
  # ==========================================================================
  nat-doublenat-outer:
    build:
      context: ./nat-portrestricted
    container_name: communitas-nat-doublenat-outer
    hostname: nat-doublenat-outer
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      nat-doublenat-middle:
        ipv4_address: 10.200.1.1
      nat-external:
        ipv4_address: 172.20.6.1
    environment:
      - NAT_TYPE=port_restricted
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1

  nat-doublenat-inner:
    build:
      context: ./nat-portrestricted
    container_name: communitas-nat-doublenat-inner
    hostname: nat-doublenat-inner
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      nat-doublenat-internal:
        ipv4_address: 10.100.6.1
      nat-doublenat-middle:
        ipv4_address: 10.200.1.10
    command: ["sh", "-c", "ip route del default 2>/dev/null; ip route add default via 10.200.1.1; /entrypoint.sh"]
    environment:
      - NAT_TYPE=port_restricted
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1
    depends_on:
      - nat-doublenat-outer

  node-doublenat:
    image: alpine:3.19
    container_name: communitas-node-doublenat
    hostname: node-doublenat
    cap_add:
      - NET_ADMIN
    networks:
      nat-doublenat-internal:
        ipv4_address: 10.100.6.10
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sh", "-c", "ip route del default; ip route add default via 10.100.6.1; sleep infinity"]
    depends_on:
      - nat-doublenat-inner

  # ==========================================================================
  # Hairpin NAT
  # Can reach own external IP from inside (NAT loopback/reflection)
  # Common in: better home routers, enterprise routers
  # ==========================================================================
  nat-hairpin:
    build:
      context: ./nat-hairpin
    container_name: communitas-nat-hairpin
    hostname: nat-hairpin
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      nat-hairpin-internal:
        ipv4_address: 10.100.7.1
      nat-external:
        ipv4_address: 172.20.7.1
    environment:
      - NAT_TYPE=hairpin
      - INTERNAL_IFACE=eth0
      - EXTERNAL_IFACE=eth1
      - EXTERNAL_IP=172.20.7.1

  node-hairpin:
    image: alpine:3.19
    container_name: communitas-node-hairpin
    hostname: node-hairpin
    cap_add:
      - NET_ADMIN
    networks:
      nat-hairpin-internal:
        ipv4_address: 10.100.7.10
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sh", "-c", "ip route del default; ip route add default via 10.100.7.1; sleep infinity"]
    depends_on:
      - nat-hairpin

  # ==========================================================================
  # Public Node (no NAT) - simulates bootstrap/relay node
  # Direct connectivity for reference and relay testing
  # ==========================================================================
  node-public:
    image: alpine:3.19
    container_name: communitas-node-public
    hostname: node-public
    cap_add:
      - NET_ADMIN
    networks:
      nat-external:
        ipv4_address: 172.20.100.1
    volumes:
      - ../../target/release/communitas-headless:/usr/local/bin/communitas-headless:ro
    command: ["sleep", "infinity"]

# =============================================================================
# Networks
# =============================================================================
networks:
  # External network - simulates the "internet"
  nat-external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

  # Internal networks - one per NAT type (simulates home LANs)
  nat-fullcone-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/24

  nat-restricted-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.2.0/24

  nat-portrestricted-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.3.0/24

  nat-symmetric-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.4.0/24

  nat-cgnat-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.5.0/24

  nat-doublenat-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.6.0/24

  nat-doublenat-middle:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.1.0/24

  nat-hairpin-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.7.0/24
