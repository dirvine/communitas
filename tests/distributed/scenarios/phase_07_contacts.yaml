# Phase 7: Contacts
# Tests contact management

name: "Phase 7: Contacts"
description: "Tests contact creation, updates, deletion, linking, favourites, and search"
tools_covered:
  - create_contact
  - get_contact
  - update_contact
  - delete_contact
  - list_contacts
  - link_contact
  - set_favourite_contact
  - remove_favourite_contact
  - list_favourite_contacts
  - search_contacts

test_cases:
  # Create contacts
  - id: CON-001
    name: "Alice creates contact for Bob"
    actors: [alice]
    steps:
      - tool: create_contact
        params:
          display_name: "Bob Contact"
          four_words: "${bob_identity}"
        expect:
          status: success
        store:
          contact1_id: id

  - id: CON-002
    name: "Bob creates contact for Alice"
    actors: [bob]
    steps:
      - tool: create_contact
        params:
          display_name: "Alice Contact"
          four_words: "${alice_identity}"
        expect:
          status: success
        store:
          contact2_id: id

  # Get contact details
  - id: CON-003
    name: "Get contact details"
    actors: [alice]
    steps:
      - tool: get_contact
        params:
          contact_id: "${contact1_id}"
        expect:
          status: success
          fields:
            display_name: "Bob Contact"

  # Update contact
  - id: CON-004
    name: "Update contact display name"
    actors: [alice]
    steps:
      - tool: update_contact
        params:
          contact_id: "${contact1_id}"
          display_name: "Bob Contact Updated"
        expect:
          status: success

  # List contacts
  - id: CON-005
    name: "List all contacts"
    actors: [alice]
    steps:
      - tool: list_contacts
        expect:
          status: success
          contains:
            - contacts:
                - display_name: "Bob Contact Updated"

  # Add to favourites
  - id: CON-006
    name: "Add contact to favourites"
    actors: [alice]
    steps:
      - tool: set_favourite_contact
        params:
          four_words: "${bob_identity}"
        expect:
          status: success

  # Search contacts
  - id: CON-007
    name: "Search contacts by name"
    actors: [alice]
    steps:
      - tool: search_contacts
        params:
          query: "Bob"
        expect:
          status: success
          contains:
            - contacts:
                - display_name: "Bob Contact Updated"

  # Search by email
  - id: CON-008
    name: "Search contacts by words"
    actors: [alice]
    steps:
      - tool: search_contacts
        params:
          query: "${bob_identity}"
        expect:
          status: success

  # Link contact to entity
  - id: CON-009
    name: "Link contact to identity"
    actors: [alice]
    steps:
      - tool: link_contact
        params:
          contact_id: "${contact1_id}"
          four_words: "${bob_identity}"
        expect:
          status: success

  # Remove from favourites
  - id: CON-010
    name: "Remove from favourites"
    actors: [alice]
    steps:
      - tool: remove_favourite_contact
        params:
          four_words: "${bob_identity}"
        expect:
          status: success

  # Unlink contact
  # Verify contacts sync across nodes
  - id: CON-011
    name: "Verify contacts visible to team"
    actors: [bob, charlie]
    parallel: true
    wait_ms: 3000
    steps:
      - tool: list_contacts
        expect:
          status: success

  # Delete contact
  - id: CON-012
    name: "Delete contact"
    actors: [bob]
    steps:
      - tool: delete_contact
        params:
          contact_id: "${contact2_id}"
        expect:
          status: success

  # Verify deletion
  - id: CON-013
    name: "Verify contact deleted"
    actors: [bob]
    steps:
      - tool: get_contact
        params:
          contact_id: "${contact2_id}"
        expect:
          status: error
          error_contains: "not found"
