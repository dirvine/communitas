# Phase 6: Kanban
# Tests all 31 kanban tools

name: "Phase 6: Kanban"
description: "Tests all kanban tools: boards, columns, cards, tags, steps, comments"
tools_covered:
  - create_kanban_board
  - get_kanban_board
  - list_kanban_boards
  - update_kanban_board
  - delete_kanban_board
  - create_kanban_column
  - list_kanban_columns
  - update_kanban_column
  - delete_kanban_column
  - move_kanban_column
  - create_kanban_card
  - get_kanban_card
  - list_kanban_cards
  - update_kanban_card
  - delete_kanban_card
  - move_kanban_card
  - assign_user
  - unassign_user
  - create_kanban_tag
  - list_kanban_tags
  - tag_card
  - untag_card
  - add_step
  - get_step
  - toggle_step
  - delete_step
  - add_comment
  - list_comments
  - delete_comment

test_cases:
  # Create board
  - id: KAN-001
    name: "Alice creates kanban board"
    actors: [alice]
    steps:
      - tool: create_kanban_board
        params:
          entity_id: "${project_id}"
          board_name: "Sprint Board"
          description: "Q1 Sprint tracking"
        expect:
          status: success
        store:
          board_id: id

  # Get board
  - id: KAN-002
    name: "Get board details"
    actors: [alice]
    steps:
      - tool: get_kanban_board
        params:
          board_id: "${board_id}"
        expect:
          status: success
          fields:
            name: "Sprint Board"

  # Create columns
  - id: KAN-003
    name: "Create To Do column"
    actors: [alice]
    steps:
      - tool: create_kanban_column
        params:
          board_id: "${board_id}"
          column_name: "To Do"
          position: 0
        expect:
          status: success
        store:
          col_todo_id: id

  - id: KAN-004
    name: "Create In Progress column"
    actors: [alice]
    steps:
      - tool: create_kanban_column
        params:
          board_id: "${board_id}"
          column_name: "In Progress"
          position: 1
        expect:
          status: success
        store:
          col_progress_id: id

  - id: KAN-005
    name: "Create Done column"
    actors: [alice]
    steps:
      - tool: create_kanban_column
        params:
          board_id: "${board_id}"
          column_name: "Done"
          position: 2
        expect:
          status: success
        store:
          col_done_id: id

  # Create tags
  - id: KAN-006
    name: "Create bug tag"
    actors: [alice]
    steps:
      - tool: create_kanban_tag
        params:
          board_id: "${board_id}"
          name: "bug"
          color: "#ef4444"
        expect:
          status: success
        store:
          tag_bug_id: id

  - id: KAN-007
    name: "Create feature tag"
    actors: [alice]
    steps:
      - tool: create_kanban_tag
        params:
          board_id: "${board_id}"
          name: "feature"
          color: "#22c55e"
        expect:
          status: success
        store:
          tag_feature_id: id

  # Create cards
  - id: KAN-008
    name: "Alice creates card"
    actors: [alice]
    steps:
      - tool: create_kanban_card
        params:
          board_id: "${board_id}"
          column_id: "${col_todo_id}"
          title: "Setup development environment"
          description: "Install all required tools"
        expect:
          status: success
        store:
          card1_id: id

  - id: KAN-009
    name: "Bob creates card"
    actors: [bob]
    steps:
      - tool: create_kanban_card
        params:
          board_id: "${board_id}"
          column_id: "${col_todo_id}"
          title: "Write unit tests"
          description: "Cover core functionality"
        expect:
          status: success
        store:
          card2_id: id

  - id: KAN-010
    name: "Charlie creates card"
    actors: [charlie]
    steps:
      - tool: create_kanban_card
        params:
          board_id: "${board_id}"
          column_id: "${col_todo_id}"
          title: "Review documentation"
          description: "Check all docs are up to date"
        expect:
          status: success
        store:
          card3_id: id

  # Assign cards
  - id: KAN-011
    name: "Assign card to Bob"
    actors: [alice]
    steps:
      - tool: assign_user
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          user_id: "${bob_identity}"
        expect:
          status: success

  # Add tags to cards
  - id: KAN-012
    name: "Add feature tag to card"
    actors: [alice]
    steps:
      - tool: tag_card
        params:
          board_id: "${board_id}"
          card_id: "${card1_id}"
          tag_id: "${tag_feature_id}"
        expect:
          status: success

  # Move card to In Progress
  - id: KAN-013
    name: "Move card to In Progress"
    actors: [bob]
    steps:
      - tool: move_kanban_card
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          target_column_id: "${col_progress_id}"
          position: 0
        expect:
          status: success

  # Create steps (checklist)
  - id: KAN-014
    name: "Add steps to card"
    actors: [bob]
    steps:
      - tool: add_step
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          text: "Write test for module A"
        expect:
          status: success
        store:
          step1_id: id

  - id: KAN-015
    name: "Add second step"
    actors: [bob]
    steps:
      - tool: add_step
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          text: "Write test for module B"
        expect:
          status: success

  # Complete a step
  - id: KAN-016
    name: "Complete step"
    actors: [bob]
    steps:
      - tool: toggle_step
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          step_id: "${step1_id}"
        expect:
          status: success

  # Add comment
  - id: KAN-017
    name: "Add comment to card"
    actors: [charlie]
    steps:
      - tool: add_comment
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          content: "Great progress Bob! Let me know if you need help."
        expect:
          status: success
        store:
          comment1_id: id

  # List cards
  - id: KAN-018
    name: "List all cards"
    actors: [alice]
    wait_ms: 3000
    steps:
      - tool: list_kanban_cards
        params:
          board_id: "${board_id}"
        expect:
          status: success
          contains:
            - cards:
                - title: "Setup development environment"
            - cards:
                - title: "Write unit tests"
            - cards:
                - title: "Review documentation"

  # Verify sync across nodes
  - id: KAN-019
    name: "Verify board synced to Dave"
    actors: [dave]
    wait_ms: 3000
    steps:
      - tool: get_kanban_board
        params:
          board_id: "${board_id}"
        expect:
          status: success
          fields:
            name: "Sprint Board"

  # Move card to Done
  - id: KAN-020
    name: "Move card to Done"
    actors: [bob]
    steps:
      - tool: move_kanban_card
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          target_column_id: "${col_done_id}"
          position: 0
        expect:
          status: success

  # List columns
  - id: KAN-021
    name: "List columns"
    actors: [alice]
    steps:
      - tool: list_kanban_columns
        params:
          board_id: "${board_id}"
        expect:
          status: success
          contains:
            - columns:
                - name: "To Do"
            - columns:
                - name: "In Progress"
            - columns:
                - name: "Done"

  # List tags
  - id: KAN-022
    name: "List tags"
    actors: [alice]
    steps:
      - tool: list_kanban_tags
        params:
          board_id: "${board_id}"
        expect:
          status: success
          contains:
            - tags:
                - name: "bug"
            - tags:
                - name: "feature"

  # List comments
  - id: KAN-023
    name: "List comments"
    actors: [alice]
    steps:
      - tool: list_comments
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
        expect:
          status: success
          contains:
            - text: "Great progress"

  # Update card
  - id: KAN-024
    name: "Update card title"
    actors: [bob]
    steps:
      - tool: update_kanban_card
        params:
          board_id: "${board_id}"
          card_id: "${card2_id}"
          title: "Write unit tests (COMPLETED)"
        expect:
          status: success

  # Remove tag from card
  - id: KAN-025
    name: "Remove tag from card"
    actors: [alice]
    steps:
      - tool: untag_card
        params:
          board_id: "${board_id}"
          card_id: "${card1_id}"
          tag_id: "${tag_feature_id}"
        expect:
          status: success

  # List boards
  - id: KAN-026
    name: "List all boards"
    actors: [alice]
    steps:
      - tool: list_kanban_boards
        params:
          entity_id: "${project_id}"
        expect:
          status: success
          contains:
            - boards:
                - name: "Sprint Board"
