<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Bridge Unit Tests</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
        }
        .test-suite {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .test-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .test-pass {
            color: #28a745;
        }
        .test-fail {
            color: #dc3545;
        }
        .test-skip {
            color: #6c757d;
        }
        .error-message {
            margin-left: 20px;
            font-family: monospace;
            font-size: 12px;
        }
        #test-results {
            margin-top: 20px;
        }
        #summary {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>MCP Bridge Unit Tests</h1>
    <div id="test-results">
        <div id="summary">Running tests...</div>
    </div>
    <div id="test-details"></div>

    <script src="../shared/mcp-bridge.js"></script>
    <script src="bridge-tests.js"></script>
</body>
</html>
