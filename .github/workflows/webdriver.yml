name: WebDriver Tests

on:
  push:
    branches: [main]
    paths:
      - 'communitas-dioxus/**'
      - 'communitas-ui-service/**'
      - 'communitas-ui-api/**'
      - 'tests/webdriverio/**'
      - '.github/workflows/webdriver.yml'
  pull_request:
    branches: [main]
    paths:
      - 'communitas-dioxus/**'
      - 'communitas-ui-service/**'
      - 'communitas-ui-api/**'
      - 'tests/webdriverio/**'
      - '.github/workflows/webdriver.yml'
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Test pattern (e.g., "smoke" or "accessibility")'
        required: false
        default: ''

concurrency:
  group: webdriver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webdriver-tests:
    name: WebDriverIO Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            display: ':99'
          # macOS disabled by default due to longer build times
          # - os: macos-latest
          #   display: ''

    steps:
      - name: Free disk space (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libdbus-1-dev \
            libxdo-dev \
            xvfb \
            webkit2gtk-driver
          # Install WebKitGTK (try 4.1 first, fallback to 4.0)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false
          shared-key: webdriver-${{ matrix.os }}

      - name: Build Dioxus app (debug)
        run: cargo build -p communitas-dioxus

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WebDriverIO dependencies
        working-directory: tests/webdriverio
        run: npm ci

      - name: Start Xvfb (Ubuntu)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          Xvfb ${{ matrix.display }} -screen 0 1920x1080x24 &
          echo "DISPLAY=${{ matrix.display }}" >> $GITHUB_ENV

      - name: Run WebDriverIO smoke tests
        working-directory: tests/webdriverio
        env:
          DISPLAY: ${{ matrix.display }}
          TAURI_APP_BINARY: ${{ github.workspace }}/target/debug/communitas-dioxus
          WEBKIT_BROWSER: 'webkit'
        run: |
          # Run smoke tests first (faster feedback)
          npx wdio run wdio.conf.js --spec '**/smoke*.js' || true

      - name: Run WebDriverIO accessibility tests
        working-directory: tests/webdriverio
        env:
          DISPLAY: ${{ matrix.display }}
          TAURI_APP_BINARY: ${{ github.workspace }}/target/debug/communitas-dioxus
          WEBKIT_BROWSER: 'webkit'
        run: |
          # Run accessibility tests
          npx wdio run wdio.conf.js --spec '**/accessibility*.js' || true

      - name: Run WebDriverIO offline tests
        working-directory: tests/webdriverio
        env:
          DISPLAY: ${{ matrix.display }}
          TAURI_APP_BINARY: ${{ github.workspace }}/target/debug/communitas-dioxus
          WEBKIT_BROWSER: 'webkit'
        run: |
          # Run offline scenario tests
          npx wdio run wdio.conf.js --spec '**/offline*.js' || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriver-results-${{ matrix.os }}-${{ github.sha }}
          path: |
            tests/webdriverio/logs/
            tests/webdriverio/*.png
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webdriver-screenshots-${{ matrix.os }}-${{ github.sha }}
          path: tests/webdriverio/logs/*.png
          retention-days: 14

  webdriver-summary:
    name: WebDriver Test Summary
    runs-on: ubuntu-latest
    needs: webdriver-tests
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.webdriver-tests.result }}" == "failure" ]; then
            echo "::warning::Some WebDriver tests failed. Check artifacts for details."
            # Don't fail the job - WebDriver tests are informational
            exit 0
          fi
          echo "WebDriver tests completed successfully"
