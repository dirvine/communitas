name: Release Swift App (macOS)

# Trigger on v* tags (same as Dioxus release) or manual dispatch
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: release-swift-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-swift:
    name: Build & Sign Communitas Swift App
    runs-on: macos-latest
    outputs:
      dmg_name: ${{ steps.bundle.outputs.dmg_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Swift release version: $VERSION"

      # ─────────────────────────────────────────────────────────────────────────
      # Build Universal Binary
      # ─────────────────────────────────────────────────────────────────────────

      - name: Build universal binary
        run: |
          cd communitas-apple
          # Swift supports multi-arch builds directly producing a universal binary
          swift build -c release --arch arm64 --arch x86_64

      - name: Verify universal binary
        run: |
          BINARY=communitas-apple/.build/apple/Products/Release/Communitas
          ls -la "$BINARY"
          file "$BINARY"
          lipo -info "$BINARY"

      # ─────────────────────────────────────────────────────────────────────────
      # Bundle .app
      # ─────────────────────────────────────────────────────────────────────────

      - name: Extract Sparkle public key
        id: sparkle_key
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: |
          # Download Sparkle tools to extract the public key from the private key
          SPARKLE_VERSION="2.6.4"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle

          # The SPARKLE_KEY env var contains the Ed25519 private key (64 bytes base64).
          # The public key is the last 32 bytes of the 64-byte Ed25519 key.
          # sign_update reads SPARKLE_KEY from env; generate_keys uses the Keychain.
          # Extract public key directly from the private key bytes.
          PUB_KEY=$(echo "$SPARKLE_KEY" | base64 -d | tail -c 32 | base64)
          if [ -z "$PUB_KEY" ]; then
            echo "WARNING: Could not extract Sparkle public key"
            PUB_KEY=""
          fi
          echo "sparkle_pub_key=$PUB_KEY" >> $GITHUB_OUTPUT
          echo "Sparkle public key extracted: ${PUB_KEY:0:12}..."

      - name: Create .app bundle
        id: bundle
        env:
          SPARKLE_PUB_KEY: ${{ steps.sparkle_key.outputs.sparkle_pub_key }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_DIR="$RUNNER_TEMP/Communitas.app"
          CONTENTS="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS/MacOS"
          RESOURCES_DIR="$CONTENTS/Resources"
          FRAMEWORKS_DIR="$CONTENTS/Frameworks"

          mkdir -p "$MACOS_DIR"
          mkdir -p "$RESOURCES_DIR"
          mkdir -p "$FRAMEWORKS_DIR"

          # Copy universal binary
          BINARY=communitas-apple/.build/apple/Products/Release/Communitas
          cp "$BINARY" "$MACOS_DIR/Communitas"
          chmod +x "$MACOS_DIR/Communitas"

          # Copy Sparkle.framework into the bundle
          # SPM builds Sparkle into the artifacts directory; find and copy it
          SPARKLE_FW=$(find communitas-apple/.build -name "Sparkle.framework" -type d | head -1)
          if [ -n "$SPARKLE_FW" ]; then
            cp -R "$SPARKLE_FW" "$FRAMEWORKS_DIR/"
            echo "Bundled Sparkle.framework from: $SPARKLE_FW"
          else
            # Fallback: use the downloaded Sparkle from the signing step
            if [ -d "/tmp/sparkle/Sparkle.framework" ]; then
              cp -R /tmp/sparkle/Sparkle.framework "$FRAMEWORKS_DIR/"
              echo "Bundled Sparkle.framework from /tmp/sparkle download"
            else
              echo "ERROR: Sparkle.framework not found!"
              exit 1
            fi
          fi
          ls -la "$FRAMEWORKS_DIR/"

          # Create Info.plist
          cat > "$CONTENTS/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.saorsalabs.communitas</string>
              <key>CFBundleName</key>
              <string>Communitas</string>
              <key>CFBundleExecutable</key>
              <string>Communitas</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
              <key>SUFeedURL</key>
              <string>https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml</string>
              <key>SUPublicEDKey</key>
              <string>${SPARKLE_PUB_KEY}</string>
          </dict>
          </plist>
          EOF

          # Ensure the binary can find Sparkle at @rpath
          # SPM sets @rpath to the build directory; we need it to point into the .app bundle
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$MACOS_DIR/Communitas" 2>/dev/null || true
          echo "Rpaths configured:"
          otool -l "$MACOS_DIR/Communitas" | grep -A2 LC_RPATH || true

          echo "app_path=$APP_DIR" >> $GITHUB_OUTPUT
          echo "dmg_name=Communitas-macOS-${VERSION}.dmg" >> $GITHUB_OUTPUT
          echo "Created .app bundle: $APP_DIR"

      # ─────────────────────────────────────────────────────────────────────────
      # Code Signing
      # ─────────────────────────────────────────────────────────────────────────

      - name: Import certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Certificate imported successfully"

      - name: Sign app bundle
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="${{ steps.bundle.outputs.app_path }}"

          echo "Signing app bundle: $APP_PATH"

          # Sign with hardened runtime and entitlements
          codesign --deep --force --verify --verbose \
            --options runtime \
            --entitlements communitas-apple/entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP_PATH"

          echo "Verifying signature..."
          # --no-strict: Sparkle.framework has its own designated requirement
          # (signed by Sparkle team). Apple notarization handles full validation.
          codesign --verify --deep --verbose=2 "$APP_PATH"

      # ─────────────────────────────────────────────────────────────────────────
      # Create DMG
      # ─────────────────────────────────────────────────────────────────────────

      - name: Create DMG
        run: |
          APP_PATH="${{ steps.bundle.outputs.app_path }}"
          DMG_NAME="${{ steps.bundle.outputs.dmg_name }}"
          DMG_STAGING=$RUNNER_TEMP/dmg-staging

          mkdir -p "$DMG_STAGING"

          # Copy app to staging
          cp -R "$APP_PATH" "$DMG_STAGING/"

          # Create symlink to Applications
          ln -s /Applications "$DMG_STAGING/Applications"

          # Create DMG
          hdiutil create -volname "Communitas" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "$RUNNER_TEMP/$DMG_NAME"

          echo "Created DMG: $RUNNER_TEMP/$DMG_NAME"

      - name: Sign DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          DMG_PATH="$RUNNER_TEMP/${{ steps.bundle.outputs.dmg_name }}"

          codesign --force --verify --verbose \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$DMG_PATH"

          echo "DMG signed successfully"

      - name: Sign DMG for Sparkle (EdDSA)
        id: sparkle_sign
        continue-on-error: true
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        run: |
          DMG_PATH="$RUNNER_TEMP/${{ steps.bundle.outputs.dmg_name }}"

          # sign_update reads Ed25519 private key from SPARKLE_KEY env var
          # Output format: sparkle:edSignature="<base64>" length="<bytes>"
          SIGN_OUTPUT=$(/tmp/sparkle/bin/sign_update "$DMG_PATH" 2>&1) || true
          echo "sign_update raw output length: ${#SIGN_OUTPUT}"

          # Try multiple extraction patterns (format varies by Sparkle version)
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | sed 's/sparkle:edSignature="//;s/"$//' || true)
          if [ -z "$ED_SIGNATURE" ]; then
            # Try alternate format: just the base64 string on its own line
            ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -E '^[A-Za-z0-9+/=]{40,}$' | head -1 || true)
          fi

          if [ -z "$ED_SIGNATURE" ]; then
            echo "WARNING: Could not extract Sparkle EdDSA signature. Appcast will ship unsigned."
            echo "ed_signature=" >> $GITHUB_OUTPUT
          else
            echo "ed_signature=$ED_SIGNATURE" >> $GITHUB_OUTPUT
            echo "Sparkle EdDSA signature generated (${#ED_SIGNATURE} chars)"
          fi

      - name: Generate appcast.xml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${{ steps.bundle.outputs.dmg_name }}"
          DMG_SIZE=$(stat -f%z "$RUNNER_TEMP/$DMG_NAME")
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/$DMG_NAME"
          ED_SIGNATURE="${{ steps.sparkle_sign.outputs.ed_signature }}"

          cat > "$RUNNER_TEMP/appcast.xml" << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Communitas Updates</title>
              <link>https://github.com/${{ github.repository }}/releases</link>
              <description>Communitas macOS app updates</description>
              <language>en</language>
              <item>
                <title>Communitas ${VERSION}</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <enclosure url="${DMG_URL}" length="${DMG_SIZE}" type="application/octet-stream" sparkle:edSignature="${ED_SIGNATURE}" />
              </item>
            </channel>
          </rss>
          EOF

          echo "Generated appcast.xml:"
          cat "$RUNNER_TEMP/appcast.xml"

      # ─────────────────────────────────────────────────────────────────────────
      # Notarization
      # ─────────────────────────────────────────────────────────────────────────

      - name: Notarize DMG
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          DMG_PATH="$RUNNER_TEMP/${{ steps.bundle.outputs.dmg_name }}"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"

          echo "Notarization complete!"

      - name: Verify notarization
        run: |
          DMG_PATH="$RUNNER_TEMP/${{ steps.bundle.outputs.dmg_name }}"

          echo "Verifying notarization..."
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

          echo "Checking staple..."
          xcrun stapler validate "$DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.dmg_name }}
          path: ${{ runner.temp }}/${{ steps.bundle.outputs.dmg_name }}
          retention-days: 90

      - name: Upload appcast artifact
        uses: actions/upload-artifact@v4
        with:
          name: appcast.xml
          path: ${{ runner.temp }}/appcast.xml
          retention-days: 90

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Attach to existing GitHub Release (created by release.yml)
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Attach Swift DMG to Release
    needs: build-swift
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-swift.outputs.dmg_name }}
          path: ./release

      - name: Download appcast
        uses: actions/download-artifact@v4
        with:
          name: appcast.xml
          path: ./release

      - name: Wait for GitHub Release to exist
        run: |
          TAG="${{ github.ref_name }}"
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found after $((i * 30))s"
              exit 0
            fi
            echo "Waiting for release $TAG... attempt $i/60"
            sleep 30
          done
          echo "Release $TAG not found after 30 minutes"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Swift DMG and appcast to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            ./release/${{ needs.build-swift.outputs.dmg_name }} \
            ./release/appcast.xml \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
