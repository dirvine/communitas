name: Release (macOS)

# Trigger on stable version tags or manual dispatch
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build & Sign macOS Release
    runs-on: macos-latest
    outputs:
      dmg_name: ${{ steps.bundle.outputs.dmg_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4


      - name: Get version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release version: $VERSION"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dx CLI
        run: |
          cargo install dioxus-cli --locked --version 0.7.3

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-release-

      # ─────────────────────────────────────────────────────────────────────────
      # Build Universal Binary
      # ─────────────────────────────────────────────────────────────────────────

      - name: Set build environment
        run: |
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "TARGET=universal-apple-darwin" >> $GITHUB_ENV

      - name: Build x86_64 binary
        run: |
          cd communitas-dioxus
          cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64 binary
        run: |
          cd communitas-dioxus
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo \
            target/x86_64-apple-darwin/release/communitas-dioxus \
            target/aarch64-apple-darwin/release/communitas-dioxus \
            -create -output target/universal-apple-darwin/release/communitas-dioxus

      # ─────────────────────────────────────────────────────────────────────────
      # Bundle App
      # ─────────────────────────────────────────────────────────────────────────

      - name: Bundle desktop app
        id: bundle
        run: |
          cd communitas-dioxus
          dx bundle --platform desktop --release

          # Find the generated .app (use absolute path so subsequent steps work from repo root)
          APP_PATH=$(find "$(pwd)/dist" -name "*.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

          # Replace binary with universal one
          APP_NAME=$(basename "$APP_PATH" .app)
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          mkdir -p "$MACOS_DIR"
          cp ../target/universal-apple-darwin/release/communitas-dioxus "$MACOS_DIR/$APP_NAME"

          VERSION="${{ steps.version.outputs.version }}"
          echo "Bundled app: $APP_PATH"
          echo "dmg_name=Communitas-macOS-Dioxus-${VERSION}.dmg" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────────────────────────────────
      # Code Signing
      # ─────────────────────────────────────────────────────────────────────────

      - name: Import certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Certificate imported successfully"

      - name: Sign app bundle
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="${{ steps.bundle.outputs.app_path }}"

          echo "Signing app bundle: $APP_PATH"

          # Sign with hardened runtime and entitlements
          codesign --deep --force --verify --verbose \
            --options runtime \
            --entitlements communitas-dioxus/entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      # ─────────────────────────────────────────────────────────────────────────
      # Create DMG
      # ─────────────────────────────────────────────────────────────────────────

      - name: Create DMG
        run: |
          APP_PATH="${{ steps.bundle.outputs.app_path }}"
          DMG_NAME="${{ steps.bundle.outputs.dmg_name }}"

          # Create DMG staging directory
          DMG_STAGING=$RUNNER_TEMP/dmg-staging
          mkdir -p "$DMG_STAGING"

          # Copy app to staging
          cp -R "$APP_PATH" "$DMG_STAGING/"

          # Create symlink to Applications
          ln -s /Applications "$DMG_STAGING/Applications"

          # Create DMG
          hdiutil create -volname "Communitas (Dioxus)" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "communitas-dioxus/dist/$DMG_NAME"

          echo "Created DMG: communitas-dioxus/dist/$DMG_NAME"

      - name: Sign DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          DMG_PATH="communitas-dioxus/dist/${{ steps.bundle.outputs.dmg_name }}"

          codesign --force --verify --verbose \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$DMG_PATH"

          echo "DMG signed successfully"

      # ─────────────────────────────────────────────────────────────────────────
      # Notarization
      # ─────────────────────────────────────────────────────────────────────────

      - name: Notarize DMG
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          DMG_PATH="communitas-dioxus/dist/${{ steps.bundle.outputs.dmg_name }}"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --wait

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"

          echo "Notarization complete!"

      - name: Verify notarization
        run: |
          DMG_PATH="communitas-dioxus/dist/${{ steps.bundle.outputs.dmg_name }}"

          echo "Verifying notarization..."
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

          echo "Checking staple..."
          xcrun stapler validate "$DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.dmg_name }}
          path: communitas-dioxus/dist/${{ steps.bundle.outputs.dmg_name }}
          retention-days: 90

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Release Job
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Create GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-macos.outputs.dmg_name }}
          path: ./release

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build-macos.outputs.version }}"
          
          # Extract release notes from CHANGELOG
          NOTES=$(sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | head -n -1 | tail -n +2)
          
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          
          # Save to file for multiline handling
          echo "$NOTES" > release_notes.md
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Install Rust for signing tool
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Build PQC signing tool
        run: |
          cd tools/sign-release
          cargo build --release
          echo "SIGN_TOOL=$(pwd)/target/release/sign-release" >> $GITHUB_ENV

      - name: Generate update manifest
        env:
          ML_DSA_SECRET_KEY: ${{ secrets.ML_DSA_SECRET_KEY }}
        run: |
          VERSION="${{ needs.build-macos.outputs.version }}"
          DMG_NAME="${{ needs.build-macos.outputs.dmg_name }}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Sign artifacts with ML-DSA-65 (PQC) if signing key is configured
          MACOS_SIG=""
          LINUX_SIG=""
          WINDOWS_SIG=""
          if [ -n "${ML_DSA_SECRET_KEY:-}" ]; then
            echo "Signing update artifacts with ML-DSA-65 (Post-Quantum Cryptography)..."
            if [ -f "./release/${DMG_NAME}" ]; then
              MACOS_SIG=$($SIGN_TOOL "$ML_DSA_SECRET_KEY" "./release/${DMG_NAME}")
              echo "macOS signature generated (${#MACOS_SIG} chars)"
            fi
            # Linux and Windows signatures would be generated in their respective build jobs
          else
            echo "ML_DSA_SECRET_KEY not set — update.json will have empty signatures"
            echo "To enable PQC-signed updates: ensure ML_DSA_SECRET_KEY secret is configured"
          fi

          # Generate update.json for Dioxus updater
          cat > ./release/update.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${VERSION}. See https://github.com/saorsa-labs/communitas/releases/tag/v${VERSION} for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-x86_64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/saorsa-labs/communitas/releases/download/v${VERSION}/${DMG_NAME}"
              },
              "darwin-aarch64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/saorsa-labs/communitas/releases/download/v${VERSION}/${DMG_NAME}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/saorsa-labs/communitas/releases/download/v${VERSION}/Communitas-Linux-${VERSION}.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/saorsa-labs/communitas/releases/download/v${VERSION}/Communitas-Windows-${VERSION}.zip"
              }
            }
          }
          EOF

          echo "Generated update.json:"
          cat ./release/update.json

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.build-macos.outputs.version }}
          name: Communitas ${{ needs.build-macos.outputs.version }}
          body: |
            ## Communitas ${{ needs.build-macos.outputs.version }}

            ## Downloads

            | Platform | Download | Notes |
            |----------|----------|-------|
            | macOS | `Communitas-macOS-${{ needs.build-macos.outputs.version }}.dmg` | Native Swift app (recommended) |
            | Windows | `Communitas-Windows-${{ needs.build-macos.outputs.version }}.zip` | Dioxus cross-platform |
            | Linux | `Communitas-Linux-${{ needs.build-macos.outputs.version }}.tar.gz` | Dioxus cross-platform |
            | macOS (alt) | `Communitas-macOS-Dioxus-${{ needs.build-macos.outputs.version }}.dmg` | Dioxus engine (dev/testing) |

            All macOS downloads are signed and notarized by Apple.

            ### Requirements
            - macOS 13.0 (Ventura) or later for the Swift app
            - x0x daemon: `curl -sfL https://x0x.md | sh && x0x autostart && x0x start`

            ### Installation
            1. Download the DMG file for your platform
            2. Open the DMG
            3. Drag Communitas to your Applications folder
            4. Launch from Applications
            5. If prompted, allow the app in System Preferences > Security & Privacy

            ### What's New
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ### Support
            - Issues: https://github.com/${{ github.repository }}/issues
            - Documentation: https://github.com/${{ github.repository }}/tree/main/docs
          files: |
            ./release/${{ needs.build-macos.outputs.dmg_name }}
            ./release/update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
