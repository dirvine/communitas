[package]
name = "communitas-dioxus"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
communitas-core = { package = "communitas-core", path = "../communitas-core" }
communitas-ui-api = { path = "../communitas-ui-api" }
communitas-ui-service = { path = "../communitas-ui-service" }
dioxus = { version = "0.7", features = ["desktop", "router", "signals"] }
dioxus-logger = "0.5.1"
tracing.workspace = true
futures.workspace = true
chrono.workspace = true
base64.workspace = true
native-dialog = "0.7"
notify-rust = "4"
dirs = "5.0"
cpal = "0.15"
async-trait = "0.1"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }

[dependencies.tokio]
workspace = true
features = ["rt", "sync"]

[dev-dependencies]
dioxus-ssr = "0.7"
dioxus-history = "0.7"
tempfile = "3.10"
tokio-test = { version = "0.4" }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "startup"
harness = false
