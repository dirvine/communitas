<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy: Restrict resource loading to same origin -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                  script-src 'self' 'unsafe-inline';
                  style-src 'self' 'unsafe-inline';
                  img-src 'self' data: https:;
                  connect-src 'self' ws://localhost:* wss://localhost:* wss://*.saorsalabs.com;
                  object-src 'none';
                  base-uri 'self';
                  form-action 'self';
                  frame-ancestors 'self';">
    <title>Communitas Canvas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #999;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            padding: 8px 16px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .tool-btn {
            padding: 8px 12px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .tool-btn:hover { background: #444; }
        .tool-btn.active { background: #3b82f6; }
        .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            background: #f8f9fa;
        }
        .layer-panel {
            position: absolute;
            right: 16px;
            top: 16px;
            width: 200px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 12px;
        }
        .layer-panel h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 8px;
        }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .layer-item:hover { background: #333; }
        .layer-item.active { background: rgba(16, 185, 129, 0.2); border-left: 2px solid #10b981; }
        .layer-item.hidden-layer .layer-name { color: #64748b; }
        .layer-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            font-size: 12px;
            transition: background 0.2s, color 0.2s;
            color: #94a3b8;
        }
        .layer-btn:hover { background: #475569; }
        .layer-btn:focus { outline: 2px solid #3b82f6; outline-offset: 2px; }
        .layer-btn.locked { color: #fbbf24; }
        .layer-btn.delete:hover { color: #f87171; }
        .layer-name { flex: 1; font-size: 13px; color: white; }
        .layer-opacity {
            width: 50px;
            height: 4px;
            accent-color: #10b981;
            cursor: pointer;
        }
        .layer-opacity-label { font-size: 10px; color: #64748b; width: 28px; text-align: right; }
        .layer-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid #374151;
            margin-bottom: 8px;
        }
        .layer-panel-header h3 { margin: 0; }
        .layer-panel-actions { display: flex; gap: 4px; }
        .layer-panel.collapsed { width: 32px; padding: 8px; }
        .layer-panel.collapsed .layer-panel-content { display: none; }
        .remote-cursors {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .remote-cursor {
            position: absolute;
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }
        .cursor-pointer {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid;
        }
        .cursor-label {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .history-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        /* History scrubber panel */
        .history-scrubber {
            position: absolute;
            left: 16px;
            top: 16px;
            width: 280px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 12px;
        }
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #374151;
        }
        .history-header h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #999;
            margin: 0;
        }
        .history-position {
            font-size: 11px;
            color: #64748b;
        }
        .history-timeline {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .history-dot {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #475569;
            color: #94a3b8;
            border: none;
        }
        .history-dot:hover { background: #64748b; }
        .history-dot:focus { outline: 2px solid #3b82f6; outline-offset: 2px; }
        .history-dot.current {
            background: #10b981;
            color: white;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
        }
        .history-dot.future { background: #374151; color: #64748b; }
        .history-empty { text-align: center; color: #64748b; font-size: 12px; padding: 8px; }
        .history-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .history-progress-bar {
            flex: 1;
            height: 4px;
            background: #374151;
            border-radius: 2px;
            overflow: hidden;
        }
        .history-progress-fill {
            height: 100%;
            background: #10b981;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Loading canvas...</div>
    </div>
    <script src="../shared/mcp-bridge.js"></script>
    <script>
        // Canvas widget - Phase 2.5 implementation + Phase 9.3 AI Context
        const app = document.getElementById('app');
        const bridge = new McpBridge();
        let canvas, ctx;
        let canvasData = null;
        let layers = [];
        let remoteCursors = {};
        let activeLayerId = null;
        let panelCollapsed = false;
        let historyEntries = [];
        let currentHistoryIndex = 0;
        let resizeListenerAdded = false;

        // Set initial context on widget load (Phase 9.3)
        function initContext() {
            bridge.setCurrentView('canvas', {
                view_mode: 'loading'
            });
        }

        // Update canvas view context (Phase 9.3)
        function updateCanvasContext() {
            if (!canvasData) return;
            bridge.setCurrentView('canvas', {
                view_mode: 'editor',
                view_id: canvasData.id,
                canvas_name: canvasData.name,
                layer_count: layers.length,
                active_layer: activeLayerId,
                history_position: currentHistoryIndex + 1,
                history_total: historyEntries.length
            });
        }

        function renderLayerList(layerList) {
            // Sort by z_index (highest first for visual stacking)
            const sorted = [...layerList].sort((a, b) => (b.z_index || 0) - (a.z_index || 0));
            return sorted.map(l => {
                const escapedName = bridge.escapeHTML(l.name || 'Unnamed');
                const opacity = Math.round((l.opacity ?? 1) * 100);
                const visibilityState = l.visible ? 'visible' : 'hidden';
                const lockState = l.locked ? ', locked' : '';
                const ariaLabel = `Layer ${escapedName}, ${visibilityState}${lockState}, ${opacity}% opacity`;
                const activeClass = l.id === activeLayerId ? 'active' : '';
                const hiddenClass = !l.visible ? 'hidden-layer' : '';
                return `
                    <div class="layer-item ${activeClass} ${hiddenClass}"
                         data-layer-id="${l.id}"
                         role="option"
                         aria-selected="${l.id === activeLayerId}"
                         aria-label="${ariaLabel}">
                        <button class="layer-btn" data-action="visibility" data-id="${l.id}"
                                title="${l.visible ? 'Hide layer' : 'Show layer'}"
                                aria-label="${l.visible ? 'Hide layer' : 'Show layer'}">
                            ${l.visible ? '👁' : '👁‍🗨'}
                        </button>
                        <button class="layer-btn ${l.locked ? 'locked' : ''}" data-action="lock" data-id="${l.id}"
                                title="${l.locked ? 'Unlock layer' : 'Lock layer'}"
                                aria-label="${l.locked ? 'Unlock layer' : 'Lock layer'}">
                            ${l.locked ? '🔒' : '🔓'}
                        </button>
                        <span class="layer-name">${escapedName}</span>
                        <input type="range" class="layer-opacity" min="0" max="100" value="${opacity}"
                               data-id="${l.id}" title="Layer opacity: ${opacity}%"
                               aria-label="Layer opacity">
                        <span class="layer-opacity-label">${opacity}%</span>
                        <button class="layer-btn delete" data-action="delete" data-id="${l.id}"
                                title="Delete layer" aria-label="Delete layer">🗑</button>
                    </div>
                `;
            }).join('');
        }

        async function loadCanvas(canvasId) {
            try {
                const result = await bridge.callTool('canvas_get_snapshot', { canvas_id: canvasId });
                const data = JSON.parse(result.content[0].text);
                canvasData = data;
                renderCanvas(data);
                loadHistory(canvasId);
                loadRemoteCursors(canvasId);

                // Update AI context with canvas view (Phase 9.3)
                updateCanvasContext();
                bridge.clearErrorState();
            } catch (err) {
                const errorMsg = bridge.escapeHTML(err.message || 'Unknown error');
                app.innerHTML = `<div class="loading">Error: ${errorMsg}</div>`;

                // Set error context for AI troubleshooting (Phase 9.3)
                bridge.setErrorState('network', err.message || 'Failed to load canvas', {
                    recoverable: true,
                    recovery_hint: 'Try refreshing or check your network connection'
                });
            }
        }

        async function loadHistory(canvasId) {
            try {
                const result = await bridge.callTool('canvas_get_history', { canvas_id: canvasId });
                const data = JSON.parse(result.content[0].text);
                historyEntries = data.entries || [];
                currentHistoryIndex = data.current_index ?? (historyEntries.length - 1);
                updateHistoryButtons(data);
                renderHistoryTimeline();
            } catch (err) {
                console.error('Failed to load history:', err);
            }
        }

        function getActionIcon(actionType) {
            const icons = {
                'add_element': '+',
                'delete_element': '-',
                'modify_element': '~',
                'add_layer': 'L+',
                'delete_layer': 'L-',
                'modify_layer': 'L~',
                'batch_operation': '[]'
            };
            return icons[actionType] || '?';
        }

        function renderHistoryTimeline() {
            const timeline = document.getElementById('history-timeline');
            const posLabel = document.getElementById('history-pos');
            const progressFill = document.getElementById('history-progress');

            if (!timeline) return;

            if (historyEntries.length === 0) {
                timeline.innerHTML = '<div class="history-empty">No history yet</div>';
                if (posLabel) posLabel.textContent = '0/0';
                if (progressFill) progressFill.style.width = '0%';
                return;
            }

            timeline.innerHTML = historyEntries.map((entry, index) => {
                const escapedDesc = bridge.escapeHTML(entry.description || 'Action');
                const icon = getActionIcon(entry.action_type);
                const currentClass = index === currentHistoryIndex ? 'current' : '';
                const futureClass = index > currentHistoryIndex ? 'future' : '';
                return `
                    <button class="history-dot ${currentClass} ${futureClass}"
                            data-index="${index}"
                            data-entry-id="${entry.id}"
                            title="${escapedDesc}"
                            aria-label="${escapedDesc}"
                            role="option"
                            aria-selected="${index === currentHistoryIndex}">
                        ${icon}
                    </button>
                `;
            }).join('');

            // Update position label and progress
            if (posLabel) {
                posLabel.textContent = `${currentHistoryIndex + 1}/${historyEntries.length}`;
            }
            if (progressFill) {
                const progress = historyEntries.length > 0
                    ? Math.round(((currentHistoryIndex + 1) / historyEntries.length) * 100)
                    : 0;
                progressFill.style.width = `${progress}%`;
            }

            // Add click handlers for scrubbing with AI context (Phase 9.3)
            timeline.querySelectorAll('.history-dot').forEach(dot => {
                dot.addEventListener('click', async () => {
                    const targetIndex = parseInt(dot.dataset.index);
                    const entryId = dot.dataset.entryId;
                    if (targetIndex === currentHistoryIndex) return;

                    // Track pending scrub action (Phase 9.3)
                    bridge.setPendingActions('scrub', [entryId]);

                    try {
                        await bridge.callTool('canvas_scrub_to', {
                            canvas_id: canvasData.id,
                            entry_id: entryId
                        });
                        currentHistoryIndex = targetIndex;
                        renderHistoryTimeline();
                        // Reload canvas to show new state
                        const result = await bridge.callTool('canvas_get_snapshot', { canvas_id: canvasData.id });
                        const data = JSON.parse(result.content[0].text);
                        canvasData = data;
                        layers = data.layers || [];
                        drawSnapshot(data);
                        updateLayerPanel();

                        // Clear pending action and update context (Phase 9.3)
                        bridge.clearPendingActions();
                        updateCanvasContext();
                    } catch (err) {
                        console.error('Failed to scrub to history:', err);

                        // Set error context (Phase 9.3)
                        bridge.setErrorState('internal', 'History scrub failed', {
                            recoverable: true,
                            recovery_hint: 'Try again or refresh the canvas'
                        });
                        bridge.clearPendingActions();
                    }
                });
            });
        }

        async function loadRemoteCursors(canvasId) {
            try {
                const result = await bridge.callTool('canvas_get_remote_cursors', { canvas_id: canvasId });
                const data = JSON.parse(result.content[0].text);
                renderRemoteCursors(data.cursors || []);
            } catch (err) {
                // Remote cursors optional
            }
        }

        function renderCanvas(data) {
            layers = data.layers || [{ id: 'default', name: 'Layer 1', visible: true }];
            // Escape canvas name to prevent XSS
            const escapedCanvasName = bridge.escapeHTML(data.name || 'Canvas');

            const html = `
                <div class="canvas-container">
                    <div class="toolbar">
                        <div class="toolbar-group">
                            <span style="color: #999">${escapedCanvasName}</span>
                        </div>
                        <div class="toolbar-group history-controls">
                            <button class="tool-btn" id="undo" disabled>↩ Undo</button>
                            <button class="tool-btn" id="redo" disabled>↪ Redo</button>
                        </div>
                        <div class="toolbar-group">
                            <button class="tool-btn" id="export">📥 Export</button>
                        </div>
                    </div>
                    <div class="canvas-area">
                        <canvas id="canvas"></canvas>
                        <div class="remote-cursors" id="cursors"></div>
                        <div class="history-scrubber" id="history-panel" role="region" aria-label="Canvas history">
                            <div class="history-header">
                                <h3>History</h3>
                                <span class="history-position" id="history-pos">0/0</span>
                            </div>
                            <div class="history-timeline" id="history-timeline" role="listbox" aria-label="History timeline">
                                <div class="history-empty">No history yet</div>
                            </div>
                            <div class="history-progress">
                                <div class="history-progress-bar">
                                    <div class="history-progress-fill" id="history-progress" style="width: 0%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="layer-panel" id="layer-panel" role="region" aria-label="Layer panel">
                            <div class="layer-panel-header">
                                <h3>Layers</h3>
                                <div class="layer-panel-actions">
                                    <button class="layer-btn" id="add-layer" title="Add layer" aria-label="Add new layer">+</button>
                                    <button class="layer-btn" id="collapse-panel" title="Collapse panel" aria-label="Collapse layer panel">▶</button>
                                </div>
                            </div>
                            <div class="layer-panel-content" role="listbox" aria-label="Canvas layers">
                                ${renderLayerList(layers)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            app.innerHTML = html;

            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            drawSnapshot(data);

            // Only add resize listener once to prevent memory leak
            if (!resizeListenerAdded) {
                window.addEventListener('resize', resizeCanvas);
                resizeListenerAdded = true;
            }

            document.getElementById('undo').addEventListener('click', async () => {
                // Track pending undo action (Phase 9.3)
                bridge.setPendingActions('undo', [canvasData?.id]);

                try {
                    await bridge.callTool('canvas_undo', { canvas_id: canvasData.id });
                    if (currentHistoryIndex > 0) {
                        currentHistoryIndex--;
                        renderHistoryTimeline();
                    }

                    // Clear pending action on success (Phase 9.3)
                    bridge.clearPendingActions();

                    loadCanvas(canvasData.id);
                } catch (err) {
                    console.error('Undo failed:', err);

                    // Set error context (Phase 9.3)
                    bridge.setErrorState('internal', 'Undo failed', {
                        recoverable: true,
                        recovery_hint: 'Try again or refresh the canvas'
                    });
                    bridge.clearPendingActions();
                }
            });

            document.getElementById('redo').addEventListener('click', async () => {
                // Track pending redo action (Phase 9.3)
                bridge.setPendingActions('redo', [canvasData?.id]);

                try {
                    await bridge.callTool('canvas_redo', { canvas_id: canvasData.id });
                    if (currentHistoryIndex < historyEntries.length - 1) {
                        currentHistoryIndex++;
                        renderHistoryTimeline();
                    }

                    // Clear pending action on success (Phase 9.3)
                    bridge.clearPendingActions();

                    loadCanvas(canvasData.id);
                } catch (err) {
                    console.error('Redo failed:', err);

                    // Set error context (Phase 9.3)
                    bridge.setErrorState('internal', 'Redo failed', {
                        recoverable: true,
                        recovery_hint: 'Try again or refresh the canvas'
                    });
                    bridge.clearPendingActions();
                }
            });

            document.getElementById('export').addEventListener('click', exportCanvas);

            setupLayerPanelEvents();
        }

        function setupLayerPanelEvents() {
            // Layer item click for selection with AI context (Phase 9.3)
            document.querySelectorAll('.layer-item').forEach(item => {
                item.addEventListener('click', e => {
                    if (e.target.closest('.layer-btn') || e.target.closest('.layer-opacity')) return;
                    activeLayerId = item.dataset.layerId;
                    updateLayerPanel();

                    // Track layer selection (Phase 9.3)
                    bridge.setSelectionState('layer', [activeLayerId]);
                    const layer = layers.find(l => l.id === activeLayerId);
                    bridge.sendMessageWithContext(`User selected layer: ${layer?.name || activeLayerId}`);
                    updateCanvasContext();
                });
            });

            // Visibility toggle
            document.querySelectorAll('[data-action="visibility"]').forEach(btn => {
                btn.addEventListener('click', async e => {
                    e.stopPropagation();
                    const layerId = btn.dataset.id;
                    const layer = layers.find(l => l.id === layerId);
                    if (layer) {
                        layer.visible = !layer.visible;
                        drawSnapshot(canvasData);
                        updateLayerPanel();
                        try {
                            await bridge.callTool('canvas_toggle_layer_visibility', {
                                canvas_id: canvasData.id,
                                layer_id: layerId,
                                visible: layer.visible
                            });
                        } catch (err) {
                            console.error('Failed to toggle visibility:', err);
                        }
                    }
                });
            });

            // Lock toggle
            document.querySelectorAll('[data-action="lock"]').forEach(btn => {
                btn.addEventListener('click', async e => {
                    e.stopPropagation();
                    const layerId = btn.dataset.id;
                    const layer = layers.find(l => l.id === layerId);
                    if (layer) {
                        layer.locked = !layer.locked;
                        updateLayerPanel();
                        try {
                            await bridge.callTool('canvas_toggle_layer_lock', {
                                canvas_id: canvasData.id,
                                layer_id: layerId,
                                locked: layer.locked
                            });
                        } catch (err) {
                            console.error('Failed to toggle lock:', err);
                        }
                    }
                });
            });

            // Opacity slider
            document.querySelectorAll('.layer-opacity').forEach(slider => {
                slider.addEventListener('input', e => {
                    const layerId = slider.dataset.id;
                    const layer = layers.find(l => l.id === layerId);
                    if (layer) {
                        layer.opacity = parseInt(e.target.value) / 100;
                        const label = slider.nextElementSibling;
                        if (label) label.textContent = e.target.value + '%';
                        drawSnapshot(canvasData);
                    }
                });
                slider.addEventListener('change', async e => {
                    const layerId = slider.dataset.id;
                    const layer = layers.find(l => l.id === layerId);
                    if (layer) {
                        try {
                            await bridge.callTool('canvas_set_layer_opacity', {
                                canvas_id: canvasData.id,
                                layer_id: layerId,
                                opacity: layer.opacity
                            });
                        } catch (err) {
                            console.error('Failed to set opacity:', err);
                        }
                    }
                });
            });

            // Delete layer
            document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', async e => {
                    e.stopPropagation();
                    const layerId = btn.dataset.id;
                    if (layers.length <= 1) {
                        alert('Cannot delete the last layer');
                        return;
                    }
                    try {
                        await bridge.callTool('canvas_delete_layer', {
                            canvas_id: canvasData.id,
                            layer_id: layerId
                        });
                        layers = layers.filter(l => l.id !== layerId);
                        if (activeLayerId === layerId) {
                            activeLayerId = layers[0]?.id || null;
                        }
                        updateLayerPanel();
                        drawSnapshot(canvasData);
                    } catch (err) {
                        console.error('Failed to delete layer:', err);
                    }
                });
            });

            // Add layer button
            const addBtn = document.getElementById('add-layer');
            if (addBtn) {
                addBtn.addEventListener('click', async () => {
                    try {
                        const result = await bridge.callTool('canvas_add_layer', {
                            canvas_id: canvasData.id,
                            name: `Layer ${layers.length + 1}`
                        });
                        const data = JSON.parse(result.content[0].text);
                        if (data.layer) {
                            layers.push(data.layer);
                            activeLayerId = data.layer.id;
                            updateLayerPanel();
                        }
                    } catch (err) {
                        console.error('Failed to add layer:', err);
                    }
                });
            }

            // Collapse panel button
            const collapseBtn = document.getElementById('collapse-panel');
            if (collapseBtn) {
                collapseBtn.addEventListener('click', () => {
                    panelCollapsed = !panelCollapsed;
                    const panel = document.getElementById('layer-panel');
                    if (panel) {
                        panel.classList.toggle('collapsed', panelCollapsed);
                        collapseBtn.textContent = panelCollapsed ? '◀' : '▶';
                        collapseBtn.title = panelCollapsed ? 'Expand panel' : 'Collapse panel';
                    }
                });
            }
        }

        function updateLayerPanel() {
            const content = document.querySelector('.layer-panel-content');
            if (content) {
                content.innerHTML = renderLayerList(layers);
                setupLayerPanelEvents();
            }
        }

        function resizeCanvas() {
            const area = document.querySelector('.canvas-area');
            if (area && canvas) {
                canvas.width = area.clientWidth;
                canvas.height = area.clientHeight;
                if (canvasData) drawSnapshot(canvasData);
            }
        }

        function drawSnapshot(data) {
            if (!ctx) return;
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw elements from visible layers
            const elements = data.elements || [];
            elements.forEach(el => {
                const layer = layers.find(l => l.id === el.layer_id);
                if (layer && !layer.visible) return;

                ctx.save();
                // Apply layer opacity
                if (layer && typeof layer.opacity === 'number') {
                    ctx.globalAlpha = layer.opacity;
                }
                switch (el.type) {
                    case 'rectangle':
                        ctx.fillStyle = el.fill || '#3b82f6';
                        ctx.fillRect(el.x, el.y, el.width, el.height);
                        break;
                    case 'circle':
                        ctx.fillStyle = el.fill || '#3b82f6';
                        ctx.beginPath();
                        ctx.arc(el.x, el.y, el.radius, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case 'text':
                        ctx.fillStyle = el.color || '#1a1a1a';
                        ctx.font = `${el.fontSize || 16}px sans-serif`;
                        ctx.fillText(el.text, el.x, el.y);
                        break;
                    case 'line':
                        ctx.strokeStyle = el.stroke || '#1a1a1a';
                        ctx.lineWidth = el.lineWidth || 2;
                        ctx.beginPath();
                        ctx.moveTo(el.x1, el.y1);
                        ctx.lineTo(el.x2, el.y2);
                        ctx.stroke();
                        break;
                }
                ctx.restore();
            });
        }

        function updateHistoryButtons(historyData) {
            const undoBtn = document.getElementById('undo');
            const redoBtn = document.getElementById('redo');
            if (undoBtn) undoBtn.disabled = !historyData.can_undo;
            if (redoBtn) redoBtn.disabled = !historyData.can_redo;
        }

        // Validate and sanitize CSS color value to prevent injection
        function sanitizeColor(color) {
            const defaultColor = '#3b82f6';
            if (!color || typeof color !== 'string') return defaultColor;
            // Allow only valid hex colors or CSS color names
            if (/^#[0-9A-Fa-f]{3,8}$/.test(color)) return color;
            if (/^(rgb|hsl)a?\([0-9,.\s%]+\)$/.test(color)) return color;
            // Limited whitelist of safe color names
            const safeColors = ['red', 'green', 'blue', 'yellow', 'orange', 'purple', 'pink', 'cyan', 'white', 'black', 'gray', 'grey'];
            if (safeColors.includes(color.toLowerCase())) return color;
            return defaultColor;
        }

        function renderRemoteCursors(cursors) {
            const container = document.getElementById('cursors');
            if (!container) return;

            container.innerHTML = cursors.map(c => {
                const userName = bridge.escapeHTML(c.user_name || 'Anonymous');
                // Sanitize numeric values to prevent CSS injection
                const x = Number.isFinite(c.x) ? Math.round(c.x) : 0;
                const y = Number.isFinite(c.y) ? Math.round(c.y) : 0;
                const color = sanitizeColor(c.color);
                return `
                <div class="remote-cursor" style="left: ${x}px; top: ${y}px;">
                    <div class="cursor-pointer" style="border-bottom-color: ${color}"></div>
                    <span class="cursor-label" style="background: ${color}; color: white">
                        ${userName}
                    </span>
                </div>
            `
            }).join('');
        }

        function exportCanvas() {
            if (!canvas) return;

            // Track export action (Phase 9.3)
            bridge.sendMessageWithContext(`User exported canvas: ${canvasData?.name || 'Canvas'} as PNG`);

            const link = document.createElement('a');
            link.download = 'canvas-export.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Initialize context and load canvas (Phase 9.3)
        bridge.onReady(() => {
            initContext();

            // Try to get canvasId from URL params or load default
            const params = new URLSearchParams(window.location.search);
            const canvasId = params.get('canvas_id');
            if (canvasId) {
                loadCanvas(canvasId);
            } else {
                app.innerHTML = '<div class="loading">No canvas selected</div>';
                bridge.setCurrentView('canvas', { view_mode: 'empty' });
            }
        });
    </script>
</body>
</html>
