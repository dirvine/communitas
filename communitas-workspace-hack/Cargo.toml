[package]
name = "communitas-workspace-hack"
version = "0.1.0"
license.workspace = true
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

### BEGIN HAKARI SECTION
[dependencies]
bitflags = { version = "2", default-features = false, features = ["serde"] }
bytemuck = { version = "1", default-features = false, features = ["extern_crate_alloc"] }
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_builder = { version = "4", default-features = false, features = ["color", "env", "help", "std", "suggestions", "usage"] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
crypto-common = { version = "0.1", default-features = false, features = ["getrandom", "std"] }
curve25519-dalek = { version = "4", features = ["digest"] }
digest = { version = "0.10", features = ["mac", "oid", "std"] }
ed25519-dalek = { version = "2", features = ["digest", "rand_core"] }
either = { version = "1", features = ["use_std"] }
futures = { version = "0.3" }
futures-channel = { version = "0.3", features = ["sink"] }
futures-core = { version = "0.3" }
futures-executor = { version = "0.3" }
futures-io = { version = "0.3" }
futures-util = { version = "0.3", features = ["channel", "io", "sink"] }
generic-array = { version = "0.14", default-features = false, features = ["more_lengths", "zeroize"] }
getrandom = { version = "0.2", default-features = false, features = ["js", "rdrand", "std"] }
hashbrown-5ef9efb8ec2df382 = { package = "hashbrown", version = "0.12", features = ["raw"] }
hashbrown-986da7b5efc2b80e = { package = "hashbrown", version = "0.16" }
hyper-582f2526e08bb6a0 = { package = "hyper", version = "0.14", features = ["full"] }
hyper-dff4ba8e3ae991db = { package = "hyper", version = "1", features = ["http1", "http2", "server"] }
idna = { version = "1" }
log = { version = "0.4", default-features = false, features = ["std"] }
manganis-core = { version = "0.7", default-features = false, features = ["dioxus"] }
memchr = { version = "2" }
num-traits = { version = "0.2", features = ["i128"] }
percent-encoding = { version = "2" }
rand-274715c4dabd11b0 = { package = "rand", version = "0.9" }
rand-c38e5c1d305a1b54 = { package = "rand", version = "0.8", features = ["small_rng"] }
rand_chacha-274715c4dabd11b0 = { package = "rand_chacha", version = "0.9", default-features = false, features = ["std"] }
rand_chacha-468e82937335b1c9 = { package = "rand_chacha", version = "0.3" }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
regex = { version = "1" }
regex-automata = { version = "0.4", default-features = false, features = ["dfa-build", "dfa-onepass", "hybrid", "meta", "nfa-backtrack", "perf-inline", "perf-literal", "std", "unicode"] }
regex-syntax = { version = "0.8" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls", "json", "rustls-tls"] }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "rc", "result", "std"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.10" }
signature = { version = "2", default-features = false, features = ["digest", "rand_core", "std"] }
simd-adler32 = { version = "0.3", default-features = false, features = ["std"] }
smallvec = { version = "1", default-features = false, features = ["const_new", "union"] }
spin = { version = "0.9" }
subtle = { version = "2", features = ["const-generics"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tower = { version = "0.4", features = ["balance", "buffer", "limit", "timeout", "util"] }
tracing = { version = "0.1", features = ["log"] }
tracing-core = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "local-time"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive", "simd"] }
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
crypto-common = { version = "0.1", default-features = false, features = ["getrandom", "std"] }
digest = { version = "0.10", features = ["mac", "oid", "std"] }
displaydoc = { version = "0.2" }
either = { version = "1", features = ["use_std"] }
