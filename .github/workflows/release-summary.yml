name: Release Summary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  summarize:
    name: Summarize Release
    runs-on: ubuntu-latest
    steps:
      - name: Update release with build summary
        uses: actions/github-script@v7
        env:
          TAG_REF: ${{ github.ref }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_REF.replace('refs/tags/','');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function waitForRelease() {
              const maxMs = 30 * 60 * 1000; // 30 minutes
              const interval = 15000;
              let waited = 0;
              while (waited <= maxMs) {
                try {
                  const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                  return rel.data;
                } catch (e) {
                  if (e.status !== 404) throw e;
                  await new Promise(r => setTimeout(r, interval));
                  waited += interval;
                }
              }
              throw new Error('Timed out waiting for release to exist');
            }

            const rel = await waitForRelease();
            const when = new Date().toISOString();
            const ver = tag.replace(/^v/, '');
            const summary = [
              '',
              '',
              '## Build Summary (auto)',
              '',
              '| Platform | Asset | Description |',
              '|----------|-------|-------------|',
              `| macOS | \`Communitas-macOS-${ver}.dmg\` | Native Swift app — recommended for Mac |`,
              `| Windows | \`Communitas-Windows-${ver}.zip\` | Dioxus cross-platform app |`,
              `| Linux | \`Communitas-Linux-${ver}.tar.gz\` | Dioxus cross-platform app |`,
              `| macOS (alt) | \`Communitas-macOS-Dioxus-${ver}.dmg\` | Dioxus engine build (dev/testing) |`,
              '',
              `Generated: ${when}`,
            ].join('\n');

            const body = (rel.body || '');
            const newBody = body.includes('## Build Summary (auto)') ? body.replace(/\n\n## Build Summary \(auto\)[\s\S]*/m, summary) : (body + summary);
            await github.rest.repos.updateRelease({ owner, repo, release_id: rel.id, body: newBody });

            core.info(`Updated release ${rel.tag_name} with summary.`);
