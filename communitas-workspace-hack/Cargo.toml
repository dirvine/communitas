log = { version = "0.4", default-features = false, features = ["std"] }
manganis-core = { version = "0.7", default-features = false, features = ["dioxus"] }
memchr = { version = "2" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = { version = "1" }
rand-c38e5c1d305a1b54 = { package = "rand", version = "0.8", features = ["small_rng"] }
rand_chacha-468e82937335b1c9 = { package = "rand_chacha", version = "0.3" }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "rc", "result", "std"] }
sha2 = { version = "0.10" }
subtle = { version = "2", features = ["const-generics"] }
syn = { version = "2", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive", "simd"] }
zeroize = { version = "1", features = ["derive"] }

