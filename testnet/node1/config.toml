# Communitas Headless Node Configuration
# Node 1: philosophy-truth-prevent-wound (AMS3)

# Identity configuration
[identity]
four_words = "philosophy-truth-prevent-wound"
display_name = "TestNode1"

# Network configuration
[network]
listen_address = "0.0.0.0:9000"
bootstrap_nodes = [
    "philosophy-truth-prevent-wound:443", "donna-jewish-scorpion-socrates:443", "bike-in-porto-napkin:443", "congratulate-twice-tonga-hurt:443", "sponsor-biker-simon-leipzig:443", "event-ascent-net-remote:443"
]

# Storage configuration
[storage]
path = "./data"
max_size_gb = 10

# Logging configuration
[logging]
level = "info"
file = "./logs/node1.log"

# API configuration
[api]
enabled = true
address = "0.0.0.0:9002"
