# flutter_rust_bridge configuration
# See: https://cjycode.com/flutter_rust_bridge/guides/configuration

# Rust crate configuration
rust_input: crate::flutter_api
rust_root: ./

# Dart output configuration
dart_output: ../communitas-flutter/lib/src/bindings/

# Dart configuration
dart_entrypoint_class_name: CommunitasRust

# Code generation options
full_dep: true
local: true

# Formatting
dart_format: true

# Rust features to enable during parsing
rust_features:
  - flutter-bindings
