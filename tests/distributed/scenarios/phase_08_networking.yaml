# Phase 8: P2P Networking
# Tests network management tools

name: "Phase 8: P2P Networking"
description: "Tests network start/stop, connection management, and peer discovery"
tools_covered:
  - network_start
  - network_stop
  - network_connect
  - network_disconnect
  - network_status
  - network_peers
  - network_external_address

test_cases:
  # Ensure networking is unlocked and started on all nodes
  - id: NET-000
    name: "Ensure unlock + start networking"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: unlock_actor
      - tool: ensure_network_started

  # Check network status
  - id: NET-001
    name: "Check network status on all nodes"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: network_status
        expect:
          status: success

  # Get external address
  - id: NET-002
    name: "Get external address"
    actors: [alice]
    steps:
      - tool: network_external_address
        expect:
          status: success

  # List peers
  - id: NET-003
    name: "List connected peers"
    actors: [alice]
    steps:
      - tool: network_peers
        expect:
          status: success

  # Dave stops network (local node)
  - id: NET-004
    name: "Dave stops network"
    actors: [dave]
    steps:
      - tool: network_stop
        expect:
          status: success

  # Verify Dave disconnected
  - id: NET-005
    name: "Verify Dave's network stopped"
    actors: [dave]
    wait_ms: 2000
    steps:
      - tool: network_status
        expect:
          status: success
          fields:
            is_active: false

  # Alice sends message while Dave offline
  - id: NET-006
    name: "Alice sends message while Dave offline"
    actors: [alice]
    steps:
      - tool: send_message
        params:
          entity_id: "${channel_id}"
          text: "Message sent while Dave is offline"
        expect:
          status: success

  # Dave restarts network
  - id: NET-007
    name: "Dave restarts network"
    actors: [dave]
    steps:
      - tool: network_start
        expect:
          status: success

  # Wait for reconnection
  - id: NET-008
    name: "Wait for Dave to reconnect"
    actors: [dave]
    wait_ms: 5000
    steps:
      - tool: network_status
        expect:
          status: success
          fields:
            is_active: true

  # Verify sync after reconnection
  - id: NET-009
    name: "Verify Dave received offline message"
    actors: [dave]
    wait_ms: 5000
    steps:
      - tool: get_messages
        params:
          entity_id: "${channel_id}"
        expect:
          status: success
          contains:
            - text: "Message sent while Dave is offline"

  # Test direct connection
  - id: NET-010
    name: "Alice checks peer count"
    actors: [alice]
    steps:
      - tool: network_peers
        expect:
          status: success

  # All nodes verify peer connectivity
  - id: NET-011
    name: "All nodes check connectivity"
    actors: [alice, bob, charlie, dave]
    parallel: true
    wait_ms: 3000
    steps:
      - tool: network_status
        expect:
          status: success
          fields:
            is_active: true
