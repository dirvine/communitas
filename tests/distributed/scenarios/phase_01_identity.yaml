# Phase 1: Identity & Authentication
# Tests authentication, vault creation, and health checks

name: "Phase 1: Identity & Authentication"
description: "Tests identity management, authentication, and basic health checks"
tools_covered:
  - health_check
  - create_vault
  - get_profile
  - core_status
  - network_status
  - network_start
  - network_connect

test_cases:
  # Health check all nodes
  - id: AUTH-001
    name: "All nodes health check"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: health_check
        expect:
          status: success

  # Check core status before authentication
  - id: AUTH-002
    name: "Check core status (unauthenticated)"
    actors: [alice]
    steps:
      - tool: core_status
        expect:
          status: success

  # Create vaults for all test users
  - id: AUTH-003
    name: "Create vault for Alice"
    actors: [alice]
    steps:
      - tool: create_vault
        params:
          four_words: "ocean.forest.moon.star"
          display_name: "Alice Test"
        expect:
          status: success
      - tool: get_profile
        expect:
          status: success
        store:
          alice_identity: four_words

  - id: AUTH-004
    name: "Create vault for Bob"
    actors: [bob]
    steps:
      - tool: create_vault
        params:
          four_words: "river.mountain.sun.cloud"
          display_name: "Bob Test"
        expect:
          status: success
      - tool: get_profile
        expect:
          status: success
        store:
          bob_identity: four_words

  - id: AUTH-005
    name: "Create vault for Charlie"
    actors: [charlie]
    steps:
      - tool: create_vault
        params:
          four_words: "lake.valley.wind.rain"
          display_name: "Charlie Test"
        expect:
          status: success
      - tool: get_profile
        expect:
          status: success
        store:
          charlie_identity: four_words

  - id: AUTH-006
    name: "Create vault for Dave"
    actors: [dave]
    steps:
      - tool: create_vault
        params:
          four_words: "field.hill.fire.snow"
          display_name: "Dave Test"
        expect:
          status: success
      - tool: get_profile
        expect:
          status: success
        store:
          dave_identity: four_words

  # Verify authentication state
  - id: AUTH-007
    name: "Verify authenticated status"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: core_status
        expect:
          fields:
            initialized: true

  # Bring up networking for all actors (used by later phases)
  - id: AUTH-008
    name: "Ensure networking active"
    actors: [alice, bob, charlie, dave]
    parallel: true
    steps:
      - tool: ensure_network_started

  # Capture connection identities for explicit peer connects
  - id: AUTH-009
    name: "Capture Alice connection identity"
    actors: [alice]
    steps:
      - tool: network_status
        expect:
          status: success
        store:
          alice_connection: connection_identity

  - id: AUTH-010
    name: "Capture Bob connection identity"
    actors: [bob]
    steps:
      - tool: network_status
        expect:
          status: success
        store:
          bob_connection: connection_identity

  - id: AUTH-011
    name: "Capture Charlie connection identity"
    actors: [charlie]
    steps:
      - tool: network_status
        expect:
          status: success
        store:
          charlie_connection: connection_identity

  - id: AUTH-012
    name: "Capture Dave connection identity"
    actors: [dave]
    steps:
      - tool: network_status
        expect:
          status: success
        store:
          dave_connection: connection_identity

  - id: AUTH-013
    name: "Connect nodes to Alice"
    actors: [bob, charlie, dave]
    steps:
      - tool: network_connect
        params:
          peer_four_words: "${alice_connection}"
        expect:
          status: success
    wait_ms: 5000

  - id: AUTH-014
    name: "Connect Alice to other nodes"
    actors: [alice]
    steps:
      - tool: network_connect
        params:
          peer_four_words: "${bob_connection}"
        expect:
          status: success
      - tool: network_connect
        params:
          peer_four_words: "${charlie_connection}"
        expect:
          status: success
      - tool: network_connect
        params:
          peer_four_words: "${dave_connection}"
        expect:
          status: success
    wait_ms: 5000
