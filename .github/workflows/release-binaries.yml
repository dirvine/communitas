name: Build Binaries (Artifacts)

on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: version label for artifacts'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        elif [[ -n "${{ github.event.inputs.version }}" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="dev"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@1.88.0

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          wget \
          libssl-dev \
          pkg-config \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          libpipewire-0.3-dev \
          libasound2-dev \
          libdbus-1-dev \
          libxdo-dev
        sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
          || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build communitas-dioxus
      run: |
        cargo build --release -p communitas-dioxus

    - name: Strip Dioxus binary
      run: strip target/release/communitas-dioxus || true

    - name: Archive Dioxus
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        cd target/release
        tar -czf "Communitas-Linux-${VERSION}.tar.gz" communitas-dioxus

    - name: Upload Linux Dioxus
      uses: actions/upload-artifact@v4
      with:
        name: communitas-dioxus-linux-x86_64
        path: target/release/Communitas-Linux-${{ steps.version.outputs.version }}.tar.gz

  build-macos:
    name: Build macOS Binaries
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@1.88.0
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin

    - name: Create universal binary directory
      run: mkdir -p target/universal-apple-darwin

    - name: Build aarch64 Dioxus (native)
      run: cargo build --release -p communitas-dioxus --target aarch64-apple-darwin

    - name: Build x86_64 Dioxus (cross)
      env:
        CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: "cc"
      run: cargo build --release -p communitas-dioxus --target x86_64-apple-darwin

    - name: Create universal Dioxus binary
      run: |
        lipo target/x86_64-apple-darwin/release/communitas-dioxus \
             target/aarch64-apple-darwin/release/communitas-dioxus \
             -create -output target/universal-apple-darwin/communitas-dioxus

    - name: Archive Dioxus
      run: |
        cd target/universal-apple-darwin
        tar -czf communitas-dioxus-macos-universal.tar.gz communitas-dioxus

    - name: Upload macOS Dioxus
      uses: actions/upload-artifact@v4
      with:
        name: communitas-dioxus-macos-universal
        path: target/universal-apple-darwin/communitas-dioxus-macos-universal.tar.gz

  build-windows:
    name: Build Windows Binaries
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        elif [[ -n "${{ github.event.inputs.version }}" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="dev"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@1.88.0

    - name: Build communitas-dioxus
      run: |
        cargo build --release -p communitas-dioxus

    - name: Archive Dioxus
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        cd target/release
        Compress-Archive -Path communitas-dioxus.exe -DestinationPath "Communitas-Windows-${version}.zip"

    - name: Upload Windows Dioxus
      uses: actions/upload-artifact@v4
      with:
        name: communitas-dioxus-windows-x86_64
        path: target/release/Communitas-Windows-${{ steps.version.outputs.version }}.zip

  # ═══════════════════════════════════════════════════════════════════════════
  # Release Job — only runs on v* tag pushes
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Attach Binaries to GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: communitas-dioxus-linux-x86_64
          path: ./release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: communitas-dioxus-macos-universal
          path: ./release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: communitas-dioxus-windows-x86_64
          path: ./release

      - name: List release assets
        run: ls -lh ./release/

      - name: Wait for GitHub Release to exist
        run: |
          TAG="${{ github.ref_name }}"
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found after $((i * 30))s"
              exit 0
            fi
            echo "Waiting for release $TAG... attempt $i/60"
            sleep 30
          done
          echo "Release $TAG not found after 30 minutes"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries to GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release upload "${{ github.ref_name }}" \
            "./release/Communitas-Linux-${VERSION}.tar.gz" \
            "./release/communitas-dioxus-macos-universal.tar.gz" \
            "./release/Communitas-Windows-${VERSION}.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
