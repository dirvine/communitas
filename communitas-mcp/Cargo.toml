[package]
name = "communitas-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

description = "MCP (Model Context Protocol) server for Communitas - enables AI agents to control the platform"

[dependencies]
# Core dependency - the headless app
communitas-core = { path = "../communitas-core" }
communitas-kanban = { path = "../communitas-kanban" }

# CLI parsing
clap = { workspace = true, features = ["derive"] }

# Async runtime
tokio = { workspace = true, features = ["full", "io-std"] }
async-trait.workspace = true
futures.workspace = true

# JSON-RPC / Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Base64 for binary file encoding
base64 = "0.22"

# UUID for unique identifiers
uuid.workspace = true

blake3 = "1.5"
rand = "0.8"
lazy_static = "1.4"

# Web framework for HTTP transport
axum.workspace = true
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower.workspace = true
tower-http.workspace = true

# TLS with post-quantum cryptography
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
saorsa-pqc.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"

[[bin]]
name = "communitas-mcp"
path = "src/main.rs"
