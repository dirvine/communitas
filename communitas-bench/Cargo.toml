[package]
name = "communitas-bench"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
communitas-core = { path = "../communitas-core" }
communitas-ui-service = { path = "../communitas-ui-service" }
communitas-ui-api = { path = "../communitas-ui-api" }
blake3 = "1.6"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tempfile = "3"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
communitas-workspace-hack = { version = "0.1", path = "../communitas-workspace-hack" }

[[bench]]
name = "core_flows"
harness = false
