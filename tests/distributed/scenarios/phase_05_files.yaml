# Phase 5: Virtual Disks
# Tests file operations on per-entity virtual disks

name: "Phase 5: Virtual Disks"
description: "Tests file write, read, list, delete, and disk stats on virtual disks"
tools_covered:
  - write_file
  - read_file
  - list_files
  - delete_file
  - get_disk_stats

test_cases:
  # Write a file to organisation disk
  - id: FILE-001
    name: "Alice writes file to org disk"
    actors: [alice]
    steps:
      - tool: write_file
        params:
          entity_id: "${org_id}"
          path: "/docs/readme.md"
          content: "# Acme Corp\n\nWelcome to our organisation!"
        expect:
          status: success

  # Read the file back
  - id: FILE-002
    name: "Alice reads file from org disk"
    actors: [alice]
    steps:
      - tool: read_file
        params:
          entity_id: "${org_id}"
          path: "/docs/readme.md"
        expect:
          status: success
          contains:
            - "Acme Corp"
            - "Welcome"

  # Bob writes to same disk
  - id: FILE-003
    name: "Bob writes file to org disk"
    actors: [bob]
    steps:
      - tool: write_file
        params:
          entity_id: "${org_id}"
          path: "/docs/guidelines.md"
          content: "# Team Guidelines\n\n1. Be respectful\n2. Communicate clearly"
        expect:
          status: success

  # List files
  - id: FILE-004
    name: "List files on org disk"
    actors: [alice]
    wait_ms: 3000
    steps:
      - tool: list_files
        params:
          entity_id: "${org_id}"
          path: "/docs"
        expect:
          status: success
          contains:
            - name: "readme.md"
            - name: "guidelines.md"

  # Charlie writes to shared disk
  - id: FILE-005
    name: "Charlie writes meeting notes"
    actors: [charlie]
    steps:
      - tool: write_file
        params:
          entity_id: "${org_id}"
          path: "/meetings/2025-01-02.md"
          content: "# Meeting Notes\n\nAttendees: Alice, Bob, Charlie, Dave\n\n## Discussion\n- Project kickoff"
        expect:
          status: success

  # Verify file sync across nodes
  - id: FILE-006
    name: "Dave reads Charlie's file"
    actors: [dave]
    wait_ms: 3000
    steps:
      - tool: read_file
        params:
          entity_id: "${org_id}"
          path: "/meetings/2025-01-02.md"
        expect:
          status: success
          contains:
            - "Meeting Notes"
            - "Project kickoff"

  # Get disk stats
  - id: FILE-007
    name: "Get org disk stats"
    actors: [alice]
    steps:
      - tool: get_disk_stats
        params:
          entity_id: "${org_id}"
        expect:
          status: success

  # Write to project disk
  - id: FILE-008
    name: "Alice writes to project disk"
    actors: [alice]
    steps:
      - tool: write_file
        params:
          entity_id: "${project_id}"
          path: "/tasks.md"
          content: "# Sprint Tasks\n\n- [ ] Task 1\n- [ ] Task 2"
        expect:
          status: success

  # Delete a file
  - id: FILE-009
    name: "Alice deletes file"
    actors: [alice]
    steps:
      - tool: delete_file
        params:
          entity_id: "${project_id}"
          path: "/tasks.md"
        expect:
          status: success

  # Verify file deleted
  - id: FILE-010
    name: "Verify file deleted"
    actors: [alice]
    steps:
      - tool: read_file
        params:
          entity_id: "${project_id}"
          path: "/tasks.md"
        expect:
          status: error
          error_contains: "not found"

  # Test member cannot write without permission
  - id: FILE-011
    name: "Member write respects ACL"
    actors: [dave]
    steps:
      - tool: write_file
        params:
          entity_id: "${org_id}"
          path: "/docs/dave-notes.md"
          content: "Dave's contribution"
        expect:
          status: success  # Members can write
