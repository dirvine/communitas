<!DOCTYPE html>
<html>
<head>
    <title>Debug Communitas</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        iframe { width: 100%; height: 600px; border: 2px solid #333; }
        #console { background: #000; color: #0f0; padding: 10px; height: 200px; overflow: auto; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Communitas Debug Console</h1>

    <div>
        <button onclick="checkApp()">Check App</button>
        <button onclick="testInvoke()">Test Tauri Invoke</button>
        <button onclick="clearConsole()">Clear</button>
    </div>

    <div id="status"></div>
    <div id="console"></div>

    <h2>App Preview:</h2>
    <iframe id="appFrame" src="http://localhost:1422/"></iframe>

    <script>
        const logDiv = document.getElementById('console');
        const statusDiv = document.getElementById('status');

        function log(msg, color = '#0f0') {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearConsole() {
            logDiv.innerHTML = '';
        }

        function checkApp() {
            log('Checking app status...');

            // Try to access the iframe
            const iframe = document.getElementById('appFrame');
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const root = iframeDoc.getElementById('root');

                if (root) {
                    log(`✓ Root element found`, '#0f0');
                    if (root.children.length > 0) {
                        log(`✓ React rendered: ${root.children.length} children`, '#0f0');
                        statusDiv.innerHTML = '<h3 style="color: green">App is rendering!</h3>';
                    } else {
                        log(`✗ Root is empty - React not rendering`, '#f00');
                        statusDiv.innerHTML = '<h3 style="color: red">React failed to render</h3>';

                        // Check for console errors
                        if (iframe.contentWindow.console && iframe.contentWindow.console.error) {
                            log('Checking for console errors...', '#ff0');
                        }
                    }
                } else {
                    log(`✗ No root element`, '#f00');
                }
            } catch (e) {
                log(`✗ Cannot access iframe: ${e.message}`, '#f00');
            }
        }

        async function testInvoke() {
            log('Testing Tauri invoke...');

            // Try to load Tauri in this context
            try {
                const tauriScript = document.createElement('script');
                tauriScript.src = 'http://localhost:1422/@tauri-apps/api/core';
                document.head.appendChild(tauriScript);

                setTimeout(async () => {
                    if (window.__TAURI__) {
                        log('✓ Tauri API available', '#0f0');
                        try {
                            const result = await window.__TAURI__.core.invoke('core_status');
                            log(`✓ Invoke successful: ${JSON.stringify(result)}`, '#0f0');
                        } catch (e) {
                            log(`✗ Invoke failed: ${e}`, '#f00');
                        }
                    } else {
                        log('✗ Tauri API not available (browser mode)', '#ff0');
                    }
                }, 1000);
            } catch (e) {
                log(`✗ Error: ${e}`, '#f00');
            }
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            log('Page loaded', '#0ff');
            setTimeout(checkApp, 2000);
        });

        // Listen for messages from iframe
        window.addEventListener('message', (event) => {
            if (event.origin === 'http://localhost:1422') {
                log(`Message from app: ${JSON.stringify(event.data)}`, '#0ff');
            }
        });
    </script>
</body>
</html>
