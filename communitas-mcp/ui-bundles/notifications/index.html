<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Communitas</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6;
            --bg-hover: #e5e7eb;
            --bg-unread: #eff6ff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        .dark {
            --bg-primary: #1f2937;
            --bg-secondary: #111827;
            --bg-hover: #374151;
            --bg-unread: #1e3a5f;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .unread-badge {
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .mark-all-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 0.875rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.15s ease;
        }

        .mark-all-btn:hover {
            background: var(--bg-secondary);
        }

        .mark-all-btn:disabled {
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-tab {
            padding: 8px 16px;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .filter-tab:hover {
            background: var(--bg-hover);
        }

        .filter-tab.active {
            background: var(--accent-color);
            color: white;
        }

        /* Date Group */
        .date-group {
            margin-bottom: 24px;
        }

        .date-header {
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-left: 4px;
        }

        /* Notification List */
        .notification-list {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
        }

        .notification-item {
            display: flex;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.15s ease;
            position: relative;
        }

        .notification-item:last-child {
            border-bottom: none;
        }

        .notification-item:hover {
            background-color: var(--bg-hover);
        }

        .notification-item:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: -2px;
        }

        .notification-item.unread {
            background-color: var(--bg-unread);
        }

        .notification-item.unread::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent-color);
        }

        .notification-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            border-radius: 50%;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .notification-icon.message { background: #dbeafe; }
        .notification-icon.mention { background: #fef3c7; }
        .notification-icon.call { background: #dcfce7; }
        .notification-icon.system { background: #f3e8ff; }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-title {
            font-weight: 500;
            font-size: 0.9375rem;
            margin-bottom: 2px;
        }

        .notification-item.unread .notification-title {
            font-weight: 600;
        }

        .notification-body {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .notification-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        .notification-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .notification-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .notification-item:hover .notification-actions {
            opacity: 1;
        }

        .action-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            margin-left: 8px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .empty-subtitle {
            font-size: 0.875rem;
        }

        /* Load More */
        .load-more {
            text-align: center;
            padding: 16px;
        }

        .load-more-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .load-more-btn:hover {
            background: var(--bg-hover);
        }
    </style>
</head>
<body>
    <div id="app" role="main" aria-label="Notifications">
        <div class="loading" aria-live="polite">Loading notifications</div>
    </div>

    <script src="../shared/mcp-bridge.js"></script>
    <script>
        // Initialize MCP Bridge
        const bridge = new McpBridge();

        // State
        let notifications = [];
        let activeFilter = 'all';
        let isLoading = false;
        let hasMore = true;
        let offset = 0;
        const LIMIT = 20;

        // Category metadata
        const categories = {
            message: { icon: '💬', label: 'Messages', className: 'message' },
            mention: { icon: '@', label: 'Mentions', className: 'mention' },
            call: { icon: '📞', label: 'Calls', className: 'call' },
            system: { icon: '🔔', label: 'System', className: 'system' }
        };

        // Format relative timestamp
        function formatRelativeTime(date) {
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days === 1) return 'Yesterday';
            if (days < 7) return `${days}d ago`;

            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        // Group notifications by date
        function groupByDate(notifs) {
            const groups = {};
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            for (const notif of notifs) {
                const date = new Date(notif.timestamp);
                date.setHours(0, 0, 0, 0);

                let key;
                if (date.getTime() === today.getTime()) {
                    key = 'Today';
                } else if (date.getTime() === yesterday.getTime()) {
                    key = 'Yesterday';
                } else {
                    key = date.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
                }

                if (!groups[key]) groups[key] = [];
                groups[key].push(notif);
            }

            return groups;
        }

        // Get unread count
        function getUnreadCount() {
            return notifications.filter(n => !n.read).length;
        }

        // Get filtered notifications
        function getFilteredNotifications() {
            if (activeFilter === 'all') return notifications;
            return notifications.filter(n => n.type === activeFilter);
        }

        // Render header
        function renderHeader() {
            const unreadCount = getUnreadCount();
            return `
                <header class="header">
                    <div class="header-left">
                        <h1>Notifications</h1>
                        ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
                    </div>
                    <button class="mark-all-btn"
                            onclick="markAllAsRead()"
                            ${unreadCount === 0 ? 'disabled' : ''}
                            aria-label="Mark all notifications as read">
                        Mark all read
                    </button>
                </header>
            `;
        }

        // Render filter tabs
        function renderFilterTabs() {
            const counts = { all: notifications.length };
            for (const type of Object.keys(categories)) {
                counts[type] = notifications.filter(n => n.type === type).length;
            }

            const tabs = [
                { key: 'all', label: 'All', count: counts.all },
                ...Object.entries(categories).map(([key, cat]) => ({
                    key,
                    label: cat.label,
                    count: counts[key]
                }))
            ];

            return `
                <div class="filter-tabs" role="tablist" aria-label="Filter notifications">
                    ${tabs.map(tab => `
                        <button class="filter-tab ${activeFilter === tab.key ? 'active' : ''}"
                                role="tab"
                                aria-selected="${activeFilter === tab.key}"
                                onclick="setFilter('${tab.key}')">
                            ${bridge.escapeHTML(tab.label)}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        // Render notification item
        function renderNotificationItem(notif) {
            const cat = categories[notif.type] || categories.system;
            const time = formatRelativeTime(new Date(notif.timestamp));

            return `
                <div class="notification-item ${notif.read ? '' : 'unread'}"
                     tabindex="0"
                     role="button"
                     data-id="${notif.id}"
                     onclick="handleNotificationClick('${notif.id}')"
                     onkeydown="if(event.key==='Enter')handleNotificationClick('${notif.id}')"
                     aria-label="${notif.read ? '' : 'Unread: '}${bridge.escapeHTML(notif.title)}">
                    <div class="notification-icon ${cat.className}" aria-hidden="true">
                        ${cat.icon}
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">${bridge.escapeHTML(notif.title)}</div>
                        ${notif.body ? `<div class="notification-body">${bridge.escapeHTML(notif.body)}</div>` : ''}
                        <div class="notification-meta">
                            <span class="notification-time">${time}</span>
                            <div class="notification-actions">
                                ${!notif.read ? `
                                    <button class="action-btn"
                                            onclick="event.stopPropagation();markAsRead('${notif.id}')"
                                            aria-label="Mark as read">
                                        ✓ Read
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render notification list
        function renderNotifications() {
            const filtered = getFilteredNotifications();

            if (filtered.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-icon">🔔</div>
                        <div class="empty-title">No notifications</div>
                        <div class="empty-subtitle">You're all caught up!</div>
                    </div>
                `;
            }

            const groups = groupByDate(filtered);
            let html = '';

            for (const [date, notifs] of Object.entries(groups)) {
                html += `
                    <section class="date-group" aria-label="Notifications from ${bridge.escapeHTML(date)}">
                        <h2 class="date-header">${bridge.escapeHTML(date)}</h2>
                        <div class="notification-list">
                            ${notifs.map(renderNotificationItem).join('')}
                        </div>
                    </section>
                `;
            }

            if (hasMore) {
                html += `
                    <div class="load-more">
                        <button class="load-more-btn" onclick="loadMore()">
                            Load more
                        </button>
                    </div>
                `;
            }

            return html;
        }

        // Main render
        function render() {
            const app = document.getElementById('app');

            if (isLoading && notifications.length === 0) {
                app.innerHTML = `<div class="loading" aria-live="polite">Loading notifications</div>`;
                return;
            }

            app.innerHTML = renderHeader() + renderFilterTabs() + renderNotifications();
        }

        // Event handlers
        function setFilter(filter) {
            activeFilter = filter;
            render();
        }

        async function handleNotificationClick(id) {
            const notif = notifications.find(n => n.id === id);
            if (!notif) return;

            // Mark as read
            if (!notif.read) {
                await markAsRead(id);
            }

            // Navigate to related content
            bridge.sendMessage({
                action: 'navigate',
                target: notif.target || notif.type,
                id: notif.targetId
            });
        }

        async function markAsRead(id) {
            const notif = notifications.find(n => n.id === id);
            if (!notif || notif.read) return;

            notif.read = true;
            render();

            try {
                await bridge.callTool('mark_notification_read', { id: id });
            } catch (e) {
                console.log('Could not mark notification as read:', e);
            }
        }

        async function markAllAsRead() {
            const unread = notifications.filter(n => !n.read);
            if (unread.length === 0) return;

            // Update local state
            for (const notif of unread) {
                notif.read = true;
            }
            render();

            try {
                await bridge.callTool('mark_all_notifications_read', {});
            } catch (e) {
                console.log('Could not mark all notifications as read:', e);
            }
        }

        async function loadMore() {
            if (isLoading) return;

            isLoading = true;
            offset += LIMIT;

            try {
                const response = await bridge.callTool('list_notifications', {
                    limit: LIMIT,
                    offset: offset
                });

                if (response && response.notifications) {
                    notifications = [...notifications, ...response.notifications];
                    hasMore = response.hasMore !== false;
                }
            } catch (e) {
                console.log('Could not load more notifications:', e);
                hasMore = false;
            }

            isLoading = false;
            render();
        }

        // Load notifications
        async function loadNotifications() {
            isLoading = true;
            render();

            try {
                const response = await bridge.callTool('list_notifications', {
                    limit: LIMIT,
                    offset: 0
                });

                if (response && response.notifications) {
                    notifications = response.notifications;
                    hasMore = response.hasMore !== false;
                }
            } catch (e) {
                console.log('Could not fetch notifications:', e);
                // Mock data for demo
                notifications = [
                    {
                        id: '1',
                        type: 'message',
                        title: 'New message from Alice',
                        body: 'Hey, are you coming to the meeting?',
                        timestamp: new Date(Date.now() - 1000 * 60 * 5).toISOString(),
                        read: false,
                        target: 'messages',
                        targetId: 'thread-1'
                    },
                    {
                        id: '2',
                        type: 'mention',
                        title: 'Bob mentioned you',
                        body: '@user check out this document',
                        timestamp: new Date(Date.now() - 1000 * 60 * 30).toISOString(),
                        read: false,
                        target: 'messages',
                        targetId: 'thread-2'
                    },
                    {
                        id: '3',
                        type: 'call',
                        title: 'Missed call from Carol',
                        timestamp: new Date(Date.now() - 1000 * 60 * 60 * 2).toISOString(),
                        read: true,
                        target: 'calls',
                        targetId: 'call-1'
                    },
                    {
                        id: '4',
                        type: 'system',
                        title: 'Storage almost full',
                        body: 'You have used 90% of your storage quota',
                        timestamp: new Date(Date.now() - 1000 * 60 * 60 * 24).toISOString(),
                        read: true,
                        target: 'settings',
                        targetId: 'storage'
                    }
                ];
                hasMore = false;
            }

            isLoading = false;
            render();
        }

        // Handle MCP events
        bridge.onToolInput((input) => {
            if (input.notification) {
                // New notification received
                notifications = [input.notification, ...notifications];
                render();
            }
        });

        bridge.onReady(() => {
            loadNotifications();
        });

        // Initial load
        loadNotifications();
    </script>
</body>
</html>
