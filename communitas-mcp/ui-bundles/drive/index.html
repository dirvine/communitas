<body>
    <div id="app">
        <div class="loading">Loading drive...</div>
    </div>
    <script src="../shared/mcp-bridge.js"></script>
    <script>
        // Drive widget - Phase 2.4 implementation + Phase 9.3 AI Context
        const app = document.getElementById('app');
        const bridge = new McpBridge();
        let currentDisk = null;
        let currentPath = '/';
        let selectedFile = null;

        // Upload state - matches Dioxus upload_progress.rs
        const uploads = new Map(); // id -> {id, fileName, progress, total, state}
        let uploadPanelVisible = false;

        // Set initial context on widget load (Phase 9.3)
        function initContext() {
            bridge.setCurrentView('drive', {
                view_mode: 'loading'
            });
        }

        // Upload states
        const UploadState = {
            PENDING: 'pending',
            UPLOADING: 'uploading',
            COMPLETE: 'complete',
            FAILED: 'failed',
            CANCELLED: 'cancelled'
        };

        // Generate upload ID
        function generateUploadId() {
            return 'upload_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // Add file to upload queue
        async function addUpload(file) {
            const uploadId = generateUploadId();
            const upload = {
                id: uploadId,
                fileName: file.name,
                fileSize: file.size,
                progress: 0,
                state: UploadState.PENDING,
                file: file
            };
            uploads.set(uploadId, upload);
            uploadPanelVisible = true;

            // Track pending uploads (Phase 9.3)
            updateUploadContext();

            renderUploadPanel();

            // Start upload
            await performUpload(upload);
        }

        // Update upload context for AI (Phase 9.3)
        function updateUploadContext() {
            const activeUploads = Array.from(uploads.values()).filter(
                u => u.state === UploadState.UPLOADING || u.state === UploadState.PENDING
            );
            if (activeUploads.length > 0) {
                bridge.setPendingActions('upload', activeUploads.map(u => u.id));
            } else {
                bridge.clearPendingActions();
            }
        }

        // Perform the actual upload via MCP
        async function performUpload(upload) {
            upload.state = UploadState.UPLOADING;
            renderUploadPanel();

            try {
                // Read file as base64 (for MCP transmission)
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        // Simulate progress (real impl would use chunked upload)
                        for (let i = 0; i <= 100; i += 10) {
                            if (upload.state === UploadState.CANCELLED) {
                                return;
                            }
                            upload.progress = i;
                            renderUploadPanel();
                            await new Promise(r => setTimeout(r, 100));
                        }

                        // Call MCP upload tool
                        await bridge.callTool('upload_file', {
                            disk_id: currentDisk.id,
                            path: currentPath + upload.fileName,
                            content_base64: reader.result.split(',')[1],
                            content_type: upload.file.type || 'application/octet-stream'
                        });

                        upload.state = UploadState.COMPLETE;
                        upload.progress = 100;
                        updateUploadContext(); // Update pending actions (Phase 9.3)
                        renderUploadPanel();

                        // Refresh file list
                        loadFiles(currentDisk.id, currentPath);
                    } catch (err) {
                        upload.state = UploadState.FAILED;
                        upload.error = err.message;
                        updateUploadContext(); // Update pending actions (Phase 9.3)
                        bridge.setErrorState('internal', `Upload failed: ${err.message}`, {
                            recoverable: true,
                            recovery_hint: 'Try uploading the file again'
                        });
                        renderUploadPanel();
                    }
                };
                reader.onerror = () => {
                    upload.state = UploadState.FAILED;
                    upload.error = 'Failed to read file';
                    renderUploadPanel();
                };
                reader.readAsDataURL(upload.file);
            } catch (err) {
                upload.state = UploadState.FAILED;
                upload.error = err.message;
                renderUploadPanel();
            }
        }

        // Cancel upload
        function cancelUpload(uploadId) {
            const upload = uploads.get(uploadId);
            if (upload && upload.state === UploadState.UPLOADING) {
                upload.state = UploadState.CANCELLED;
                updateUploadContext(); // Update pending actions (Phase 9.3)
                renderUploadPanel();
            }
        }

        // Dismiss completed/failed upload
        function dismissUpload(uploadId) {
            uploads.delete(uploadId);
            if (uploads.size === 0) {
                uploadPanelVisible = false;
            }
            updateUploadContext(); // Update pending actions (Phase 9.3)
            renderUploadPanel();
        }

        // Render upload panel
        function renderUploadPanel() {
            let existingPanel = document.getElementById('upload-panel');
            if (existingPanel) {
                existingPanel.remove();
            }

            if (!uploadPanelVisible || uploads.size === 0) {
                return;
            }

            const activeCount = Array.from(uploads.values()).filter(u => u.state === UploadState.UPLOADING).length;
            const completedCount = Array.from(uploads.values()).filter(u => u.state === UploadState.COMPLETE).length;

            let headerText = 'Uploads';
            if (activeCount > 0) {
                headerText = `Uploading ${activeCount} file(s)...`;
            } else if (completedCount === uploads.size) {
                headerText = 'Uploads complete';
            }

            const panelHtml = `
                <div class="upload-panel" id="upload-panel" role="region" aria-label="Upload progress">
                    <div class="upload-header">
                        <h3>${headerText}</h3>
                        <div class="upload-header-actions">
                            ${completedCount > 0 ? `<button class="upload-dismiss" onclick="clearCompletedUploads()">Clear</button>` : ''}
                            <button class="upload-close" onclick="closeUploadPanel()" aria-label="Close upload panel">&times;</button>
                        </div>
                    </div>
                    <div class="upload-list">
                        ${Array.from(uploads.values()).map(u => renderUploadItem(u)).join('')}
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', panelHtml);
        }

        function renderUploadItem(upload) {
            const statusClass = upload.state;
            const progressClass = upload.state === UploadState.COMPLETE ? 'complete' : (upload.state === UploadState.FAILED ? 'failed' : '');
            const statusLabel = upload.state === UploadState.UPLOADING ? `${upload.progress}%` : upload.state.charAt(0).toUpperCase() + upload.state.slice(1);

            return `
                <div class="upload-item" data-upload-id="${upload.id}">
                    <div class="upload-item-header">
                        <span class="upload-filename" title="${bridge.escapeHTML(upload.fileName)}">${bridge.escapeHTML(upload.fileName)}</span>
                        <span class="upload-status ${statusClass}">${statusLabel}</span>
                    </div>
                    ${upload.state === UploadState.UPLOADING || upload.state === UploadState.PENDING ? `
                        <div class="upload-progress-bar">
                            <div class="upload-progress-fill ${progressClass}" style="width: ${upload.progress}%"></div>
                        </div>
                    ` : ''}
                    <div class="upload-actions">
                        <span class="upload-size">${formatSize(upload.fileSize)}</span>
                        ${upload.state === UploadState.UPLOADING ? `
                            <button class="upload-cancel" onclick="cancelUpload('${upload.id}')">Cancel</button>
                        ` : `
                            <button class="upload-dismiss" onclick="dismissUpload('${upload.id}')">Dismiss</button>
                        `}
                    </div>
                </div>
            `;
        }

        function closeUploadPanel() {
            uploadPanelVisible = false;
            const panel = document.getElementById('upload-panel');
            if (panel) panel.remove();
        }

        function clearCompletedUploads() {
            for (const [id, upload] of uploads.entries()) {
                if (upload.state === UploadState.COMPLETE || upload.state === UploadState.FAILED || upload.state === UploadState.CANCELLED) {
                    uploads.delete(id);
                }
            }
            if (uploads.size === 0) {
                uploadPanelVisible = false;
            }
            renderUploadPanel();
        }

        // Handle file selection
        function handleFileSelect(files) {
            for (const file of files) {
                addUpload(file);
            }
        }

        // Initialize drop zone
        function initDropZone() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');

            if (!dropZone || !fileInput) return;

            dropZone.addEventListener('click', () => fileInput.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragging');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragging');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragging');
                handleFileSelect(e.dataTransfer.files);
            });

            fileInput.addEventListener('change', (e) => {
                handleFileSelect(e.target.files);
                e.target.value = ''; // Reset for same file selection
            });
        }

        async function loadDrive() {
            try {
                const result = await bridge.callTool('list_disks', {});
                const data = JSON.parse(result.content[0].text);
                if (data.disks && data.disks.length > 0) {
                    currentDisk = data.disks[0];

                    // Clear any previous error state (Phase 9.3)
                    bridge.clearErrorState();

                    loadFiles(currentDisk.id, '/');
                } else {
                    app.innerHTML = '<div class="loading">No disks available</div>';
                    bridge.setCurrentView('drive', { view_mode: 'empty' });
                }
            } catch (err) {
                const errorMsg = bridge.escapeHTML(err.message || 'Unknown error');
                app.innerHTML = `<div class="loading">Error: ${errorMsg}</div>`;

                // Set error context for AI troubleshooting (Phase 9.3)
                bridge.setErrorState('network', err.message || 'Failed to load disks', {
                    recoverable: true,
                    recovery_hint: 'Try refreshing or check your network connection'
                });
            }
        }

        async function loadFiles(diskId, path) {
            currentPath = path;
            try {
                const result = await bridge.callTool('list_files', { disk_id: diskId, path });
                const data = JSON.parse(result.content[0].text);

                // Update AI context with current location (Phase 9.3)
                bridge.setCurrentView('drive', {
                    view_mode: 'browser',
                    view_id: diskId,
                    path: path,
                    file_count: (data.entries || []).length
                });
                bridge.clearSelectionState();
                bridge.clearErrorState();

                renderFiles(data);
            } catch (err) {
                const errorMsg = bridge.escapeHTML(err.message || 'Unknown error');
                app.innerHTML = `<div class="loading">Error: ${errorMsg}</div>`;

                // Set error context for AI troubleshooting (Phase 9.3)
                bridge.setErrorState('network', err.message || 'Failed to load files', {
                    recoverable: true,
                    recovery_hint: 'Try navigating to a different folder or refresh'
                });
            }
        }

        function renderFiles(data) {
            const files = data.entries || [];
            const usedPercent = data.quota ? (data.used / data.quota * 100) : 0;
            const quotaText = data.quota ? `${formatSize(data.used || 0)} / ${formatSize(data.quota)}` : '';

            const html = `
                <div class="drive-header">
                    <div class="breadcrumb" role="navigation" aria-label="File path">
                        ${renderBreadcrumb(currentPath)}
                    </div>
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <button class="upload-trigger" onclick="document.getElementById('file-input').click()" aria-label="Upload files">
                            ⬆️ Upload
                        </button>
                        <div class="quota-bar" role="meter" aria-label="Storage used: ${quotaText}" aria-valuenow="${Math.round(usedPercent)}" aria-valuemin="0" aria-valuemax="100">
                            <div class="quota-fill" style="width: ${usedPercent}%"></div>
                        </div>
                    </div>
                </div>
                <input type="file" id="file-input" class="file-input" multiple aria-hidden="true">
                <div class="drive-content">
                    <div class="file-list">
                        <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Drop files here or click to upload">
                            <div class="drop-zone-icon">📤</div>
                            <div class="drop-zone-text">Drop files here or click to upload</div>
                            <div class="drop-zone-hint">Supports multiple files</div>
                        </div>
                        <div class="file-grid" role="list" aria-label="Files and folders">
                            ${files.map(f => renderFileItem(f)).join('')}
                            ${files.length === 0 ? '<div class="loading">Empty folder</div>' : ''}
                        </div>
                    </div>
                    <div class="preview-panel" id="preview" role="complementary" aria-label="File preview"></div>
                </div>
            `;
            app.innerHTML = html;

            // Initialize event handlers
            initDropZone();

            document.querySelectorAll('.file-item').forEach(item => {
                item.addEventListener('click', () => selectFile(item.dataset.id, item.dataset.name, item.dataset.type));
                item.addEventListener('dblclick', () => {
                    if (item.dataset.type === 'directory') {
                        loadFiles(currentDisk.id, `${currentPath}${item.dataset.name}/`);
                    }
                });
            });

            // Re-render upload panel if visible
            if (uploadPanelVisible) {
                renderUploadPanel();
            }
        }

        function renderBreadcrumb(path) {
            const parts = path.split('/').filter(p => p);
            let html = '<span data-path="/">Home</span>';
            let accumulated = '/';
            parts.forEach(part => {
                accumulated += part + '/';
                html += ` / <span data-path="${accumulated}">${part}</span>`;
            });
            return html;
        }

        function renderFileItem(file) {
            const icon = file.is_directory ? '📁' : getFileIcon(file.name);
            return `
                <div class="file-item" data-id="${file.id}" data-name="${file.name}" data-type="${file.is_directory ? 'directory' : 'file'}">
                    <div class="file-icon">${icon}</div>
                    <div class="file-name">${file.name}</div>
                    ${!file.is_directory ? `<div class="file-size">${formatSize(file.size)}</div>` : ''}
                </div>
            `;
        }

        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                pdf: '📄', doc: '📝', docx: '📝', txt: '📄',
                jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️',
                mp3: '🎵', wav: '🎵', mp4: '🎬', mov: '🎬',
                zip: '📦', rar: '📦', js: '📜', ts: '📜',
            };
            return icons[ext] || '📄';
        }

        function formatSize(bytes) {
            if (!bytes) return '';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return `${bytes.toFixed(1)} ${units[i]}`;
        }

        // Get file extension for MIME type guessing
        function getFileMimeType(name) {
            const ext = name.split('.').pop().toLowerCase();
            const mimeTypes = {
                // Images
                jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml',
                // Text
                txt: 'text/plain', md: 'text/markdown', json: 'application/json', xml: 'text/xml', html: 'text/html', css: 'text/css', js: 'text/javascript',
                // Documents
                pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
                // Audio/Video
                mp3: 'audio/mpeg', wav: 'audio/wav', mp4: 'video/mp4', webm: 'video/webm',
                // Archives
                zip: 'application/zip', tar: 'application/x-tar', gz: 'application/gzip'
            };
            return mimeTypes[ext] || 'application/octet-stream';
        }

        // Check if file is previewable
        function isImageFile(name) {
            return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(name);
        }

        function isTextFile(name) {
            return /\.(txt|md|json|xml|html|css|js|ts|rs|py|java|go|c|cpp|h|yml|yaml|toml|ini|cfg|log)$/i.test(name);
        }

        // Format date for preview
        function formatDate(timestamp) {
            if (!timestamp) return 'Unknown';
            const date = new Date(timestamp);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        async function selectFile(id, name, type) {
            selectedFile = { id, name, type };
            document.querySelectorAll('.file-item').forEach(i => i.classList.remove('selected'));
            document.querySelector(`[data-id="${id}"]`)?.classList.add('selected');

            // Update AI context with selected file (Phase 9.3)
            bridge.setSelectionState(type === 'directory' ? 'folder' : 'file', [id]);
            bridge.setCurrentView('drive', {
                view_mode: 'preview',
                view_id: currentDisk?.id,
                path: currentPath,
                selected_file: name,
                selected_type: type
            });
            bridge.sendMessageWithContext(`User selected ${type}: ${name}`);

            const preview = document.getElementById('preview');
            preview.classList.add('open');

            // Show loading state
            preview.innerHTML = `
                <div class="preview-header">
                    <h2 title="${bridge.escapeHTML(name)}">${bridge.escapeHTML(name)}</h2>
                    <button class="preview-close" onclick="closePreview()" aria-label="Close preview">&times;</button>
                </div>
                <div class="preview-content">
                    <div class="preview-loading">
                        <div class="spinner"></div>
                        <span>Loading preview...</span>
                    </div>
                </div>
            `;

            // For directories, show folder info only
            if (type === 'directory') {
                renderPreview({
                    name: name,
                    type: 'Folder',
                    isDirectory: true
                });
                return;
            }

            // Try to load file preview via MCP
            try {
                const result = await bridge.callTool('get_file_preview', {
                    disk_id: currentDisk.id,
                    path: currentPath + name
                });
                const data = JSON.parse(result.content[0].text);
                renderPreview({
                    name: name,
                    type: data.mime_type || getFileMimeType(name),
                    size: data.size_bytes,
                    modified: data.modified_at,
                    created: data.created_at,
                    checksum: data.checksum,
                    thumbnail: data.thumbnail_base64,
                    textPreview: data.text_preview,
                    isDirectory: false
                });
            } catch (err) {
                // Fallback to basic preview
                renderPreview({
                    name: name,
                    type: getFileMimeType(name),
                    isDirectory: false,
                    error: 'Preview unavailable'
                });
            }
        }

        function renderPreview(data) {
            const preview = document.getElementById('preview');
            const icon = data.isDirectory ? '📁' : getFileIcon(data.name);
            const isImage = !data.isDirectory && isImageFile(data.name);
            const isText = !data.isDirectory && isTextFile(data.name);

            let thumbnailHtml = '';
            if (data.thumbnail) {
                thumbnailHtml = `
                    <div class="preview-thumbnail">
                        <img src="data:${data.type};base64,${data.thumbnail}" alt="Preview of ${bridge.escapeHTML(data.name)}">
                    </div>
                `;
            } else {
                thumbnailHtml = `
                    <div class="preview-thumbnail">
                        <span class="icon-large">${icon}</span>
                    </div>
                `;
            }

            let textPreviewHtml = '';
            if (data.textPreview && isText) {
                textPreviewHtml = `
                    <div class="preview-text">${bridge.escapeHTML(data.textPreview)}</div>
                `;
            }

            let metadataHtml = `
                <dl class="preview-meta">
                    <dt>Type</dt>
                    <dd>${bridge.escapeHTML(data.type)}</dd>
            `;

            if (data.size !== undefined) {
                metadataHtml += `
                    <dt>Size</dt>
                    <dd>${formatSize(data.size)}</dd>
                `;
            }

            if (data.modified) {
                metadataHtml += `
                    <dt>Modified</dt>
                    <dd>${formatDate(data.modified)}</dd>
                `;
            }

            if (data.created) {
                metadataHtml += `
                    <dt>Created</dt>
                    <dd>${formatDate(data.created)}</dd>
                `;
            }

            if (data.checksum) {
                metadataHtml += `
                    <dt>Checksum</dt>
                    <dd class="checksum" title="${bridge.escapeHTML(data.checksum)}">${bridge.escapeHTML(data.checksum.substring(0, 32))}...</dd>
                `;
            }

            metadataHtml += '</dl>';

            preview.innerHTML = `
                <div class="preview-header">
                    <h2 title="${bridge.escapeHTML(data.name)}">${bridge.escapeHTML(data.name)}</h2>
                    <button class="preview-close" onclick="closePreview()" aria-label="Close preview">&times;</button>
                </div>
                <div class="preview-content">
                    ${thumbnailHtml}
                    ${textPreviewHtml}
                    ${metadataHtml}
                </div>
                <div class="preview-footer actions">
                    ${!data.isDirectory ? `<button class="btn btn-primary" onclick="downloadFile('${bridge.escapeHTML(data.name)}')">Download</button>` : ''}
                    <button class="btn btn-secondary" onclick="deleteFile('${bridge.escapeHTML(data.name)}')">Delete</button>
                </div>
            `;
        }

        function closePreview() {
            const preview = document.getElementById('preview');
            preview.classList.remove('open');
            preview.innerHTML = '';
            selectedFile = null;
            document.querySelectorAll('.file-item').forEach(i => i.classList.remove('selected'));

            // Clear selection context (Phase 9.3)
            bridge.clearSelectionState();
            bridge.setCurrentView('drive', {
                view_mode: 'browser',
                view_id: currentDisk?.id,
                path: currentPath
            });
        }

        async function downloadFile(name) {
            // Track pending download action (Phase 9.3)
            bridge.setPendingActions('download', [selectedFile?.id || name]);

            try {
                const result = await bridge.callTool('download_file', {
                    disk_id: currentDisk.id,
                    path: currentPath + name
                });

                // Clear pending action on success (Phase 9.3)
                bridge.clearPendingActions();

                bridge.sendMessageWithContext(`Downloaded file: ${name}`);
            } catch (err) {
                console.error('Download failed:', err);

                // Set error context for AI troubleshooting (Phase 9.3)
                bridge.setErrorState('internal', `Download failed: ${err.message}`, {
                    recoverable: true,
                    recovery_hint: 'Check your network connection and try again'
                });
                bridge.clearPendingActions();
            }
        }

        async function deleteFile(name) {
            if (!confirm(`Delete "${name}"?`)) return;

            // Track pending delete action (Phase 9.3)
            bridge.setPendingActions('delete', [selectedFile?.id || name]);

            try {
                await bridge.callTool('delete_file', {
                    disk_id: currentDisk.id,
                    path: currentPath + name
                });

                // Clear pending action on success (Phase 9.3)
                bridge.clearPendingActions();
                bridge.clearErrorState();

                closePreview();
                loadFiles(currentDisk.id, currentPath);
            } catch (err) {
                console.error('Delete failed:', err);

                // Set error context for AI troubleshooting (Phase 9.3)
                bridge.setErrorState('internal', `Failed to delete: ${err.message}`, {
                    recoverable: true,
                    recovery_hint: 'Check permissions or try again'
                });
                bridge.clearPendingActions();
            }
        }

        // Initialize context and load drive (Phase 9.3)
        bridge.onReady(() => {
            initContext();
            loadDrive();
        });
    </script>
</body>
</html>
