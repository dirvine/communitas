[package]
name = "communitas-desktop"
version = "0.1.20"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Communitas desktop app (Tauri) — local-first PQC collaboration"
default-run = "communitas-desktop"
include = [
    "src/**/*",
    "Cargo.toml",
    "build.rs",
    "../dist/**/*",
    "icons/**/*",
    "tauri.conf.json",
]

[[bin]]
name = "communitas-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.5.1", features = [] }

[features]
default = ["gossip_overlay"]
gossip_overlay = []


[dependencies]
# Core business logic
communitas-core = { version = "0.1.20", path = "../communitas-core" }

# Saorsa Core ecosystem
# Removed: saorsa-core - replaced with saorsa-gossip-* crates in communitas-core

# Saorsa Gossip - P2P networking layer (required, no longer optional)
saorsa-gossip-types = { workspace = true }
saorsa-gossip-identity = { workspace = true }
saorsa-gossip-transport = { workspace = true }
saorsa-gossip-membership = { workspace = true }
saorsa-gossip-pubsub = { workspace = true }

# Real-time multimedia (WebRTC over QUIC) - Using core library (Tauri plugin incompatible with Tauri 2.x)
saorsa-webrtc-core = { workspace = true }
saorsa-webrtc-codecs = { workspace = true }

# Security: openh264-sys2 0.9.0 forced via communitas-core dependency (RUSTSEC-2025-0008 mitigation)

# CRDT and Database
yrs = { version = "0.19", features = ["sync"] }
libsql = "0.3"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
four-word-networking = "2.6"
blake3 = "1.0"
base64 = "0.22"
rand = "0.8"
dirs = "5.0"

# TLS/Security
rustls = "0.23"
rustls-pemfile = "2.0"

# macOS Touch ID / biometric authentication
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"

# Tauri framework - pinned versions for stability (see TAURI_VERSION_RESOLUTION.md)
tauri = { version = "=2.9.2", features = ["custom-protocol"] }
tauri-plugin-dialog = { version = "=2.4.0" }
tauri-plugin-log = { version = "=2.7.1" }
tauri-plugin-updater = { version = "=2.9.0" }

# Async runtime (re-export from workspace)
tokio = { version = "1.39", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

lazy_static = "1.4"
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.0"

# Disabled until scaffolding tests are complete
# [[test]]
# name = "integration_tests"
# path = "tests/integration_tests.rs"
