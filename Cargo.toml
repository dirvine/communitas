[workspace]
resolver = "2"
members = [
    "communitas-core",
    "communitas-dioxus",    # Dioxus desktop prototype
    "communitas-headless",  # Bootstrap nodes
    "communitas-p2p-test",
    "communitas-kanban",    # CRDT-based Kanban system
    "communitas-mcp",       # MCP server for AI agent control (HTTP/HTTPS + stdio)
    "communitas-ui-api",    # Shared view models for GUI stacks
    "tests/distributed/orchestrator", "communitas-ui-service",  # Distributed test orchestrator
    "communitas-bench",  # Distributed test orchestrator
    "communitas-workspace-hack",      # Criterion benchmarks
]

[workspace.package]
version = "0.8.6"
edition = "2024"
authors = ["David Irvine <david.irvine@maidsafe.net>", "Saorsa Labs"]
license = "GPL-3.0"
repository = "https://github.com/saorsalabs/communitas"
homepage = "https://communitas.life"

[workspace.dependencies]
# Saorsa Core ecosystem (will be phased out in favor of saorsa-gossip)
# Removed: saorsa-core - migrated to saorsa-gossip-* architecture
saorsa-mls = "0.1.5"
saorsa-rsps = "0.2.0"
saorsa-pqc = "0.4.0"

# Saorsa Gossip ecosystem - updated to 0.5.0
saorsa-gossip-types = "0.5.0"
saorsa-gossip-identity = "0.5.0"
saorsa-gossip-crdt-sync = "0.5.0"
saorsa-gossip-groups = "0.5.0"
saorsa-gossip-presence = "0.5.0"
saorsa-gossip-transport = "0.5.0"
saorsa-gossip-membership = "0.5.0"
saorsa-gossip-pubsub = "0.5.0"
saorsa-gossip-coordinator = "0.5.0"
saorsa-gossip-rendezvous = "0.5.0"
saorsa-gossip-runtime = "0.5.0"
# Security: openh264-sys2 0.9.x requires rustc 1.88+, using 0.8.0 until CI upgrades
openh264-sys2 = "0.8.0"

# Real-time multimedia (WebRTC over QUIC)
saorsa-webrtc-core = "0.3.0"
saorsa-webrtc-codecs = "0.3.0"

# Networking
four-word-networking = "2.6"

# Async runtime
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web framework (for bridge server)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.23"

# OpenTelemetry
opentelemetry = { version = "0.22", features = ["metrics"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.15", features = ["tonic", "metrics"] }

# Cryptography
blake3 = "1.0"
rand = "0.8"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# CLI parsing
clap = "4"

# CRDT
yrs = { version = "0.19", features = ["sync"] }

# Canvas (Saorsa Canvas integration - ADR-021)
# Using crates.io version for publishing compatibility
canvas-core = { version = "0.1.2", default-features = false, features = ["std"] }

# Security patches for transitive dependencies

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[patch.crates-io]
saorsa-gossip-types = { path = "../saorsa-gossip/crates/types" }
saorsa-gossip-identity = { path = "../saorsa-gossip/crates/identity" }
saorsa-gossip-crdt-sync = { path = "../saorsa-gossip/crates/crdt-sync" }
saorsa-gossip-groups = { path = "../saorsa-gossip/crates/groups" }
saorsa-gossip-presence = { path = "../saorsa-gossip/crates/presence" }
saorsa-gossip-transport = { path = "../saorsa-gossip/crates/transport" }
saorsa-gossip-membership = { path = "../saorsa-gossip/crates/membership" }
saorsa-gossip-pubsub = { path = "../saorsa-gossip/crates/pubsub" }
saorsa-gossip-coordinator = { path = "../saorsa-gossip/crates/coordinator" }
saorsa-gossip-rendezvous = { path = "../saorsa-gossip/crates/rendezvous" }
saorsa-gossip-runtime = { path = "../saorsa-gossip/crates/runtime" }
ant-quic = { path = "../ant-quic" }
