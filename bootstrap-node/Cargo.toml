[package]
name = "communitas-bootstrap"
version = "0.1.0"
edition = "2021"
authors = ["David Irvine <david.irvine@maidsafe.net>"]
license = "GPL-3.0"
description = "Bootstrap node for Communitas P2P network"

[dependencies]
# Core dependencies
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Saorsa ecosystem
saorsa-gossip = "0.2"
saorsa-pqc = "0.3"
ant-quic = "0.1"

# Metrics
prometheus = { version = "0.13", optional = true }
warp = { version = "0.3", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[features]
default = ["metrics"]
metrics = ["prometheus", "warp"]

[[bin]]
name = "bootstrap-node"
path = "src/main.rs"