name: Communitas
options:
  bundleIdPrefix: com.saorsalabs
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

packages:
  CommunitasKit:
    path: CommunitasKit

targets:
  Communitas-iOS:
    type: application
    platform: iOS
    sources:
      - path: CommunitasApp/Sources
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: CommunitasKit
      - framework: CommunitasBindings.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.saorsalabs.communitas.ios
        PRODUCT_NAME: Communitas
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_CFBundleDisplayName: Communitas
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.10"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/CommunitasBindings.xcframework/ios-arm64"
          - "$(PROJECT_DIR)/CommunitasBindings.xcframework/ios-arm64-simulator"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/CommunitasBindings.xcframework/ios-arm64/Headers"
          - "$(PROJECT_DIR)/CommunitasBindings.xcframework/ios-arm64-simulator/Headers"
        OTHER_LDFLAGS:
          - "-lcommunitas_bindings"
          - "-lc++"
          - "-framework Security"
          - "-framework SystemConfiguration"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Owholemodule

  Communitas-macOS:
    type: application
    platform: macOS
    sources:
      - path: CommunitasApp/Sources
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: CommunitasKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.saorsalabs.communitas.macos
        PRODUCT_NAME: Communitas
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_CFBundleDisplayName: Communitas
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        SWIFT_VERSION: "5.10"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../target/aarch64-apple-darwin/debug"
          - "$(PROJECT_DIR)/../target/aarch64-apple-darwin/release"
        OTHER_LDFLAGS:
          - "-lcommunitas_bindings"
          - "-lc++"
          - "-framework Security"
          - "-framework SystemConfiguration"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "$(PROJECT_DIR)/../target/aarch64-apple-darwin/debug"
          - "$(PROJECT_DIR)/../target/aarch64-apple-darwin/release"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Owholemodule

schemes:
  Communitas-iOS:
    build:
      targets:
        Communitas-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Communitas-macOS:
    build:
      targets:
        Communitas-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
