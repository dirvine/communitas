[workspace]
resolver = "2"
members = [
    "communitas-core",
    "communitas-dioxus",
    "communitas-kanban",
    "communitas-ui-api",
    "communitas-ui-service",
    "communitas-bench",
    "communitas-x0x-client",
]

[workspace.package]
version = "0.11.10"
edition = "2024"
authors = ["David Irvine <david.irvine@maidsafe.net>", "Saorsa Labs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/saorsalabs/communitas"
homepage = "https://communitas.life"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.23"

# OpenTelemetry
opentelemetry = { version = "0.22", features = ["metrics"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.15", features = ["tonic", "metrics"] }

# Cryptography
blake3 = "1.0"
rand = "0.8"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# CLI parsing
clap = "4"

# CRDT
yrs = { version = "0.19", features = ["sync"] }

# Canvas (Saorsa Canvas integration - ADR-021)
# Using crates.io version for publishing compatibility
canvas-core = { version = "0.1.2", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
