[package]
name = "communitas-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Terminal UI for Communitas - test all backend features"

[lib]
name = "communitas_tui"
path = "src/lib.rs"

[[bin]]
name = "communitas-tui"
path = "src/main.rs"

[dependencies]
# Core business logic
communitas-core = { version = "0.1.19", path = "../communitas-core" }

# Saorsa Core
# Removed: saorsa-core - using four-word-networking and communitas-core instead

# TUI framework
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Component framework for interactive UIs
tuirealm = "3.0"
tui-realm-stdlib = "2.0"

# Image rendering (Sixel/Kitty protocols)
ratatui-image = { version = "1.0", features = ["crossterm"] }

# QR code generation
qrcode = "0.14"

# Charts and graphs
plotters = "0.3"
plotters-backend = "0.3"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# HTTP Control API
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utils
uuid = { workspace = true }
chrono = { workspace = true }
dirs = "5.0"
four-word-networking = { workspace = true }
rand.workspace = true

# Self-update functionality
self_update = "0.41"

[dev-dependencies]
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4"
futures = "0.3"

[[bench]]
name = "performance_tests"
harness = false
