[package]
name = "communitas-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core business logic for Communitas - PQC collaboration with virtual disks"

[dependencies]
# Saorsa Gossip - P2P networking layer (required, no longer optional)
saorsa-gossip-types = "0.1.5"
saorsa-gossip-identity = "0.1.5"
saorsa-gossip-crdt-sync = "0.1.5"
saorsa-gossip-groups = "0.1.5"
saorsa-gossip-presence = "0.1.4"  # 0.1.5 not yet published
saorsa-gossip-transport = "0.1.5"
saorsa-gossip-membership = "0.1.5"
saorsa-gossip-pubsub = "0.1.5"
saorsa-gossip-coordinator = "0.1.5"
saorsa-gossip-rendezvous = "0.1.5"

# Real-time multimedia (WebRTC over QUIC)
saorsa-webrtc.workspace = true

# Keep PQC for encryption (not tied to saorsa-core)
saorsa-pqc = "0.3.12"
fips204 = "0.4"  # Direct dependency for ML-DSA traits and methods

# CRDT for document collaboration (Sprint 3.2)
# sync feature enables Send + Sync traits for multithreaded environments
yrs = { version = "0.19", features = ["sync"] }

# Async runtime
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"  # Replace deprecated serde_cbor
serde_bytes = "0.11"
bincode = "1.3"
toml = "0.8"
bytes = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
log = "0.4"

# Cryptography and security
blake3 = "1.0"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"  # For deterministic key generation from identity seed
# ed25519-dalek = "2"  # REMOVED: Using post-quantum ML-DSA from saorsa-pqc instead
argon2 = "0.5"
zeroize = "1.7"
secrecy = "0.8"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
url = "2.5"

# Database and storage
rusqlite = { version = "0.37", features = ["chrono", "serde_json", "uuid", "bundled"] }
deadpool-sqlite = "0.12.1"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
four-word-networking = "2.6"
getrandom = "0.2"
base64 = "0.22"
regex = "1.10"
lazy_static = "1.4"
validator = { version = "0.20", features = ["derive"] }
local-ip-address = "0.6"

# Compression
flate2 = "1.0"

# File operations
mime_guess = "2.0"
tempfile = "3.0"
dirs = "5.0"

# Secure storage (platform-specific)
keyring = "3.2"

# Local dependencies


[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
tempfile = "3.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["ring"] }
