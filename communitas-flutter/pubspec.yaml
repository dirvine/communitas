name: communitas
description: A local-first, PQC-ready collaboration platform.
publish_to: 'none'
version: 0.1.53+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # FFI bindings (flutter_rust_bridge)
  flutter_rust_bridge: ^2.0.0
  ffi: ^2.1.0

  # UI components
  cupertino_icons: ^1.0.6
  flutter_markdown: ^0.6.18
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # WebRTC (voice/video/screenshare)
  flutter_webrtc: ^0.9.47

  # Utils
  uuid: ^4.3.1
  intl: ^0.18.1
  collection: ^1.18.0
  freezed_annotation: ^2.4.1

  # HTTP client for bridge communication
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  mockito: ^5.4.4
  ffigen: ^20.1.1
  freezed: ^2.4.6

flutter:
  uses-material-design: true

  # Note: Custom fonts (Inter) will be added later
  # For now using system fonts for web demo

  # assets:
  #   - assets/images/
  #   - assets/icons/
