[workspace]
resolver = "2"
members = [
    "communitas-core",
    "communitas-headless",  # Bootstrap nodes
    "communitas-p2p-test",
    "communitas-kanban",    # CRDT-based Kanban system
    "communitas-mcp",       # MCP server for AI agent control (HTTP/HTTPS + stdio)
    "tests/distributed/orchestrator",  # Distributed test orchestrator
]
# communitas-flutter - Flutter GUI with flutter_rust_bridge (separate build)

[workspace.package]
version = "0.1.60"
edition = "2024"
authors = ["David Irvine <david.irvine@maidsafe.net>", "Saorsa Labs"]
license = "GPL-3.0"
repository = "https://github.com/saorsalabs/communitas"
homepage = "https://communitas.life"

[workspace.dependencies]
# Saorsa Core ecosystem (will be phased out in favor of saorsa-gossip)
# Removed: saorsa-core - migrated to saorsa-gossip-* architecture
saorsa-mls = "0.1.5"
saorsa-rsps = "0.2.0"
saorsa-pqc = "0.3.12"

# Saorsa Gossip ecosystem - published 0.2.2 versions
saorsa-gossip-types = "0.2.2"
saorsa-gossip-identity = "0.2.2"
saorsa-gossip-crdt-sync = "0.2.2"
saorsa-gossip-groups = "0.2.2"
saorsa-gossip-presence = "0.2.2"
saorsa-gossip-transport = "0.2.2"
saorsa-gossip-membership = "0.2.2"
saorsa-gossip-pubsub = "0.2.2"
saorsa-gossip-coordinator = "0.2.2"
saorsa-gossip-rendezvous = "0.2.2"
saorsa-gossip-runtime = "0.2.2"
openh264-sys2 = "0.9.0"

# Real-time multimedia (WebRTC over QUIC)
saorsa-webrtc-core = "0.2.1"
saorsa-webrtc-codecs = "0.2.1"

# Networking
four-word-networking = "2.6"

# Async runtime
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web framework (for bridge server)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
blake3 = "1.0"
rand = "0.8"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# CLI parsing
clap = "4"

# CRDT
yrs = { version = "0.19", features = ["sync"] }

# Security patches for transitive dependencies

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
