[workspace]
resolver = "2"
members = [
    "communitas-core",
    "communitas-desktop",
    "communitas-headless",
    "communitas-bridge",
    "crates/communitas-container",
]

[workspace.package]
version = "0.1.17"
edition = "2024"
authors = ["David Irvine <david.irvine@maidsafe.net>", "Saorsa Labs"]
license = "GPL-3.0"
repository = "https://github.com/saorsalabs/communitas"
homepage = "https://communitas.life"

[workspace.dependencies]
# Saorsa Core ecosystem
saorsa-core = "0.3"
saorsa-fec = "0.4.11"
saorsa-mls = "0.1.5"
saorsa-rsps = "0.2.0"
saorsa-pqc = "0.3.12"
saorsa-seal = "0.1.2"

# Networking
ant-quic = "0.8.17"
four-word-networking = "2.6"

# Async runtime
tokio = { version = "1.39", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web framework (for bridge server)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography
blake3 = "1.0"
rand = "0.8"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
