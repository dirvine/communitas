# Nginx configuration for Communitas MCP Server
# Place in /etc/nginx/sites-available/communitas-mcp.conf
# Symlink to /etc/nginx/sites-enabled/

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=30r/s;

# Upstream MCP server
upstream communitas_mcp {
    server 127.0.0.1:8443;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mcp.saorsalabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.saorsalabs.com;

    # TLS configuration
    ssl_certificate /etc/letsencrypt/live/mcp.saorsalabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.saorsalabs.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MCP:10m;
    ssl_session_tickets off;

    # Modern TLS only
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (comment out if not ready)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS for MCP Apps (widgets in iframes)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age "86400" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header Access-Control-Max-Age "86400";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Logging
    access_log /var/log/nginx/mcp-access.log combined;
    error_log /var/log/nginx/mcp-error.log warn;

    # MCP JSON-RPC endpoint
    location /mcp {
        limit_req zone=mcp_limit burst=50 nodelay;

        proxy_pass http://communitas_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://communitas_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # No rate limit for health checks
        access_log off;
    }

    # Prometheus metrics endpoint (restrict access)
    location /metrics {
        # Only allow from localhost and Prometheus server
        allow 127.0.0.1;
        allow ::1;
        # Add Prometheus server IP here:
        # allow 10.0.0.0/8;
        deny all;

        proxy_pass http://communitas_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # UI Resources (widgets)
    location /ui/ {
        limit_req zone=mcp_limit burst=100 nodelay;

        proxy_pass http://communitas_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache widget assets
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Deny access to sensitive paths
    location ~ /\. {
        deny all;
    }
}
