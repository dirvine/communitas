# Simple testnet config with API server enabled
identity = "test-moon-ocean-star"

bootstrap_nodes = []

[storage]
base_dir = "./storage"
cache_size_mb = 512
enable_fec = true
fec_k = 3
fec_m = 2

[network]
listen_addrs = ["0.0.0.0:9000"]
enable_ipv6 = false
enable_webrtc = false
quic_idle_timeout_ms = 30000
quic_max_streams = 100

[update]
channel = "stable"
check_interval_secs = 86400
auto_update = false
jitter_secs = 0

[api]
enabled = true
address = "0.0.0.0:9002"