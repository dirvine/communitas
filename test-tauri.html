<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tauri Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .info {
            font-size: 1.2rem;
            margin: 1rem 0;
        }
        .tauri-status {
            padding: 0.5rem 1rem;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Tauri Webview Working!</h1>
        <div class="info">If you can see this, the Tauri webview is functioning correctly.</div>
        <div class="info">Current URL: <span id="url"></span></div>
        <div class="info">User Agent: <span id="userAgent"></span></div>
        <div class="tauri-status" id="tauriStatus">Checking Tauri API...</div>
    </div>

    <script>
        document.getElementById('url').textContent = window.location.href;
        document.getElementById('userAgent').textContent = navigator.userAgent;

        // Check for Tauri
        const tauriStatus = document.getElementById('tauriStatus');
        if (window.__TAURI__) {
            tauriStatus.textContent = '✅ Tauri API is available!';
            tauriStatus.style.background = 'rgba(0,255,0,0.2)';
        } else if (window.location.protocol === 'tauri:') {
            tauriStatus.textContent = '⚠️ Tauri protocol detected but API not loaded';
            tauriStatus.style.background = 'rgba(255,255,0,0.2)';
        } else {
            tauriStatus.textContent = '❌ Not running in Tauri context';
            tauriStatus.style.background = 'rgba(255,0,0,0.2)';
        }

        console.log('Test page loaded successfully!');
        console.log('Tauri available:', !!window.__TAURI__);
        console.log('Protocol:', window.location.protocol);
    </script>
</body>
</html>
