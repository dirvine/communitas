<!DOCTYPE html>
<html>
<head>
    <title>Simple Communitas Test</title>
    <script>
        // Simple test to check if React is loading
        window.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded');

            // Check for React app after a short delay
            setTimeout(() => {
                const root = document.getElementById('root');
                if (root && root.children.length > 0) {
                    console.log('✅ React app rendered!');
                    document.getElementById('status').innerHTML = '<h2 style="color: green">✅ React app is working!</h2>';
                } else {
                    console.log('❌ React app not rendered');
                    document.getElementById('status').innerHTML = '<h2 style="color: red">❌ React app failed to render</h2>';
                }
            }, 3000);
        });
    </script>
</head>
<body>
    <h1>Testing Communitas App</h1>
    <div id="status">Checking...</div>
    <iframe src="http://localhost:1422/" width="100%" height="600" style="border: 1px solid #ccc"></iframe>
</body>
</html>
