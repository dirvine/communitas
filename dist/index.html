    <script>
      // Polyfill TextDecoder and TextEncoder before anything else loads
      if (typeof window.TextDecoder === 'undefined') {
        console.log('[Polyfill] Adding TextDecoder');
        window.TextDecoder = class TextDecoder {
          constructor(encoding = 'utf-8') {
            this.encoding = encoding;
          }
          decode(input) {
            if (!input) return '';
            const bytes = input instanceof ArrayBuffer
              ? new Uint8Array(input)
              : new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
            let result = '';
            for (let i = 0; i < bytes.length; i++) {
              result += String.fromCharCode(bytes[i]);
            }
            return result;
          }
        };
      }

      if (typeof window.TextEncoder === 'undefined') {
        console.log('[Polyfill] Adding TextEncoder');
        window.TextEncoder = class TextEncoder {
          constructor() {}
          encode(input) {
            const bytes = new Uint8Array(input.length);
            for (let i = 0; i < input.length; i++) {
              bytes[i] = input.charCodeAt(i);
            }
            return bytes;
          }
        };
      }
    </script>
