[package]
name = "communitas-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core business logic for Communitas - PQC collaboration with virtual disks"

[dependencies]
# Saorsa Gossip - P2P networking layer (required, no longer optional)
saorsa-gossip-types = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-identity = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-crdt-sync = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-groups = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-presence = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-transport = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-membership = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-pubsub = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-coordinator = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }
saorsa-gossip-rendezvous = { git = "https://github.com/dirvine/saorsa-gossip", branch = "main" }

# Real-time multimedia (WebRTC over QUIC) - Using core library
saorsa-webrtc-core.workspace = true
saorsa-webrtc-codecs.workspace = true

# Security: Force upgrade of openh264-sys2 to fix RUSTSEC-2025-0008
# This overrides the vulnerable 0.7.1 version from saorsa-webrtc-codecs
openh264-sys2.workspace = true

# Keep PQC for encryption (not tied to saorsa-core)
saorsa-pqc = "0.3.12"
fips204 = "0.4"  # Direct dependency for ML-DSA traits and methods

# CRDT for document collaboration (Sprint 3.2)
# sync feature enables Send + Sync traits for multithreaded environments
yrs = { version = "0.19", features = ["sync"] }

# Markdown rendering and sanitization
pulldown-cmark = "0.12"
ammonia = "4.0"

# Async runtime
tokio = { version = "1.39", features = ["full"] }
tokio-retry = "0.3"  # Exponential backoff for resilient retries (MESH_CAPABILITIES.md §3.2)
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"  # Replace deprecated serde_cbor
serde_bytes = "0.11"
bincode = "1.3"
toml = "0.8"
bytes = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
log = "0.4"

# Cryptography and security
blake3 = "1.0"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"  # For deterministic key generation from identity seed
# ed25519-dalek = "2"  # REMOVED: Using post-quantum ML-DSA from saorsa-pqc instead
argon2 = "0.5"
zeroize = "1.7"
secrecy = "0.8"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
url = "2.5"

# Utils
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
four-word-networking = "2.6"
getrandom = "0.2"
base64 = "0.22"
regex = "1.10"
lazy_static = "1.4"
validator = { version = "0.20", features = ["derive"] }
local-ip-address = "0.6"
dirs = "5.0"
keyring = "3.2"
tempfile = "3.0"



# Compression
flate2 = "1.0"

# File operations
mime_guess = "2.0"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials"] }

# Local dependencies


[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
tempfile = "3.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["ring"] }
libfuzzer-sys = "0.4"
# Fuzzing binary commented out - fuzz directory needs to be created
# [[bin]]
# name = "fuzz_crdt_sync"
# path = "fuzz/fuzz_targets/crdt_sync.rs"

