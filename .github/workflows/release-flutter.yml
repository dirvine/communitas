name: Release Flutter App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use tag/pubspec version)'
        required: false

concurrency:
  group: release-flutter-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.27.2'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from pubspec.yaml
            VERSION="v$(grep '^version:' communitas-flutter/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ steps.get-version.outputs.version }}'
            const releaseBody = '## Communitas Desktop App Release\n\n' +
              '### Downloads\n' +
              '- **macOS Universal** (Intel + Apple Silicon): Communitas-macOS-' + version + '.dmg\n' +
              '- **Web Demo**: https://saorsa-labs.github.io/communitas/\n\n' +
              '### Features\n' +
              '- Local-first P2P collaboration platform\n' +
              '- Post-quantum cryptography (ML-DSA-87/ML-KEM-768)\n' +
              '- Four-word identities for human-verifiable addressing\n' +
              '- End-to-end encrypted messaging\n\n' +
              '### Installation\n' +
              '**macOS**: Download the DMG, open it, and drag Communitas to Applications.\n' +
              'The app is signed and notarized by Apple for security.\n\n' +
              '### Headless Node\n' +
              'For server/bootstrap nodes, see the headless binary releases.'

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: 'Communitas ' + version,
              body: releaseBody,
              draft: true,
              prerelease: false
            })
            return data.id

  build-macos:
    permissions:
      contents: write
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            communitas-core/target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Get dependencies
        working-directory: communitas-flutter
        run: flutter pub get

      - name: Build Flutter macOS app (release)
        working-directory: communitas-flutter
        run: flutter build macos --release

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temp keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Clean up
          rm $RUNNER_TEMP/certificate.p12

      - name: Sign app bundle
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH="communitas-flutter/build/macos/Build/Products/Release/communitas.app"

          # Sign the app with hardened runtime
          codesign --force --deep --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --entitlements communitas-flutter/macos/Runner/Release.entitlements \
            "$APP_PATH"

          # Verify signature
          codesign --verify --deep --strict "$APP_PATH"
          echo "App signed successfully"

      - name: Create DMG
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          APP_PATH="communitas-flutter/build/macos/Build/Products/Release/communitas.app"
          DMG_NAME="Communitas-macOS-${VERSION}.dmg"

          # Create DMG with create-dmg
          create-dmg \
            --volname "Communitas" \
            --volicon "$APP_PATH/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "communitas.app" 150 185 \
            --hide-extension "communitas.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "$DMG_NAME" \
            "$APP_PATH" || true

          # Verify DMG was created
          ls -la "$DMG_NAME"

      - name: Sign DMG
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          DMG_NAME="Communitas-macOS-${VERSION}.dmg"

          codesign --force --sign "$MACOS_SIGNING_IDENTITY" "$DMG_NAME"
          codesign --verify "$DMG_NAME"
          echo "DMG signed successfully"

      - name: Notarize DMG
        if: env.MACOS_NOTARIZATION_APPLE_ID != '' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          DMG_NAME="Communitas-macOS-${VERSION}.dmg"

          # Submit for notarization
          xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple "$DMG_NAME"

          echo "DMG notarized and stapled successfully"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Communitas-macOS-${{ needs.create-release.outputs.version }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload unsigned artifact (if no signing)
        if: env.MACOS_CERTIFICATE == ''
        uses: actions/upload-artifact@v4
        with:
          name: Communitas-macOS-unsigned
          path: Communitas-macOS-${{ needs.create-release.outputs.version }}.dmg

  build-web:
    permissions:
      contents: write
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: communitas-flutter
        run: flutter pub get

      - name: Build web (demo mode)
        working-directory: communitas-flutter
        run: flutter build web --release --dart-define=DEMO_MODE=true

      - name: Create web archive
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          cd communitas-flutter/build
          tar -czf "../../Communitas-Web-${VERSION}.tar.gz" web

      - name: Upload web build to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Communitas-Web-${{ needs.create-release.outputs.version }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [create-release, build-macos, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: false
            })
