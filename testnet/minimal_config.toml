identity = "philosophy-truth-prevent-wound"
bootstrap_nodes = [
    "philosophy-truth-prevent-wound",
    "donna-jewish-scorpion-socrates",
]

[storage]
base_dir = "./storage"
cache_size_mb = 512
enable_fec = true
fec_k = 3
fec_m = 2

[network]
listen_addrs = ["0.0.0.0:0"]
enable_ipv6 = false
enable_webrtc = false
quic_idle_timeout_ms = 30000
quic_max_streams = 100

[update]
channel = "stable"
check_interval_secs = 86400
auto_update = false
jitter_secs = 0
