 identity = "raccoon-mount-height-gain"
  bootstrap_nodes = [
      "127.0.0.1:14001",
      "127.0.0.1:14002",
  ]

[storage]
base_dir = "./local-data/node-0"
cache_size_mb = 512
enable_fec = true
fec_k = 4
fec_m = 2

[network]
listen_addrs = ["127.0.0.1:14000"]
enable_ipv6 = false
enable_webrtc = true
quic_idle_timeout_ms = 30000
quic_max_streams = 100

[update]
channel = "stable"
check_interval_secs = 86400
auto_update = false
jitter_secs = 3600
