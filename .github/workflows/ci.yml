name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false

      - name: Rust fmt check
        run: cargo fmt --all -- --check

      - name: Rust audit
        run: |
          cargo install cargo-audit
          # TODO: Remove RUSTSEC-2025-0008 from ignore list once saorsa-webrtc-codecs updates
          # Currently blocked: saorsa-webrtc-codecs 0.2.1 depends on openh264-sys2 0.7.1
          # communitas-core now uses openh264-sys2 0.9.0 (safe) directly as mitigation
          # Track upstream fix: https://github.com/saorsalabs/saorsa-webrtc/issues
          cargo audit --ignore RUSTSEC-2025-0008

      - name: Build dependencies
        run: cargo check --workspace --exclude communitas-desktop --all-features

      - name: Rust clippy policy
        run: |
          # Run clippy with practical checks on library crates
          # Note: unwrap_used/expect_used excluded - too restrictive for test code,
          # better caught in code review per CLAUDE.md policy
          # Excluded:
          # - communitas-desktop: requires Tauri build environment
          # - communitas-bindings: generated Flutter Rust Bridge code uses unimplemented!()
          # - distributed-test-orchestrator: CLI tool uses println!()
          cargo clippy --workspace \
            --exclude communitas-desktop \
            --exclude communitas-bindings \
            --exclude distributed-test-orchestrator \
            --all-features -- \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::print_stdout \
            -D clippy::print_stderr

  headless-build:
    name: Headless Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: false
          shared-key: headless-${{ matrix.os }}-${{ matrix.target }}

      - name: Build headless
        run: cargo build --release -p communitas-headless --target ${{ matrix.target }}

      - name: Smoke test (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          target/${{ matrix.target }}/release/communitas-headless --help >/dev/null
          target/${{ matrix.target }}/release/communitas-headless --version || true

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          target/${{ matrix.target }}/release/communitas-headless.exe --help | Out-Null
          target/${{ matrix.target }}/release/communitas-headless.exe --version

      - name: Show binary info (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          file target/${{ matrix.target }}/release/communitas-headless || true
          ldd target/${{ matrix.target }}/release/communitas-headless | grep 'not found' && { echo 'Missing runtime deps'; exit 1; } || true

      - name: Show binary info (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-Item target/${{ matrix.target }}/release/communitas-headless.exe | Format-List Length,LastWriteTime
          # Basic dep check (Windows doesn't have ldd equivalent in CI)

      - name: Upload headless binary
        uses: actions/upload-artifact@v4
        with:
          name: communitas-headless-${{ matrix.os }}-${{ github.sha }}
          path: target/${{ matrix.target }}/release/communitas-headless${{ matrix.suffix }}
          retention-days: 7

  flutter-build:
    name: Flutter Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: rust-checks
    env:
      # Required by tauri-build for dependency resolution
      DEP_TAURI_DEV: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better npm dependency resolution

      - name: Install dependencies (GTK/WebKit) [Linux]
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libnotify-dev \
            libxtst-dev \
            || true
          # Fallback if 4.1 not available
          sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev || true

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Install dependencies
        working-directory: communitas-flutter
        run: flutter pub get

      - name: Analyze code
        working-directory: communitas-flutter
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: communitas-flutter
        run: flutter test

      - name: Build (${{ matrix.platform }})
        working-directory: communitas-flutter
        run: |
          if [ "${{ matrix.platform }}" = "web" ]; then
            flutter build web --release --dart-define=DEMO_MODE=true
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            flutter build macos --release
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            flutter build linux --release
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: communitas-flutter-${{ matrix.platform }}-${{ github.sha }}
          path: |
            communitas-flutter/build/web/
            communitas-flutter/build/macos/
            communitas-flutter/build/linux/
          retention-days: 7
          if-no-files-found: ignore
