name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security audit daily at 2 AM UTC
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            || sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run cargo audit (security vulnerabilities)
        run: |
          cargo install cargo-audit --locked
          # TODO: Remove RUSTSEC-2025-0008 from ignore list once saorsa-webrtc-codecs updates
          # Currently blocked: saorsa-webrtc-codecs 0.2.1 depends on openh264-sys2 0.7.1
          # communitas-core now uses openh264-sys2 0.9.0 (safe) directly as mitigation
          # Track upstream fix: https://github.com/saorsalabs/saorsa-webrtc/issues
          cargo audit --ignore RUSTSEC-2025-0008

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny (license and dependency checks)
        continue-on-error: true
        run: cargo deny check 2>&1 || echo "cargo-deny completed with warnings"

      - name: Check for unwrap/expect in production code
        run: |
          echo "Scanning for unwrap()/expect()/panic!() in production code..."
          
          # Create a script to check for violations outside of test modules
          cat > check_violations.py << 'EOF'
          import sys
          import re
          import os
          
          def check_file(filepath):
              with open(filepath, 'r') as f:
                  content = f.read()
                  lines = content.split('\n')

              # Find all #[cfg(test)] module positions
              test_module_pattern = r'#\[cfg\(test\)\]'
              test_positions = []
              for match in re.finditer(test_module_pattern, content):
                  test_positions.append(match.start())

              # Find line starts for mapping
              line_starts = [0]
              for i, char in enumerate(content):
                  if char == '\n':
                      line_starts.append(i + 1)

              # Function to get line number from position
              def get_line_num(pos):
                  for i, start in enumerate(line_starts):
                      if pos < start:
                          return i
                  return len(line_starts)

              # Function to check if line is a doc comment
              def is_doc_comment(line_num):
                  if line_num < 1 or line_num > len(lines):
                      return False
                  line = lines[line_num - 1].strip()
                  return line.startswith('///') or line.startswith('//!')

              # Find violations
              violations = []
              patterns = [
                  (r'\.unwrap\(\)', 'unwrap()'),
                  (r'\.expect\(', 'expect()'),
                  (r'panic!\(', 'panic!()')
              ]

              for pattern, name in patterns:
                  for match in re.finditer(pattern, content):
                      pos = match.start()
                      line_num = get_line_num(pos)

                      # Skip doc comments (examples in documentation)
                      if is_doc_comment(line_num):
                          continue

                      # Check if this is after a #[cfg(test)] marker
                      in_test = False
                      for test_pos in test_positions:
                          test_line = get_line_num(test_pos)
                          if line_num > test_line:
                              in_test = True
                              break

                      if not in_test:
                          violations.append((line_num, name, filepath))

              return violations
          
          # Check all Rust files
          total_violations = []
          for crate_dir in ['communitas-core/src', 'communitas-desktop/src', 'communitas-headless/src', 'crates/communitas-container/src']:
              if os.path.exists(crate_dir):
                  for root, dirs, files in os.walk(crate_dir):
                      # Skip test directories
                      dirs[:] = [d for d in dirs if d != 'tests' and d != '__tests__']
                      
                      for file in files:
                          # Skip test files and auto-generated flutter_rust_bridge code
                          if file.endswith('.rs') and 'test' not in file and 'frb_generated' not in file:
                              filepath = os.path.join(root, file)
                              violations = check_file(filepath)
                              total_violations.extend(violations)
          
          # Report results
          if total_violations:
              print(f"❌ SECURITY VIOLATION: Found {len(total_violations)} panic-inducing calls in production code:")
              for line_num, violation_type, filepath in total_violations[:10]:  # Show first 10
                  print(f"  {filepath}:{line_num} - {violation_type}")
              if len(total_violations) > 10:
                  print(f"  ... and {len(total_violations) - 10} more")
              print("\nProduction code must not contain unwrap(), expect(), or panic!() calls")
              print("Use proper error handling with Result types and the ? operator instead")
              sys.exit(1)
          else:
              print("✅ No panic-inducing calls found in production code")
          EOF
          
          python3 check_violations.py

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for potential hardcoded secrets..."

          # Only check for actual string literals containing common secret patterns
          # Exclude variable assignments and function parameters (e.g., "let password = "...")

          SECRET_LITERALS=(
            '"password[^"]*"[a-zA-Z0-9._!@#$%^&*()+-]{8,}'  # Password with 8+ chars
            '"api[_-]?key[^"]*"[a-zA-Z0-9]{16,}'          # API key with 16+ chars
            '"secret[^"]*"[a-zA-Z0-9]{16,}'              # Secret with 16+ chars
            '"token[^"]*"[a-zA-Z0-9]{16,}'              # Token with 16+ chars
            '"-----BEGIN.*PRIVATE.*KEY-----"'           # Private key headers
          )

          # Exclude patterns for false positives
          EXCLUDE_PATTERNS=(
            "password.to_string"
            "password.clone"
            "password.into"
            "password:"
            "password)"
            "api_key:"
            "api_key)"
          )

          VIOLATIONS_FOUND=0
          for pattern in "${SECRET_LITERALS[@]}"; do
            # Find matches in .rs files, excluding test files
            MATCHES=$(find communitas-core/src communitas-desktop/src communitas-headless/src crates/*/src -name "*.rs" 2>/dev/null -not -path "*/tests/*" | \
                     xargs grep -E "${pattern}" 2>/dev/null | \
                     grep -v -E "($(echo "${EXCLUDE_PATTERNS[@]}" | tr ' ' '|'))" | \
                     wc -l || echo 0)

            if [ $MATCHES -gt 0 ]; then
              echo "❌ Found $MATCHES potential hardcoded secrets matching pattern: $pattern"
              VIOLATIONS_FOUND=$((VIOLATIONS_FOUND + MATCHES))
            fi
          done

          if [ $VIOLATIONS_FOUND -gt 0 ]; then
            echo "❌ SECURITY VIOLATION: Found $VIOLATIONS_FOUND potential hardcoded secrets"
            echo "Remove all hardcoded credentials from source code"
            exit 1
          else
            echo "✅ No hardcoded secrets detected"
          fi

      - name: Check Rust code formatting
        run: cargo fmt --check --all

      - name: Build dependencies
        run: cargo check --workspace --all-features

      - name: Run Clippy (security lints)
        run: |
          # Run clippy with security-focused lints only
          # NOTE: Do not use -D warnings here - general warnings are handled in ci.yml
          # This audit focuses specifically on panic-inducing code patterns
          cargo clippy --workspace --all-features -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic
