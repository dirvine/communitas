# Clippy Configuration for Communitas
# See: https://doc.rust-lang.org/clippy/usage.html

# Allow unwrap/expect/panic in test code
# This affects all code marked with #[test], #[cfg(test)], and test module functions
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Cognitive complexity threshold (default is 25)
cognitive-complexity-threshold = 30

# Maximum allowed struct fields
max-struct-bools = 5

# Documentation requirements
missing-docs-in-crate-items = false
