# cargo-deny configuration for communitas
# Ensures all dependency licenses are compatible with MIT OR Apache-2.0

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
# Only allow licenses compatible with MIT OR Apache-2.0
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name = "aws-lc-sys"
expression = "ISC AND (Apache-2.0 OR ISC) AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []

[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# GTK3 bindings are unmaintained (gtk-rs moved to GTK4) but Tauri 2 / Dioxus
# still depend on them for Linux builds. No safe upgrade available — these are
# transitive deps we can't control. Revisit when Tauri ships GTK4 support.
ignore = [
    "RUSTSEC-2024-0370",  # gdk-pixbuf — unmaintained
    "RUSTSEC-2024-0384",  # gdk — unmaintained
    "RUSTSEC-2024-0411",  # gtk — unmaintained
    "RUSTSEC-2024-0412",  # pango — unmaintained
    "RUSTSEC-2024-0413",  # atk — unmaintained
    "RUSTSEC-2024-0415",  # gdk-sys — unmaintained
    "RUSTSEC-2024-0416",  # atk-sys — unmaintained
    "RUSTSEC-2024-0418",  # gio — unmaintained
    "RUSTSEC-2024-0419",  # glib — unmaintained
    "RUSTSEC-2024-0420",  # cairo-rs — unmaintained
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
