[package]
name = "communitas-dioxus"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Dioxus desktop application for Communitas - decentralized collaboration platform"

[features]
default = []
e2e-test-mode = []

[dependencies]
communitas-core = { version = "0.12.3", package = "communitas-core", path = "../communitas-core" }
communitas-ui-api = { version = "0.12.3", path = "../communitas-ui-api" }
communitas-ui-service = { version = "0.12.3", path = "../communitas-ui-service" }
dioxus = { version = "0.7", features = ["desktop", "router", "signals"] }
dioxus-logger = "0.5.1"
tracing.workspace = true
futures.workspace = true
chrono.workspace = true
base64.workspace = true
native-dialog = "0.7"
dirs = "5.0"
communitas-x0x-client = { path = "../communitas-x0x-client" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
pulldown-cmark = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }


[dependencies.tokio]
workspace = true
features = ["rt", "sync"]

[dev-dependencies]
anyhow.workspace = true
dioxus-ssr = "0.7"
dioxus-history = "0.7"
tempfile = "3.10"
tokio-test = { version = "0.4" }
criterion = { version = "0.5", features = ["async_tokio"] }

# Parity-matrix E2E tests live in `tests/e2e/` as a self-contained nested
# Cargo package (see `tests/e2e/Cargo.toml`). They are not registered as
# `[[test]]` entries here because their `x0x-test-harness` path dependency
# does not exist in CI checkouts that only include the communitas repo.
# Run them via `tests/e2e.sh`.

[[bench]]
name = "startup"
harness = false
